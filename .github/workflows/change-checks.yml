name: ca.repo/1 change checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build is fresh and the manifest is valid
        run: node scripts/build.mjs --check
      - name: Branch, trailers, version, changelog, history
        run: node scripts/check-change.mjs origin/${{ github.base_ref }} ${{ github.head_ref }}
