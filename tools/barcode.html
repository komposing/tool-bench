<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barcode maker</title>
<script type="application/json" id="toolbench-tool">
{
  "format": "toolbench.tool/1",
  "id": "TB:barcode",
  "name": "Barcode maker",
  "description": "Type text, get a Code 128 barcode as a PNG image. Every barcode made stays on the page until you delete it. Self-contained: no network, no CA_V3 calls, no settings.",
  "category": "Labels",
  "tags": ["barcode", "code128", "png", "offline"],
  "version": "1.0.0",
  "contract": { "config_keys": [], "requires": [] },
  "sandbox": { "scripts": true, "forms": false, "modals": false, "popups": false, "downloads": true, "sameOrigin": false },
  "config": {}
}
</script>
<style>
:root{--bg:#FBFAF7;--panel:#F3F1EC;--line:#DEDAD1;--ink:#12161A;--ink2:#5B6670;--ink3:#8A939B;--acc:#1E66D0;--bad:#C0392B;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans)}
body{padding:20px;max-width:760px;margin:0 auto}
h1{font:600 14px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px}
h2{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:0}
button,a.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;padding:6px 12px;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--ink3)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.bad{color:var(--bad)} button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible,a.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.make{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.make input{flex:1 1 260px;min-width:0;font-family:var(--mono)}
#msg{min-height:18px;margin:6px 0 0;color:var(--bad)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 10px}
.card.new{border-color:var(--acc)}
.card img{display:block;max-width:100%;height:auto;margin:0 auto;image-rendering:pixelated}
.meta{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.meta .txt{font-family:var(--mono);overflow-wrap:anywhere}
.meta .when{color:var(--ink3);font-size:11.5px}
.meta .acts{display:flex;gap:6px}
.empty{color:var(--ink2);background:var(--panel);border-radius:6px;padding:18px;text-align:center}
footer{color:var(--ink3);font:11.5px/1.5 var(--mono);margin-top:18px}
</style></head><body>
<h1>Barcode maker</h1>
<div class="make">
  <input id="text" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="Text to encode, e.g. VRP100234" aria-label="Text to encode">
  <select id="sym" aria-label="Barcode type" hidden></select>
  <button id="go" class="pri">Create barcode</button>
</div>
<p id="msg" role="alert"></p>
<div class="bar"><h2 id="count">Barcodes</h2><button id="clear" class="bad" hidden>Delete all</button></div>
<div id="list"></div>
<footer id="foot"></footer>

<script>
/*<encoders>*/
/* Symbologies are declared here: one entry each, { label, encode(text) -> string of 1 (bar) and 0 (space) modules }.
   encode throws an Error with a readable message when the text can't be encoded. Adding a type is adding an entry;
   the page, the history and the renderer read this map and need no change. */
var C128 = ("212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 " +
  "123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 " +
  "232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 " +
  "313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 " +
  "111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 " +
  "111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 " +
  "114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112").split(" ");

function code128Values(text){
  var n = text.length, i, c;
  if (!n) throw new Error("Type some text first.");
  for (i = 0; i < n; i++){
    c = text.charCodeAt(i);
    if (c < 32 || c > 126)
      throw new Error("Code 128 here takes standard keyboard characters only; “" + text.charAt(i) + "” at position " + (i + 1) + " can't be encoded.");
  }
  function digits(from){ var k = from; while (k < n && text.charCodeAt(k) >= 48 && text.charCodeAt(k) <= 57) k++; return k - from; }
  var d = digits(0);
  var set = ((d === n && n % 2 === 0) || d >= 4) ? "C" : "B";   // digit pairs (set C) halve the width
  var out = [set === "C" ? 105 : 104];
  i = 0;
  while (i < n){
    if (set === "C"){
      if (digits(i) >= 2){ out.push(parseInt(text.substr(i, 2), 10)); i += 2; }
      else { out.push(100); set = "B"; }
    } else {
      d = digits(i);
      if (d >= 4 && (i + d === n || d >= 6)){
        if (d % 2){ out.push(text.charCodeAt(i) - 32); i++; }
        out.push(99); set = "C";
      } else { out.push(text.charCodeAt(i) - 32); i++; }
    }
  }
  var sum = out[0];
  for (i = 1; i < out.length; i++) sum += out[i] * i;
  out.push(sum % 103, 106);
  return out;
}
function widthsToModules(patterns){
  var s = "", p, j;
  for (p = 0; p < patterns.length; p++)
    for (j = 0; j < patterns[p].length; j++) s += (j % 2 ? "0" : "1").repeat(+patterns[p][j]);
  return s;
}
var SYMBOLOGIES = {
  code128: { label: "Code 128", encode: function(text){ return widthsToModules(code128Values(text).map(function(v){ return C128[v]; })); } }
};
/*</encoders>*/

/* Rendering: modules -> canvas -> PNG data URL. Fixed pixel sizes so a saved file prints the same everywhere. */
var RENDER = { module: 3, quiet: 10, height: 120, pad: 12, font: 16 };
function renderPng(sym, text){
  var modules = SYMBOLOGIES[sym].encode(text), r = RENDER;
  var c = document.createElement("canvas");
  c.width = (modules.length + r.quiet * 2) * r.module;
  c.height = r.pad + r.height + 8 + r.font + r.pad;
  var g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#000";
  for (var i = 0; i < modules.length; i++)
    if (modules[i] === "1") g.fillRect((r.quiet + i) * r.module, r.pad, r.module, r.height);
  g.font = r.font + "px ui-monospace,Menlo,Consolas,monospace"; g.textAlign = "center"; g.textBaseline = "top";
  g.fillText(text, c.width / 2, r.pad + r.height + 8, c.width - r.module * 4);
  return { url: c.toDataURL("image/png"), width: c.width, height: c.height };
}

/* History: only the text and type are kept; images are redrawn from them. Browser storage when the page is
   allowed it (opened on its own, or run with Full access in the bench); otherwise this run's memory. */
var STORE_KEY = "barcode-maker:v1";
var Store = (function(){
  var mem = [];
  try {
    localStorage.setItem(STORE_KEY + ":probe", "1"); localStorage.removeItem(STORE_KEY + ":probe");
    return {
      kind: "browser",
      load: function(){ try { var v = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); return Array.isArray(v.items) ? v.items : []; } catch(e){ return []; } },
      save: function(items){ try { localStorage.setItem(STORE_KEY, JSON.stringify({ schema: 1, items: items })); } catch(e){ this.kind = "memory"; } }
    };
  } catch(e){
    return { kind: "memory", load: function(){ return mem; }, save: function(items){ mem = items; } };
  }
})();

var items = Store.load().filter(function(it){ return it && typeof it.text === "string" && SYMBOLOGIES[it.sym]; });
var seq = 0, newest = "", armTimer = 0;
var $ = function(id){ return document.getElementById(id); };
function el(tag, props, kids){
  var e = document.createElement(tag), k;
  for (k in (props || {})) e[k] = props[k];
  (kids || []).forEach(function(x){ e.appendChild(x); });
  return e;
}
function fileName(it){ return "barcode-" + (it.text.replace(/[^A-Za-z0-9._-]+/g, "_").slice(0, 40) || "image") + ".png"; }

function draw(){
  var list = $("list"); list.textContent = "";
  $("count").textContent = items.length ? "Barcodes (" + items.length + ")" : "Barcodes";
  $("clear").hidden = items.length < 2;
  if (!items.length){ list.appendChild(el("div", { className: "empty", textContent: "No barcodes yet. Type text above and press Create barcode." })); return; }
  items.forEach(function(it){
    var png = renderPng(it.sym, it.text);
    var save = el("a", { className: "btn", href: png.url, download: fileName(it), textContent: "Download PNG" });
    var del = el("button", { className: "bad", textContent: "Delete" });
    del.onclick = function(){ items = items.filter(function(x){ return x.id !== it.id; }); Store.save(items); draw(); };
    list.appendChild(el("div", { className: "card" + (it.id === newest ? " new" : "") }, [
      el("img", { src: png.url, width: png.width, height: png.height, alt: SYMBOLOGIES[it.sym].label + " barcode for " + it.text }),
      el("div", { className: "meta" }, [
        el("div", {}, [
          el("div", { className: "txt", textContent: it.text }),
          el("div", { className: "when", textContent: SYMBOLOGIES[it.sym].label + " · " + new Date(it.at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) })
        ]),
        el("div", { className: "acts" }, [save, del])
      ])
    ]));
  });
}

function create(){
  var text = $("text").value, sym = $("sym").value;
  $("msg").textContent = "";
  try { SYMBOLOGIES[sym].encode(text); }
  catch(e){ $("msg").textContent = e.message; $("text").focus(); return; }
  var same = items.filter(function(x){ return x.text === text && x.sym === sym; })[0];
  var it = same || { id: Date.now().toString(36) + "-" + (seq++), text: text, sym: sym, at: Date.now() };
  items = [it].concat(items.filter(function(x){ return x !== it; }));   // newest first; a repeat moves up instead of duplicating
  newest = it.id;
  Store.save(items); draw();
  $("text").value = ""; $("text").focus();
}

/* Delete all is two taps: the first arms the button for three seconds. */
$("clear").onclick = function(){
  var b = $("clear");
  if (b.classList.contains("armed")){ clearTimeout(armTimer); b.classList.remove("armed"); b.textContent = "Delete all"; items = []; Store.save(items); draw(); return; }
  b.classList.add("armed"); b.textContent = "Tap again to delete " + items.length;
  armTimer = setTimeout(function(){ b.classList.remove("armed"); b.textContent = "Delete all"; }, 3000);
};
$("go").onclick = create;
$("text").addEventListener("keydown", function(e){ if (e.key === "Enter") create(); });

(function init(){
  var keys = Object.keys(SYMBOLOGIES), block = {};
  keys.forEach(function(k){ $("sym").appendChild(el("option", { value: k, textContent: SYMBOLOGIES[k].label })); });
  $("sym").hidden = keys.length < 2;   // a choice of one is not shown
  try { block = JSON.parse($("toolbench-tool").textContent); } catch(e){}
  $("foot").textContent = (block.name || "Barcode maker") + " v" + (block.version || "?") + " · " +
    (Store.kind === "browser" ? "barcodes are kept in this browser until you delete them"
                              : "barcodes are kept until this tool is closed (sandboxed run: no browser storage)");
  draw(); $("text").focus();
})();
</script>
</body></html>
