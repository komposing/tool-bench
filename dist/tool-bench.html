<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Bench</title>
<style>
:root{
  --chassis:#171C22;
  --chassis-2:#222B34;
  --chassis-3:#2E3A45;
  --bench:#DEDBD2;
  --bench-2:#D2CEC3;
  --card:#FBFAF7;
  --ink:#12161A;
  --ink-2:#414D57;
  --muted:#6E7A85;
  --line:#C3BFB3;
  --tape:#F0B429;
  --live:#2E7D6B;
  --alert:#B3402E;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--chassis);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chassis ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{
  display:flex;align-items:center;gap:14px;padding:0 14px;height:52px;
  background:var(--chassis);border-bottom:1px solid #000;
}
.brand{display:flex;align-items:baseline;gap:9px;color:#F4F2ED;flex:none}
.brand b{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.brand button{font-family:var(--mono);font-size:10px;color:#6C7B88;letter-spacing:.1em;padding:0}
.brand button:hover{color:#E7EBEE}
.brand button.unbuilt{color:var(--tape)}
.search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--chassis-2);border:1px solid #0C1014;border-radius:var(--r);padding:0 10px;height:32px;
}
.search input{flex:1;background:none;border:none;color:#E9E7E1;font-family:var(--mono);font-size:12.5px}
.search input::placeholder{color:#67757F}
.search input:focus{outline:none}
.search kbd{
  font-family:var(--mono);font-size:10px;color:#7C8B96;border:1px solid #3A4650;
  border-radius:2px;padding:1px 5px;
}
.top .spacer{flex:1}
.btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--chassis-3);color:#CBD3DA;background:var(--chassis-2);
  padding:7px 12px;border-radius:var(--r);white-space:nowrap;
}
.btn:hover{background:var(--chassis-3);color:#fff}
.btn.primary{background:var(--tape);border-color:#C8901A;color:#1A1305;font-weight:600}
.btn.primary:hover{background:#FFC544}
.btn.danger{color:#E9A093;border-color:#5A3128}
.btn.danger:hover{background:var(--alert);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- body ---------- */
.main{display:grid;grid-template-columns:198px 1fr;min-height:0}
.rail{
  background:var(--chassis);border-right:1px solid #000;padding:14px 0;
  overflow-y:auto;display:flex;flex-direction:column;gap:2px;
}
.rail h4{
  margin:0 0 6px;padding:0 16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#5D6B76;font-weight:500;
}
.chan{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 16px;text-align:left;
  color:#9BA8B2;font-family:var(--mono);font-size:12px;border-left:2px solid transparent;
}
.chan:hover{color:#E7EBEE;background:#1D242B}
.chan.on{color:#fff;background:#1D242B;border-left-color:var(--tape)}
.chan .led{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor;opacity:.75}
.chan .n{margin-left:auto;font-size:10.5px;color:#5D6B76}
.rail hr{border:none;border-top:1px solid #262F37;margin:12px 16px}
.rail .foot{margin-top:auto;padding:12px 16px 0}
.meter{height:3px;background:#262F37;border-radius:2px;overflow:hidden;margin:8px 0 5px}
.meter i{display:block;height:100%;background:var(--live)}
.meter i.warn{background:var(--tape)}
.meter i.full{background:var(--alert)}
.foot small{font-family:var(--mono);font-size:9.5px;color:#5D6B76;letter-spacing:.06em;display:block}

.bench{background:var(--bench);overflow-y:auto;padding:20px 22px 60px;position:relative}
.bench.drop::after{
  content:"Drop .html files to add them";position:absolute;inset:8px;z-index:5;
  border:2px dashed var(--ink-2);border-radius:6px;background:rgba(222,219,210,.94);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
}
.benchhead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.benchhead h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.benchhead p{margin:0;color:var(--muted);font-size:12.5px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}

/* ---------- tool card: a printed label ---------- */
.tool{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.06);transition:transform .12s ease,box-shadow .12s ease;
}
.tool:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(23,28,34,.14)}
.tape{
  position:relative;padding:6px 14px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:#1A1305;font-weight:600;
  background:
    radial-gradient(circle at 5px 50%, var(--card) 2.5px, transparent 2.6px),
    radial-gradient(circle at calc(100% - 5px) 50%, var(--card) 2.5px, transparent 2.6px),
    var(--tape);
  border-bottom:1px solid rgba(0,0,0,.14);
}
.tape .cat{margin-left:auto;font-weight:500;letter-spacing:.1em;opacity:.72;text-transform:none}
.tool .body{padding:12px 14px 0;flex:1}
.tool h3{margin:0 0 4px;font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.tool p{margin:0;color:var(--muted);font-size:12.5px;min-height:34px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line);border-radius:2px;padding:2px 5px;background:#F1EFE9;
}
.tag.dep{text-transform:none;letter-spacing:.02em;background:#E9EEF1;border-color:#C5D0D7}
.tag.bad{color:var(--alert);border-color:#E2B3A8;background:#F6E9E5}
.tool .acts{display:flex;align-items:center;gap:6px;padding:11px 14px;border-top:1px dotted var(--line);margin-top:12px}
.run{
  flex:1;background:var(--chassis);color:#F2F0EB;border-radius:var(--r);padding:7px 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
}
.run:hover{background:var(--chassis-3)}
.run.blocked{background:#5B3A33}
.icobtn{
  width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:14px;background:#F5F3EE;
}
.icobtn:hover{background:#E8E5DD;color:var(--ink)}
.icobtn.on{background:var(--tape);border-color:#C8901A;color:#1A1305}
.meta{font-family:var(--mono);font-size:9.5px;color:#98A0A8;letter-spacing:.05em}

.empty{
  border:1px dashed var(--line);border-radius:6px;padding:44px 24px;text-align:center;background:rgba(251,250,247,.5);
}
.empty h2{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--muted);font-size:13px}

/* ---------- run view ---------- */
.runner{position:fixed;inset:0;z-index:40;background:var(--chassis);display:none;grid-template-rows:44px 1fr}
.runner.open{display:grid}
.runbar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #000}
.runbar .id{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;background:var(--tape);color:#1A1305;
  padding:3px 8px;border-radius:2px;font-weight:600;
}
.runbar .nm{color:#EDEBE6;font-size:13.5px;font-weight:500}
.runbar .sb{font-family:var(--mono);font-size:10px;color:#6C7B88;letter-spacing:.08em}
.runner iframe{width:100%;height:100%;border:none;background:#fff}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,16,20,.62);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.scrim.open{display:flex}
.sheet{
  width:100%;max-width:620px;background:var(--bench);border-radius:5px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.sheet.wide{max-width:800px}
.sheethead{
  display:flex;align-items:center;gap:10px;background:var(--chassis);padding:12px 16px;color:#EDEBE6;
}
.sheethead h2{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.sheethead .sub{font-family:var(--mono);font-size:10px;color:#6C7B88}
.sheethead .x{margin-left:auto;color:#8B98A2;font-size:18px;line-height:1;padding:2px 6px}
.sheethead .x:hover{color:#fff}
.sheetbody{padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 190px);overflow-y:auto}
.sheetfoot{display:flex;gap:8px;padding:12px 16px;background:var(--bench-2);border-top:1px solid var(--line)}
.sheetfoot .spacer{flex:1}

label.f{display:flex;flex-direction:column;gap:5px}
label.f > span,.lbl{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
}
.in,textarea.in,select.in{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;
  font-size:13px;width:100%;
}
textarea.in{font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical;min-height:120px}
.in:focus,textarea.in:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 2px rgba(65,77,87,.14)}
.in[readonly]{background:#EFEDE7;color:var(--ink-2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content}
.tabs button{
  padding:6px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);background:var(--bench-2);border-right:1px solid var(--line);
}
.tabs button:last-child{border-right:none}
.tabs button.on{background:var(--chassis);color:#F2F0EB}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--chassis);width:15px;height:15px}
.warn{
  border-left:3px solid var(--alert);background:#F6E9E5;padding:9px 11px;border-radius:2px;
  font-size:12px;color:#6A2F22;
}
.note{
  border-left:3px solid var(--ink-2);background:#ECEAE3;padding:9px 11px;border-radius:2px;
  font-size:12px;color:var(--ink-2);
}
.err{color:var(--alert);font-size:12px;font-family:var(--mono);min-height:16px}
.cfgsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 4px;display:flex;flex-direction:column;gap:12px}
.cfghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cfghead h3{margin:0;font-size:14px;font-weight:600}
.cfgfoot{display:flex;align-items:center;gap:10px;border-top:1px dotted var(--line);padding-top:10px}

/* ---------- tables in sheets ---------- */
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;word-break:break-word}
table.t{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line)}
table.t th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);background:var(--bench-2);padding:6px 8px;border-bottom:1px solid var(--line)
}
table.t td{padding:6px 8px;border-bottom:1px dotted var(--line);vertical-align:top}
table.t code,.kv code{font-family:var(--mono);font-size:11px}
.ok{color:var(--live)} .no{color:var(--alert)}

/* ---------- menu ---------- */
.menu{
  position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 26px rgba(23,28,34,.22);padding:4px;min-width:190px;display:none;
}
.menu.open{display:block}
.menu button{
  display:block;width:100%;text-align:left;padding:7px 10px;font-size:12.5px;border-radius:2px;color:var(--ink-2);
}
.menu button:hover{background:var(--bench-2);color:var(--ink)}
.menu button.rm{color:var(--alert)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:70;
  background:var(--chassis);color:#F2F0EB;padding:9px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;border-right:none;border-bottom:1px solid #000;align-items:center}
  .rail h4,.rail hr,.rail .foot{display:none}
  .chan{width:auto;border-left:none;border-radius:var(--r);padding:6px 11px;white-space:nowrap}
  .chan.on{box-shadow:inset 0 -2px 0 var(--tape)}
  .row{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .search{max-width:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Tool Bench</b><button id="verLabel" title="Dependencies and build">v?</button></div>
    <div class="search">
      <span style="color:#67757F;font-family:var(--mono);font-size:12px">/</span>
      <input id="q" type="search" placeholder="Search tools, tags, IDs, deps" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnSettings">Settings</button>
    <button class="btn primary" id="btnAdd">Add tool</button>
  </header>

  <div class="main">
    <nav class="rail" id="rail"></nav>
    <section class="bench" id="bench">
      <div class="benchhead">
        <h1 id="benchTitle">All tools</h1>
        <p id="benchSub"></p>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<div class="runner" id="runner">
  <div class="runbar">
    <span class="id" id="runId"></span>
    <span class="nm" id="runName"></span>
    <span class="sb" id="runSandbox"></span>
    <div class="spacer" style="flex:1"></div>
    <button class="btn" id="runReload">Reload</button>
    <button class="btn" id="runPop">Open standalone</button>
    <button class="btn" id="runClose">Close</button>
  </div>
  <iframe id="runFrame" title="Tool"></iframe>
</div>

<div class="scrim" id="scrim"><div id="sheetSlot"></div></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

c/body>\u003c/html>\n"},{"id":"TB:drafting-table","name":"Drafting Table","description":"Paired concept-modelling board (ca.draft/1): palette, board, inspector, analysis and finder over the CA_V3 Drafting Engine; the op log is the draft, replayed live on the std poll budget. Layers: global, data model, process flow. Approvals (CA_V4): exchanges lane (open decisions on hub threads, decided through the Hub page entry, ca.payload/1) and a proposals stub.","category":"CA_V3","tags":["drafting","design","paired","ca.draft/1","ca.payload/1","ca_v4"],"file":"tools/drafting-table.html","version":"1.3.0","sandbox":{"scripts":true,"forms":false,"modals":false,"popups":false,"downloads":false,"sameOrigin":false},"config":{},"contract":{"config_keys":["drafting"],"requires":["wf:VkS7B5UucVMrNwWm","std:drafting"]},"config_schema":{"namespace":"drafting","fields":[{"path":"url","label":"Drafting endpoint","type":"url","required":true,"default":"https://komposing.app.n8n.cloud/webhook/ca-v3-drafting"},{"path":"headers.X-Api-Key","label":"Viewer key (X-Api-Key)","type":"secret","required":false,"secret":true,"help":"CA_V3 viewer key. Leave empty to use the key saved for the CA_V3 Viewer (cav3)."},{"path":"poll_ms","label":"Active poll override (ms)","type":"number","help":"Blank: the active interval from std drafting reach.page.poll (2 s). Set it to replace only the active interval; idle backoff and the hidden pause still follow the standard"},{"path":"debounce_ms","label":"Apply debounce (ms)","type":"number","default":300},{"path":"draft_id","label":"Open draft","type":"string","help":"Draft opened on start; blank shows the draft list"},{"path":"hub_page_url","label":"CA_V4 Hub page entry","type":"url","required":false,"default":"https://komposing.app.n8n.cloud/webhook/ca-v4-hub-page","help":"Page-reachable V4 entry (ca.payload/1) serving v4.hub.pending and the decision post for the exchanges lane; n8n user sign-in on the same origin, no key"},{"path":"doc_page_url","label":"CA_V 03cbutton class=\"link\" id=\"flRefresh\" title=\"Reload the workflow list (op flows)\">refresh\u003c/button>\u003c/div>\n      \u003cinput id=\"flFilter\" placeholder=\"filter workflows\">\n      \u003cdiv id=\"flowList\">\u003cspan class=\"small muted\">loading…\u003c/span>\u003c/div>\n      \u003cdiv class=\"small muted\">Tick a workflow to draw its steps. Nothing here writes to the draft.\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"appr\">\n      \u003cdiv class=\"row\" style=\"margin:0\">\u003ch3>Approvals\u003c/h3>\u003cspan class=\"sep\">\u003c/span>\u003cspan class=\"small muted\" id=\"apRead\">\u003c/span>\u003cbutton class=\"link\" id=\"apRefresh\" title=\"Re-read both lanes\">refresh\u003c/button>\u003cbutton class=\"link\" id=\"apClose\">close\u003c/button>\u003c/div>\n      \u003cdiv class=\"row\" style=\"margin:0\">\u003cselect id=\"apThread\" title=\"Filter by thread\">\u003coption value=\"\">all threads\u003c/option>\u003c/select>\u003cselect id=\"apFrom\" title=\"Filter by asking session\">\u003coption value=\"\">all sessions\u003c/option>\u003c/select>\u003c/div>\n      \u003cdiv id=\"apBody\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"sr\" class=\"split\">\u003c/div>\n\n  \u003cdiv id=\"right\">\n    \u003cdiv id=\"insp\">\u003c/div>\n    \u003cdiv id=\"ha\">\u003c/div>\n    \u003cdiv id=\"anal\" data-drop=\"analysis\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"hb\">\u003c/div>\n  \u003cdiv id=\"find\" class=\"pane\">\n    \u003cdiv class=\"row\" style=\"margin:0\">\n      \u003ch3 style=\"margin-right:6px\">Finder\u003c/h3>\n      \u003cinput id=\"fq\" placeholder=\"search docs and drafts\" style=\"max-width:340px\">\n      \u003clabel class=\"small\">\u003cinput type=\"checkbox\" id=\"fDocs\" checked> docs\u003c/label>\n      \u003clabel class=\"small\">\u003cinput type=\"checkbox\" id=\"fDrafts\" checked> drafts\u003c/label>\n      \u003cbutton id=\"fGo\">Find\u003c/button>\n      \u003cspan class=\"small muted\" id=\"fCount\">\u003c/span>\n    \u003c/div>\n    \u003cdiv id=\"cards\">\u003cspan class=\"small muted\">Cards appear here. Drag one onto the board to make a node, or into the analysis to add it.\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"dragghost\">\u003c/div>\n\u003cdiv id=\"toast\">\u003c/div>\n\u003cdiv class=\"sheet\" id=\"shDrafts\">\u003cdiv class=\"box\">\n  \u003ch3>Drafts\u003c/h3>\n  \u003ctable class=\"dl\" id=\"dlist\">\u003ctr>\u003ctd class=\"muted\">loading…\u003c/td>\u003c/tr>\u003c/table>\n  \u003cdiv class=\"row\">\u003cinput id=\"ndTitle\" placeholder=\"new draft title\">\u003cbutton class=\"pri\" id=\"ndGo\">Create\u003c/button>\u003c/div>\n  \u003clabel class=\"small row\">\u003cinput type=\"checkbox\" id=\"ndRemember\"> open the chosen draft next time (saved in Tool Bench settings)\u003c/label>\n  \u003cdiv class=\"row\" style=\"justify-content:flex-end\">\u003cbutton id=\"dlClose\">Close\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"sheet\" id=\"shSet\">\u003cdiv class=\"box\">\n  \u003ch3>Settings\u003c/h3>\n  \u003cdiv class=\"row\">\u003cspan class=\"lbl\">active ms\u003c/span>\u003cinput id=\"cPoll\" type=\"number\" min=\"500\" step=\"100\" placeholder=\"std (2000)\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cspan class=\"lbl\">debounce\u003c/span>\u003cinput id=\"cDeb\" type=\"number\" min=\"0\" step=\"50\">\u003c/div>\n  \u003cdiv id=\"cConn\">\n    \u003cdiv class=\"row\">\u003cspan class=\"lbl\">endpoint\u003c/span>\u003cinput id=\"cUrl\">\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"lbl\">key\u003c/span>\u003cinput id=\"cKey\" type=\"password\" placeholder=\"X-Api-Key (kept in memory only)\">\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"lbl\">hub entry\u003c/span>\u003cinput id=\"cHub\" placeholder=\"CA_V4 Hub page entry (ca-v4-hub-page)\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"small muted\" id=\"cNote\">\u003c/p>\n  \u003cdiv class=\"row\" style=\"justify-content:flex-end\">\u003cbutton id=\"cClose\">Cancel\u003c/button>\u003cbutton class=\"pri\" id=\"cSave\">Save\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cscript>\n\"use strict\";\n/* ===================================================================\n   Drafting Table (ca.draft/1) — Tool Bench page for C812-s2.\n   The op log is the draft: the page reads the whole log once (replay since 0),\n   reduces it itself, then polls replay every poll_ms and flushes its own ops\n   through apply on a debounce. The engine snapshot is a cache and is not used\n   for rendering (palette only).\n   =================================================================== */\nconst TC = window.TOOL_CONFIG || {}, TM = window.TOOL_META || null;\nconst getPath = (o, p) => p.split(\".\").reduce((a, k) => (a && typeof a === \"object\") ? a[k] : undefined, o);\nconst DC = TC.drafting || {};\nconst CONF = {\n  url: DC.url || \"https://komposing.app.n8n.cloud/webhook/ca-v3-drafting\",\n  key: getPath(DC, \"headers.X-Api-Key\") || getPath(TC, \"cav3.dashboard.headers.X-Api-Key\") || \"\",\n  keyFrom: getPath(DC, \"headers.X-Api-Key\") ? \"drafting\" : (getPath(TC, \"cav3.dashboard.headers.X-Api-Key\") ? \"cav3\" : \"\"),\n  pollOverride: DC.poll_ms == null || DC.poll_ms === \"\" ? null : Math.max(500, +DC.poll_ms || 2000),\n  debounce: Math.max(0, DC.debounce_ms == null ? 300 : +DC.debounce_ms),\n  draft: DC.draft_id || \"\",\n  hubPageUrl: DC.hub_page_url || \"https://komposing.app.n8n.cloud/webhook/ca-v4-hub-page\",   // CA_V4 Hub page entry (D20): v4.hub.pending + the decision post\n  docPageUrl: DC.doc_page_url || \"\"                                                          // CA_V4 Doc Store page entry: none yet, the proposals lane is a stub\n};\n/* Poll budget: std drafting reach.page.poll (C944, T536). Built-in defaults equal std drafting v2; the engine's open\n   reply relays the live row as reach_page_poll once C903-s3 lands, and that wins. poll_ms overrides active_ms only. */\nconst POLL_DEFAULT = { active_ms: 2000, active_window_ms: 30000, idle_ms: [10000, 30000, 60000], hidden: \"pause\", in_flight: 1, request_timeout_ms: 40000 };\nlet POLL = clone0(POLL_DEFAULT), POLL_FROM = \"default\";\nfunction clone0(v){ return JSON.parse(JSON.stringify(v)); }\nfunction setPollBudget(src, from){\n  const p = clone0(POLL_DEFAULT);\n  if (src && typeof src === \"object\" && !Array.isArray(src)) {\n    for (const k of [\"active_ms\", \"active_window_ms\", \"request_timeout_ms\"]) if (+src[k] > 0) p[k] = +src[k];\n    if (Array.isArray(src.idle_ms) && src.idle_ms.length && src.idle_ms.every(x => +x > 0)) p.idle_ms = src.idle_ms.map(Number);\n    if (typeof src.hidden === \"string\") p.hidden = src.hidden;\n    for (const k of Object.keys(src)) if (!(k in p)) p[k] = src[k];   // unknown keys kept for later readers\n    POLL_FROM = from;\n  } else POLL_FROM = \"default\";\n  p.active_ms = Math.max(500, p.active_ms); p.idle_ms = p.idle_ms.map(x => Math.max(p.active_ms, x));\n  if (CONF.pollOverride != null) { p.active_ms = CONF.pollOverride; POLL_FROM += \"+override\"; }\n  POLL = p;\n}\nconst AUTHOR = \"user\";\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => Array.from(r.querySelectorAll(s));\nconst esc = s => String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\nconst clone = v => v == null ? v : JSON.parse(JSON.stringify(v));\nconst isObj = v => v && typeof v === \"object\" && !Array.isArray(v);\nlet uidN = 0;\nconst uid = p => p + Date.now().toString(36).slice(-5) + (uidN++).toString(36) + Math.random().toString(36).slice(2, 4);\nconst trunc = (s, n) => { s = String(s == null ? \"\" : s); return s.length > n ? s.slice(0, n - 1) + \"…\" : s; };\nconst rk = r => r ? r.type + \":\" + r.id + (r.key ? \"#\" + r.key : \"\") : \"\";\nconst sameObj = (a, b) => a && b && a.type === b.type && a.id === b.id;\nconst parseRk = s => { const m = /^([a-z_]+):(.+?)(?:#(.+))?$/.exec(s || \"\"); return m ? (m[3] ? { type: m[1], id: m[2], key: m[3] } : { type: m[1], id: m[2] }) : null; };\nfunction toast(msg, bad){ const t = $(\"#toast\"); t.textContent = msg; t.className = bad ? \"bad\" : \"\"; t.style.display = \"block\"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = \"none\", bad ? 6000 : 2600); }\n\n/* ============================== transport ============================== */\nasync function call(op, params, signal){\n  if (!CONF.key) throw new Error(\"No viewer key: set it in Tool Bench Settings (Drafting Table or CA_V3 Viewer) or in ⚙\");\n  let res;\n  try {\n    res = await fetch(CONF.url, { method: \"POST\", headers: { \"Content-Type\": \"application/json\", \"X-Api-Key\": CONF.key },\n      body: JSON.stringify(Object.assign({ op }, params || {})), cache: \"no-store\", signal: signal || undefined });\n  } catch (e) { if (e && e.name === \"AbortError\") throw e; throw new Error(\"Drafting endpoint unreachable (network or CORS): \" + (e.message || e)); }\n  const txt = await res.text();\n  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(`HTTP ${res.status}: ${trunc(txt, 140) || \"empty response\"}`); }\n  if (Array.isArray(j)) j = j[0] || {};\n  if (j && isObj(j.data) && j.data.protocol === \"ca.draft/1\") j = j.data;\n  if (!res.ok || j.status === \"error\" || (j.outcome && j.outcome !== \"ok\")) {\n    const why = (j.errors || []).map(e => `${e.param}: ${e.reason}`).join(\"; \") || j.message || j.text || `HTTP ${res.status}`;\n    const err = new Error(`${op} ${j.outcome || \"refused\"}: ${why}`); err.body = j; throw err;\n  }\n  return j;\n}\n/* V4 transport (CA_V4, D17.2/D20): the page is its own surface. One ca.payload/1 envelope per call, the page principal\n   {surface page, tool drafting-table, tool_session_id = this page session}, session_ref = that id; same-origin n8n\n   user sign-in rides on the cookie (credentials include), no viewer key. A refusal is returned, never thrown: the lane\n   renders it in place (s_dr_refused) and nothing is retried. */\nconst PAGE_SID = uid(\"page-\");\nasync function callV4(url, key, params){\n  const refused = (code, reason, extra) => Object.assign({ protocol: \"ca.payload/1\", outcome: \"refused\", key, result: {}, errors: [{ code, reason }], refusal: { code, reason } }, extra || {});\n  if (!url) return refused(\"no_entry\", \"no page entry configured for \" + key);\n  const envelope = { protocol: \"ca.payload/1\", key, session_ref: PAGE_SID, principal: { surface: \"page\", tool: \"drafting-table\", tool_session_id: PAGE_SID }, params: params || {} };\n  let res, txt;\n  try {\n    res = await fetch(url, { method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, credentials: \"include\", body: JSON.stringify(envelope), cache: \"no-store\" });\n    txt = await res.text();\n  } catch (e) { return refused(\"unreachable\", \"page entry unreachable (network, CORS or sign-in): \" + (e && e.message || e)); }\n  let j; try { j = JSON.parse(txt); } catch (e) { return refused(\"http_\" + res.status, res.status === 401 || res.status === 403 ? \"not signed in to n8n on this origin (HTTP \" + res.status + \")\" : `HTTP ${res.status}: ${trunc(txt, 140) || \"empty response\"}`); }\n  if (Array.isArray(j)) j = j[0] || {};\n  if (j && isObj(j.data) && j.data.protocol === \"ca.payload/1\") j = j.data;\n  if (!isObj(j)) return refused(\"http_\" + res.status, \"no reply object\");\n  if (!isObj(j.result)) j.result = {};\n  if (j.outcome !== \"ok\") {\n    const e = (Array.isArray(j.errors) && j.errors[0]) || {};\n    const reason = e.param ? `${e.param}: ${e.reason || \"\"}`.trim() : (e.reason || j.message || j.text || `HTTP ${res.status}`);\n    j.outcome = j.outcome || \"refused\"; j.refusal = { code: e.code || j.outcome, reason };\n  }\n  return j;\n}\n\n/* ============================== state ============================== */\nlet DRAFT = \"\";            // current draft id\nlet PALETTE = { classes: {}, edge_classes: {} };\nlet LOG = [];              // committed ops [{seq, author, ts, op, payload, origin_request}] sorted by seq\nlet SEEN = new Set();      // committed seqs\nlet OUTBOX = [];           // local ops not yet sent [{op, payload, origin_request?, _local}]\nlet INFLIGHT = [];         // ops sent, awaiting apply\nlet SEQ = 0;               // seq_head\nlet S = blankState();      // committed + local state\nlet R = S;                 // render state: S plus ghosted proposals\nlet SEL = [];              // selected refs\nlet ACTIVE_AN = \"\";        // analysis shown in the analysis pane\nlet INSP = null;           // ref shown in the inspector (null = draft)\nlet CAM = { x: 80, y: 60, k: 1 };\nlet FLAGS = { reasoning: false, follow: false };\nlet RECENT = new Map();    // rk -> {author, at}\nlet lastPoll = 0, lastOk = 0, syncErr = \"\", busy = false, lastEdit = 0;\nlet lastChange = 0, idleStep = 0, replayBusy = false, HELD = [];   // poll budget state (C944)\nlet LAYER = \"global\";      // board layer (C980): global | data | process\nconst DM = { expanded: new Set(), schema: new Map(), pending: new Set(), colSel: \"\" };   // data model layer: view-only state, schema cache per key for the page session\nconst PF = { flows: [], loaded: false, loading: false, ticked: [], flow: new Map(), pending: new Set(), boxes: [], filter: \"\" };   // process flow layer\n\nfunction blankState(){\n  return { draft: { id: DRAFT, title: \"\", attributes: { agent_ops: \"ghost\" } }, classes: {}, edge_classes: {}, nodes: {}, edges: {},\n    groups: {}, notes: {}, analyses: {}, threads: {}, proposals: {}, requests: {}, published: {}, lineage: [], last: null };\n}\nconst COLL = { class: \"classes\", edge_class: \"edge_classes\", node: \"nodes\", edge: \"edges\", group: \"groups\", note: \"notes\", analysis: \"analyses\" };\nconst SETS = { \"class.define\": \"class\", \"edge_class.define\": \"edge_class\", \"node.add\": \"node\", \"edge.add\": \"edge\", \"group.set\": \"group\",\n  \"note.set\": \"note\", \"analysis.set\": \"analysis\", \"card.drop\": \"node\" };\nconst MERGES = { \"class.amend\": \"class\", \"edge_class.amend\": \"edge_class\", \"node.amend\": \"node\", \"node.move\": \"node\", \"edge.amend\": \"edge\" };\nconst REMOVES = { \"node.remove\": \"node\", \"edge.remove\": \"edge\" };\nconst NOGHOST = new Set([\"reason.request\", \"reason.respond\", \"thread.add\", \"thread.amend\", \"thread.resolve\", \"ops.accept\", \"ops.reject\", \"view.set\", \"draft.create\", \"draft.amend\"]);\n\nfunction ghostMode(st, origin){\n  const req = st.requests[origin];\n  const an = req && st.analyses[req.analysis_id];\n  return (an && an.agent_ops_override) || (st.draft.attributes || {}).agent_ops || \"ghost\";\n}\n// One op into a state. ctx: {force (apply even when it would be a proposal), ghost (mark touched objects)}\nfunction step(st, e, ctx){\n  ctx = ctx || {};\n  const p = isObj(e.payload) ? e.payload : {};\n  const opId = st.draft.id + \":\" + e.seq;\n  if (!ctx.force && e.origin_request && /^agent:/.test(e.author || \"\") && !NOGHOST.has(e.op) && ghostMode(st, e.origin_request) === \"ghost\") {\n    st.proposals[opId] = { op_id: opId, seq: e.seq, entry: e, origin_request: e.origin_request, status: \"proposed\" };\n    return;\n  }\n  const mark = (type, id) => { st.last = { ref: { type, id }, author: e.author, seq: e.seq }; if (ctx.ghost && st[COLL[type]] && st[COLL[type]][id]) st[COLL[type]][id]._ghost = true; };\n  if (SETS[e.op]) {\n    const t = SETS[e.op]; if (!p.id) return;\n    st[COLL[t]][p.id] = Object.assign(clone(p), { _by: e.author, _seq: e.seq });\n    mark(t, p.id); return;\n  }\n  if (MERGES[e.op]) {\n    const t = MERGES[e.op], o = st[COLL[t]][p.id]; if (!o) return;   // unknown-id amends are ignored\n    Object.assign(o, clone(p), { _by: e.author, _seq: e.seq }); mark(t, p.id); return;\n  }\n  if (REMOVES[e.op]) {\n    const t = REMOVES[e.op];\n    if (ctx.ghost) { const o = st[COLL[t]][p.id]; if (o) o._gremove = true; return; }\n    delete st[COLL[t]][p.id]; return;\n  }\n  switch (e.op) {\n    case \"draft.create\": st.draft.title = p.title || st.draft.title; st.draft.attributes = Object.assign({ agent_ops: \"ghost\" }, p.attributes || {}); break;\n    case \"draft.amend\": if (p.title != null) st.draft.title = p.title; if (isObj(p.attributes)) Object.assign(st.draft.attributes, clone(p.attributes)); break;\n    case \"class.publish\": case \"edge_class.publish\": st.published[(e.op[0] === \"e\" ? \"edge_class:\" : \"class:\") + p.id] = { seq: e.seq, by: e.author }; break;\n    case \"class.fork\": case \"edge_class.fork\": {\n      const t = e.op[0] === \"e\" ? \"edge_class\" : \"class\", src = PALETTE[COLL[t]][p.from || p.id];\n      if (src && !st[COLL[t]][p.id]) st[COLL[t]][p.id] = Object.assign(clone(src), { id: p.id, origin: \"fork\", published_from: p.from || p.id, _by: e.author, _seq: e.seq });\n      break;\n    }\n    case \"attr.promote\": case \"node.promote\": st.lineage.push({ op: e.op, payload: clone(p), seq: e.seq }); break;\n    case \"thread.add\": {\n      if (!isObj(p.owner)) break;\n      const k = p.owner.type + \":\" + p.owner.id;\n      (st.threads[k] = st.threads[k] || []).push(Object.assign({ status: \"open\" }, clone(p), { author: p.author || e.author, ts: e.ts, _seq: e.seq }));\n      break;\n    }\n    case \"thread.amend\": case \"thread.resolve\":\n      for (const list of Object.values(st.threads)) for (const t of list) if (t.id === p.id) Object.assign(t, e.op === \"thread.resolve\" ? { status: p.status || \"resolved\" } : clone(p));\n      break;\n    case \"reason.request\":\n      st.requests[opId] = { id: opId, seq: e.seq, analysis_id: p.analysis_id, mode: p.mode, prompt: p.prompt || \"\", author: e.author, ts: e.ts, status: \"open\", proposal_ids: [] };\n      break;\n    case \"reason.respond\": {\n      const req = st.requests[p.request_id];\n      if (req) { req.status = \"answ ========================= approvals (CA_V4) ============================== */\n/* Design: draft dmw1122kroij7 (r_approvals amended seq 107-108; exchanges lane seq 64-106). One panel over the board,\n   two lanes. Exchanges (D19.4): open decision_requests across open hub threads, read with v4.hub.pending through the\n   Hub page entry (dc_hub_pending) and settled with v4.hub.post kind decision (dc_hub_decide) - options are the body\n   lines \"(n) ...\" as buttons (recommended first, I12), \"other\" is a typed steer; one click arms, a second within 5 s\n   posts (the viewer has no dialogs). Proposals: v4.draft.pending has no page entry yet (CONF.docPageUrl empty), so\n   the lane is a stub and its count is not read. The badge sums both lanes; refreshes on open, after every settle and\n   on the shared button. States: s_dr_pending | posting | decided | refused | stale (thread closed) | empty. */\nconst ARM_MS = 5000;\nconst AP = { open: false, loading: false, threads: [], count: null, readAt: 0, refusal: null, truncated: false, decided: [], rows: new Map(),\n  filterThread: \"\", filterFrom: \"\", collapsed: new Set(), prop: { count: null, readAt: 0, refusal: null } };\nconst rowKey = (t, seq) => t + \"|\" + seq;\nfunction rowState(k){ if (!AP.rows.has(k)) AP.rows.set(k, { state: \"pending\", armed: \"\", armedAt: 0, other: \"\", refusal: null, decisionSeq: null }); return AP.rows.get(k); }\nfunction parseOptions(body){\n  const opts = [], rest = [];\n  for (const line of String(body == null ? \"\" : body).split(/\\r?\\n/)) { const m = /^\\s*\\((\\d+)\\)\\s*(.*\\S)\\s*$/.exec(line); if (m) opts.push({ n: m[1], text: m[2] }); else rest.push(line); }\n  return { opts, text: rest.join(\"\\n\").trim() };\n}\nfunction parseRefs(refs){\n  if (Array.isArray(refs)) return refs.map(String);\n  const s = String(refs == null ? \"\" : refs).trim(); if (!s) return [];\n  try { const j = JSON.parse(s); if (Array.isArray(j)) return j.map(x => typeof x === \"string\" ? x : JSON.strin e:nowrap} .ab button:disabled{pointer-events:none}\n.ab:focus-visible,.ab:focus-within{box-shadow:0 0 0 2px var(--acc)}\n.ab[data-tip]:focus::after,.ab[data-tip]:focus-within::after{content:attr(data-tip);position:absolute;right:0;top:calc(100% + 4px);z-index:3;background:var(--ink);color:#fff;font-size:11px;line-height:1.3;padding:5px 7px;border-radius:4px;width:max-content;max-width:240px;white-space:normal;pointer-events:none}\n.inp,.links{flex-basis:100%} .inp{display:flex;gap:4px} .inp input{flex:1;min-width:0;padding:2px 5px;font-size:12px}\ntr.hasctx td{border-bottom:0;padding-bottom:2px} tr.cx td{padding:0 8px 6px} tr.cx.sel td{background:#EEF4FD}\n.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:11.5px;color:var(--ink2);position:sticky;left:8px;max-width:calc(100vw - 48px)}\n.ctx .u{font-weight:600;color:var(--ink)} .ctx .pc{font-family:var(--mono);font-size:11px;color:var(--ink)} .ctx .sp{color:var(--ink3)}\n.chip{display:inline-block;padding:0 5px;border-radius:3px;font:600 10px/16px var(--mono);border:1px solid var(--line);background:#fff;color:var(--ink2)}\n.chip.c-NI,.chip.c-JE,.chip.c-GG{background:#FFF4E0;border-color:var(--warn);color:#8A5200}\n.chip.c-international{background:#EEF4FD;border-color:var(--acc);color:var(--acc)} .chip.c-q{background:#FDECEA;border-color:var(--bad);color:var(--bad)}\n#fbar{margin:0 0 8px;position:relative} .qrow{display:flex;gap:4px} #q{flex:1;min-width:0;font-family:var(--mono);font-size:12px;padding:4px 7px}\n#sugg{position:absolute;z-index:5;left:0;top:30px;margin:0;padding:3px 0;list-style:none;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-height:240px;overflow:auto;min-width:260px}\n#sugg li{padding:3px 10px;font:12px var(--mono);cursor:pointer;display:flex;justify-content:space-between;gap:12px} #sugg li.on,#sugg li:hover{background:#EEF4FD} #sugg li .h{color:var(--ink3);font-family:var(--sans)}\n#chips{display:flex;flex-wrap:wrap;gap:3px 10px;margin:6px 0 0} .dim{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px} .dim>b{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-right:2px}\n#chips button,#filters button{padding:1px 8px;font-size:11.5px;border-radius:12px} #chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)} #chips button.neg{background:#FDECEA;border-color:var(--bad);color:var(--bad);text-decoration:line-through}\n#chips .n{color:var(--ink3);margin-left:3px} #chips button.on .n{color:#cfd5da} #chips .dot{width:9px;height:9px;margin-right:4px;vertical-align:-1px}\n#bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 0;font-size:12px} #bulk select{font-size:12px} #bulk .res{flex-basis:100%;font:11.5px var(--mono);color:var(--ink2);max-height:120px;overflow:auto} #bulk .res .bad{color:var(--bad)} #bulk .res .ok{color:var(--ok)}\n#bulk button.arm{background:var(--warn);border-color:var(--warn);color:#fff}\n#filters{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 8px}\n#filters button{padding:1px 9px;font-size:11.5px;border-radius:12px} #filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}\n#filters .n{color:var(--ink3);margin-left:3px} #filters button.on .n{color:#cfd5da}\n.cnt{font:10px var(--mono);color:var(--ink3)}\n.small{font-size:11.5px;color:var(--ink2)}\n.links a{display:block;font:11px var(--mono);word-break:break-all;color:var(--acc)}\n#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 12px;border-radius:6px;display:none;max-width:80%;z-index:9}\n#toast.bad{background:var(--bad)}\n#cfg{display:none;position:absolute;top:44px;right:12px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;width:360px;max-width:calc(100% - 24px);box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:5}\n#cfg .row{display:flex;gap:6px;align-items:center;margin:4px 0} #cfg .lbl{width:70px;color:var(--ink2)} #cfg input{flex:1}\n@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr 40%;grid-template-areas:\"top\" \"list\" \"prev\"} #prev{border-left:0;border-top:1px solid var(--line)}}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv id=\"app\">\n\u003cdiv id=\"top\">\n  \u003cspan class=\"brand\">Pack &amp; Ship\u003c/span>\n  \u003clabel class=\"small\">days \u003cinput id=\"days\" type=\"number\" min=\"1\" max=\"60\" value=\"14\" style=\"width:52px\">\u003c/label>\n  \u003cbutton id=\"reload\" title=\"read the stages again (no sync)\">Reload\u003c/button>\n  \u003cbutton id=\"refresh\" class=\"pri\" title=\"run pack.refresh: orders, items, messages, health, then parcels\">Refresh\u003c/button>\n  \u003clabel class=\"small\">copies \u003cinput id=\"copies\" type=\"number\" min=\"1\" max=\"3\" value=\"1\" style=\"width:44px\">\u003c/label>\n  \u003cspan class=\"sep\">\u003c/span>\n  \u003cspan id=\"count\" class=\"small\">\u003c/span>\n  \u003cspan id=\"last\">\u003c/span>\n  \u003cspan id=\"sync\">\u003ci>\u003c/i>\u003cspan id=\"syncT\">idle\u003c/span>\u003c/span>\n  \u003cbutton id=\"gear\" title=\"settings\">⚙\u003c/button>\n\u003c/div>\n\u003cdiv id=\"cfg\">\n  \u003ch3>Connect\u003c/h3>\n  \u003cdiv class=\"row\">\u003cspan class=\"lbl\">endpoint\u003c/span>\u003cinput id=\"cUrl\" type=\"url\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cspan class=\"lbl\">key\u003c/span>\u003cinput id=\"cKey\" type=\"password\" placeholder=\"X-Api-Key (kept in memory only)\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cspan class=\"lbl\">\u003c/span>\u003cbutton id=\"cSave\" class=\"pri\">Save\u003c/button>\u003cbutton id=\"cClose\">Close\u003c/button>\u003c/div>\n  \u003cp id=\"cNote\" class=\"small\">\u003c/p>\n\u003c/div>\n\u003cdiv id=\"list\">\n  \u003cdiv id=\"fbar\" hidden>\n    \u003cdiv class=\"qrow\">\u003cinput id=\"q\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"filter: packed:none label:done status:&quot;In Progress&quot; follow_up!:none (Tab completes)\" aria-label=\"filter query\" aria-autocomplete=\"list\" aria-controls=\"sugg\">\u003cbutton id=\"qClear\" title=\"clear the filter\">Clear\u003c/button>\u003c/div>\n    \u003cul id=\"sugg\" role=\"listbox\" hidden>\u003c/ul>\n    \u003cdiv id=\"chips\" role=\"group\" aria-label=\"filter by value\">\u003c/div>\n    \u003cdiv id=\"bulk\">\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"rows\">\u003cp class=\"small\">Loading orders…\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv id=\"prev\">\n  \u003cdiv class=\"bar\">\u003ch3 style=\"margin:0\">Print preview\u003c/h3>\u003cspan class=\"small\" id=\"docHint\" style=\"margin-left:8px;color:var(--ink3)\">tap a page to leave it out\u003c/span>\u003cspan style=\"flex:1\">\u003c/span>\u003cbutton id=\"printBtn\" disabled>Print\u003c/button>\u003cbutton id=\"labelBtn\" disabled title=\"open the label on its own (PDF labels)\">Label\u003c/button>\u003c/div>\n  \u003ciframe id=\"doc\" title=\"print document\">\u003c/iframe>\n\u003c/div>\n\u003c/div>\n\u003cdiv id=\"toast\">\u003c/div>\n\u003cscript>\n/* Pack & Ship v2 (ca.pack_ship/1, ca.pack_page/1) — Tool Bench page for C841-s7.\n   The page renders only what the engine returns: stage columns, states and icons from pack.orders.stages (stage_defs, states,\n   orders[].stages), row buttons from orders[].actions (key, enabled, reason, inputs). It holds no action logic: a button posts\n   {op: action, params: {order_ref, action, inputs}} and the engine front door re-reads the order and runs what std pack_stages\n   page allows. Refresh posts op refresh; the reply names the poll op and its budget.\n   2.1.0 (C841-s10, C1141): each order's context (std pack_stages row_context, ca.pack_row_context/2) is drawn as a line under\n   the row: buyer username and full post code (joined by the engine page front door only), country, total with its currency,\n   item count and the customs badge; any other context field is shown as name: value. A quick filter (All, each country in\n   the loaded rows, each badge) narrows the rendered list in memory. Action buttons are compact, one wrapped row per order,\n   and their reason is a tooltip (hover title; keyboard focus or a tap shows it), not a line on the page. Rows live in\n   module variables only: nothing is written to localStorage, sessionStorage, IndexedDB or the Cache API. */\nconst TC = window.TOOL_CONFIG || {}, TM = window.TOOL_META || null;\nconst getPath = (o, p) => p.split(\".\").reduce((a, k) => (a && typeof a === \"object\") ? a[k] : undefined, o);\nconst PC = TC.packship || {};\nconst clampInt = (v, lo, hi, d) => { const n = Math.round(+v); return Number.isFinite(n) && n >= lo && n \u003c= hi ? n : d; };\nconst bound = (v, lo, hi, d) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };\nconst CONF = {\n  url: PC.url || \"https://komposing.app.n8n.cloud/webhook/ca-v3-pack-ship\",\n  key: getPath(PC, \"headers.X-Api-Key\") || getPath(TC, \"cav3.dashboard.headers.X-Api-Key\") || \"\",\n  keyFrom: getPath(PC, \"headers.X-Api-Key\") ? \"packship\" : (getPath(TC, \"cav3.dashboard.headers.X-Api-Key\") ? \"cav3\" : \"\"),\n  days: clampInt(PC.window_days, 1, 60, 14),\n  copies: clampInt(PC.copies, 1, 3, 1),\n  autoPrint: PC.auto_print == null ? true : !!PC.auto_print\n};\nconst $ = (s, r = document) => r.querySelector(s);\nconst esc = s => String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\nconst isObj = v => v && typeof v === \"object\" && !Array.isArray(v);\nconst trunc = (s, n) => { s = String(s == null ? \"\" : s); return s.length > n ? s.slice(0, n - 1) + \"…\" : s; };\nconst cap1 = s => String(s || \"\").replace(/[_.]/g, \" \").replace(/^./, c => c.toUpperCase());\nfunction toast(msg, bad){ const t = $(\"#toast\"); t.textContent = msg; t.className = bad ? \"bad\" : \"\"; t.style.display = \"block\"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = \"none\", bad ? 7000 : 3200); }\nfunction setSync(cls, text){ const s = $(\"#sync\"); s.className = cls; $(\"#syncT\").textContent = text; }\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\n/* ============================== transport ============================== */\n// Every reply is {status, outcome, message, ...}. A refusal is returned (never thrown) when soft is set, so callers can show it.\nasync function call(op, params, soft){\n  if (!CONF.key) throw new Error(\"No viewer key: set it in Tool Bench Settings (Pack & Ship or CA_V3 Viewer) or in ⚙\");\n  let res;\n  try {\n    res = await fetch(CONF.url, { method: \"POST\", headers: { \"Content-Type\": \"application/json\", \"X-Api-Key\": CONF.key },\n      body: JSON.stringify({ op, params: params || {} }), cache: \"no-store\" });\n  } catch (e) { throw new Error(\"Pack & Ship endpoint unreachable (network or CORS): \" + (e.message || e)); }\n  const txt = await res.text();\n  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(`HTTP ${res.status}: ${trunc(txt, 140) || \"empty response\"}`); }\n  if (Array.isArray(j)) j = j[0] || {};\n  if (soft) return j;\n  const d = isObj(j.data) ? j.data : j;\n  if (!res.ok || j.status === \"error\" || (j.outcome && j.outcome !== \"ok\")) {\n    const why = (d.errors || []).map(e => `${e.param}: ${e.reason}`).join(\"; \") || d.message || j.message || `HTTP ${res.status}`;\n    const err = new Error(`${op} ${j.outcome || d.outcome || \"refused\"}: ${why}`); err.body = j; throw err;\n  }\n  return d;\n}\n\n/* ============================== stages table ============================== */\nlet VIEW = { stage_defs: [], states: {}, orders: [], last_sync: {} }, SEL = \"\", JOB = null, BUSY_ACT = \"\";\nconst ICON = { orange: \"var(--s-orange)\", yellow: \"var(--s-yellow)\", green: \"var(--s-green)\", grey: \"var(--s-grey)\", gray: \"var(--s-grey)\" };\nconst iconColor = state => { const n = String(((VIEW.states || {})[state] || {}).icon || \"\"); return ICON[n] || (/^[a-z]+$|^#[0-9a-f]{3,8}$/i.test(n) ? n : \"var(--s-grey)\"); };\nasync function loadStages(){\n  setSync(\"busy\", \"loading\");\n  try {\n    const d = await call(\"orders_stages\", { window_days: clampInt($(\"#days\").value, 1, 60, CONF.days) });\n    VIEW = { stage_defs: Array.isArray(d.stage_defs) ? d.stage_defs : [], states: isObj(d.states) ? d.states : {}, orders: Array.isArray(d.orders) ? d.orders : [], last_sync: isObj(d.last_sync) ? d.last_sync : {} };\n    const rc = isObj(d.row_context) ? d.row_context : {};\n    NOTES = [].concat(Array.isArray(d.notes) ? d.notes : [], Array.isArray(rc.notes) ? rc.notes : [], Array.isArray(rc.overlay_notes) ? rc.overlay_notes : []);\n    TRUNC = !!d.truncated;\n    const ls = Object.entries(VIEW.last_sync).filter(([, v]) => v).map(([k, v]) => `${k} ${new Date(v).toLocaleTimeString(\"en-GB\", { hour: \"2-digit\", minute: \"2-digit\" })}`);\n    $(\"#last\").textContent = ls.length ? \"synced \" + ls.join(\" · \") : \"\";\n    renderOrders(); if (!REFRESH.running) setSync(\"ok\", \"ok \" + new Date().toLocaleTimeString(\"en-GB\"));\n  } catch (e) { setSync(\"err\", \"error\"); $(\"#rows\").innerHTML = `\u003cp class=\"small\">${esc(e.message)}\u003c/p>`; toast(e.message, true); }\n}\n// An action's inputs come from a page control of the same name (copies) or from an input drawn on the row (custom_text).\nconst PAGE_INPUT = { copies: () => clampInt($(\"#copies\").value, 1, 3, 1) };\n// Compact button: icon + short label; the reason is the wrapper's title (hover, also over a disabled button) and its data-tip\n// (shown on keyboard focus or a tap: the wrapper takes focus because a disabled button lets the pointer through).\n// C1146: the button text is the std label when given (Print / Reprint); confirm: true needs a second tap within 4 s.\nlet ARM = \"\", ARM_T = 0;\nconst ACT_ICON = { label: \"🏷\", message: \"✉️\", craft: \"🤖\", manual: \"✍️\", status: \"🔄\", shipped: \"📦\", follow_up: \"🚩\" };\nfunction actionHtml(o, a){\n  const id = `${o.order_ref}|${a.key}`;\n  const busy = BUSY_ACT === id;\n  const rowInputs = (Array.isArray(a.inputs) ? a.inputs : []).filter(n => !PAGE_INPUT[n]);\n  const name = String(a.label || \"\").trim() || cap1(a.key), why = String(a.reason || \"\"), armed = ARM === id, tip = `${name}${a.enabled ? \"\" : \" (not available)\"}: ${why}`;\n  const btn = `\u003cspan class=\"ab\" tabindex=\"0\" title=\"${esc(tip)}\" data-tip=\"${esc(tip)}\">\u003cbutton class=\"${armed ? \"arm\" : a.enabled ? \"pri\" : \"\"}\" data-act=\"${esc(a.key)}\" data-ref=\"${esc(o.order_ref)}\" ${a.enabled && !busy ? \"\" : \"disabled\"} aria-label=\"${esc(tip)}\">${busy ? \"…\" : armed ? esc(`Tap again to ${name.toLowerCase()}`) : esc((ACT_ICON[a.key] ? ACT_ICON[a.key] + \" \" : \"\") + name)}\u003c/button>\u003c/span>`;\n  const inp = a.enabled ? rowInputs.map(n => `\u003cdiv class=\"inp\">\u003cinput data-inp=\"${esc(n)}\" data-for=\"${esc(id)}\" maxlength=\"160\" placeholder=\"${esc(name)}: ${esc(cap1(n))} (optional)\" aria-label=\"${esc(name)}: ${esc(cap1(n))}\">\u003cspan class=\"cnt\" data-cnt=\"${esc(id)}|${esc(n)}\">0/160\u003c/span>\u003c/div>`).join(\"\") : \"\";\n  return { btn, extra: `${inp}\u003cdiv class=\"links\" data-links=\"${esc(id)}\">\u003c/div>` };\n}\n\n/* ============================== row context and quick filter ============================== */\n// The context object is whatever the engine returns for the order (std pack_stages row_context fields plus, on this page\n// only, the overlay buyer fields). Known fields get their own format; any other field is shown as name: value, so a field\n// added in the standard appears without a page change.\nlet NOTES = [], TRUNC = false;\nconst ctxOf = o => isObj(o.context) ? o.context : {};\nconst KNOWN = [\"buyer_username\", \"buyer_postcode\", \"country\", \"order_total\", \"currency\", \"item_count\", \"customs_badge\"];\nconst BADGES = [\"NI\", \"JE\", \"GG\", \"international\", \"?\"];\nconst badgeCls = b => \"c-\" + (b === \"?\" ? \"q\" : String(b).replace(/[^A-Za-z0-9_-]/g, \"\"));\nconst filled = v => v !== undefined && v !== null && String(v) !== \"\";\nfunction money(v, cur){\n  if (!filled(v) || !Number.isFinite(+v)) return \"\";\n  if (cur) { try { return new Intl.NumberFormat(\"en-GB\", { style: \"currency\", currency: String(cur) }).format(+v); } catch (e) { return (+v).toFixed(2) + \" \" + cur; } }\n  return (+v).toFixed(2);\n}\nfunction ctxHtml(o){\n  const c = ctxOf(o), parts = [];\n  if (filled(c.buyer_username)) parts.push(`\u003cspan class=\"u\" title=\"buyer\">${esc(c.buyer_username)}\u003c/span>`);\n  if (filled(c.buyer_postcode)) parts.push(`\u003cspan class=\"pc\" title=\"post code\">${esc(c.buyer_postcode)}\u003c/span>`);\n  if (filled(c.country)) parts.push(`\u003cspan title=\"country\">${esc(c.country)}\u003c/span>`);\n  const m = money(c.order_total, c.currency); if (m) parts.push(`\u003cspan title=\"order total\">${esc(m)}\u003c/span>`);\n  if (filled(c.item_count)) parts.push(`\u003cspan title=\"items\">${esc(c.item_count)} item${+c.item_count === 1 ? \"\" : \"s\"}\u003c/span>`);\n  if (filled(c.customs_badge)) parts.push(`\u003cspan class=\"chip ${badgeCls(c.customs_badge)}\" title=\"${c.customs_badge === \"?\" ? \"destination not resolved\" : \"customs paperwork expected\"}\">${esc(c.customs_badge)}\u003c/span>`);\n  Object.keys(c).filter(k => !KNOWN.includes(k) && filled(c[k]) && typeof c[k] !== \"object\").forEach(k => parts.push(`\u003cspan class=\"small\">${esc(cap1(k))}: ${esc(c[k])}\u003c/span>`));\n  return parts.length ? `\u003cdiv class=\"ctx\">${parts.join('\u003cspan class=\"sp\">·\u003c/span>')}\u003c/div>` : \"\";\n}\n/* ============================== row filter (C1194) ============================== */\n// The filter model is derived from the stage read alone, so a stage, status or context field added in std pack_stages\n// is filterable wi ;color:#C0392B;opacity:1}}\n    @media print{.pg.off{display:none!important}}\n  \u003c/style>\u003c/head>\u003cbody>${slip}${label}\u003cscript>addEventListener(\"message\", e => { if (e.data && e.data.type === \"packship:print\") { focus(); print(); } });\n    function lastv(){ const all = document.querySelectorAll(\".pg\"); all.forEach(p => p.classList.remove(\"lastv\")); const on = [...all].filter(p => !p.classList.contains(\"off\")); if (on.length) on[on.length - 1].classList.add(\"lastv\"); }\n    document.addEventListener(\"click\", e => { const p = e.target.closest && e.target.closest(\".pg\"); if (p) { p.classList.toggle(\"off\"); lastv(); } }); lastv();\u003c\\/script>\u003c/body>\u003c/html>`;\n}\n\n/* ============================== refresh (pack.refresh, polled) ============================== */\n// The engine refuses a start while a sync chain sharing steps runs (outcome busy) and answers started with run_id and poll\n// {op, every_ms, max_ms}. The page polls that op until the run is done, the budget runs out or the tab is closed.\nconst REFRESH = { running: false, run: \"\", poll: null };\nfunction setRefresh(running, label){ REFRESH.running = running; const b = $(\"#refresh\"); b.disabled = running; b.textContent = running ? (label || \"Running…\") : \"Refresh\"; }\nasync function checkBusy(){\n  try { const r = await call(\"run_status\", {}, true); if (r.status === \"ok\" && isObj(r.data) && r.data.busy === true) { setRefresh(true, \"Sync running\"); setSync(\"busy\", \"sync chain running\"); return true; } }\n  catch (e) { /* the button stays usable; the start itself is guarded */ }\n  if (!REFRESH.run) setRefresh(false); return false;\n}\nasync function waitNotBusy(every, max){ const t0 = Date.now(); while (Date.now() - t0 \u003c max) { await sleep(every); if (!(await checkBusy())) return true; } return false; }\n$(\"#refresh\").onclick = async () => {\n  setRefresh(true, \"Starting…\"); setSync(\"busy\", \"starting refresh\");\n  let r;\n  try { r /* =========================================================

   own card fields, so a file is complete on its own. The bench reads it
   on import and rewrites it on every save with the new version.
   ========================================================= */
const TOOL_FORMAT = "toolbench.tool/1";

  const out = { found:false, fields:{}, error:"" };

      if (f.format && f.format !== TOOL_FORMAT) throw new Error("format " + f.format + " isn't " + TOOL_FORMAT);

    contract: normaliseContract(t.contract), sandbox: Object.assign({}, DEFAULT_SANDBOX, t.sandbox || {}),

  html = html || "";

  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + "\n" + tag);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + "<head>\n" + tag + "\n</head>");

function withBlock(t){ return t.source.kind !== "inline" ? t.source : { kind:"inline", html: writeToolBlock(t.source.html, toolFields(t)) }; }

/* ========================= state ========================= */
const DEFAULT_SANDBOX = { scripts:true, forms:true, modals:true, popups:true, downloads:true, sameOrigin:false };

/* =========================================================

   ========================================================= */
const ERRORS_MAX = 200;

// values its schema names (others are dropped) with the right types. The answer goes back to that

window.addEventListener("message", ev => {
  const d = ev.data;
  if (!d || d.type !== "toolbench:config:set") return;
  const frame = document.getElementById("runFrame");
  if (!frame || ev.source !== frame.contentWindow || !document.getElementById("runner").classList.contains("open")) return;

  if (!BUNDLE || !Array.isArray(BUNDLE.tools)) return [];

    const o = state.overlay[rt.id] || {};

      name: rt.name, description: rt.description || "", category: rt.category || "General", tags: rt.tags || [],

      sandbox: Object.assign({}, DEFAULT_SANDBOX, rt.sandbox || {}),

const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function getPath(o, p){ return p.split(".").reduce((a, k) => isObj(a) && own(a, k) ? a[k] : undefined, o); }
function setPath(o, p, v){
  const ks = p.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++){ if (!isObj(a[ks[i]])) a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}
function delPath(o, p){
  const ks = p.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++){ if (!isObj(a) || !isObj(a[ks[i]])) return; a = a[ks[i]]; }
  if (isObj(a)) delete a[ks[ks.length - 1]];
}
function leafPaths(o, pre = "", out = []){
  for (const [k, v] of Object.entries(o)){ const p = pre ? pre + "." + k : k; isObj(v) ? leafPaths(v, p, out) : out.push(p); }
  return out;
}
const isSecretField = f => f.type === "secret" || f.secret === true;
const isEmptyVal = v => v === undefined || v === null || (typeof v === "string" && v.trim() === "");
function fieldValueError(f, v){
  if (typeof v === "string" && /^\s*<[^>]*>\s*$/.test(v)) return "is a placeholder";
  switch (f.type){
    case "url": return typeof v === "string" && /^https?:\/\/\S+$/i.test(v) ? "" : "must be an http(s) URL";
    case "number": return typeof v === "number" && isFinite(v) ? "" : "must be a number";
    case "boolean": return typeof v === "boolean" ? "" : "must be true or false";
    case "enum": return (f.values || []).includes(v) ? "" : "must be one of " + (f.values || []).join(", ");
    default: return typeof v === "string" ? "" : "must be text";
  }
}
// A local tool's config_schema, checked like scripts/build.mjs checks repo tools. Invalid -> none.
function normaliseConfigSchema(raw, configKeys){
  if (!isObj(raw)) return null;
  const ns = raw.namespace;
  if (typeof ns !== "string" || !NS_RE.test(ns) || !(configKeys || []).includes(ns)) return null;
  if (!Array.isArray(raw.fields) || !raw.fields.length || raw.fields.length > 50) return null;
  const fields = [], paths = [];
  for (const f of raw.fields){
    if (!isObj(f) || typeof f.path !== "string" || !PATH_RE.test(f.path) || !FIELD_TYPES.includes(f.type)) return null;
    if (f.path.split(".").some(s => BAD_SEGMENTS.includes(s))) return null;
    if (paths.some(p => p === f.path || p.startsWith(f.path + ".") || f.path.startsWith(p + "."))) return null;
    paths.push(f.path);
    const out = { path: f.path, label: String(f.label || f.path).slice(0, 80), type: f.type, required: f.required === true };
    if (f.type === "enum"){
      if (!Array.isArray(f.values) || !f.values.length) return null;
      out.values = f.values.map(String);
    }
    if (f.secret === true || f.type === "secret") out.secret = true;
    if (f.default !== undefined){
      if (out.secret || fieldValueError(out, f.default)) return null;
      out.default = f.default;
    }
    if (typeof f.help === "string" && f.help) out.help = f.help.slice(0, 300);
    fields.push(out);
  }
  return { namespace: ns, fields };
}
// Stored values for the tool's namespace, with defaults where nothing is stored.
function withDefaults(cs, stored){
  const out = isObj(stored) ? clone(stored) : {};
  for (const f of cs.fields) if (f.default !== undefined && isEmptyVal(getPath(out, f.path))) setPath(out, f.path, clone(f.default));
  return out;
}
function effectiveSettings(t){ return withDefaults(t.config_schema, state.config[t.config_schema.namespace]); }
function settingsErrors(cs, values){
  const out = [];
  for (const f of cs.fields){
    const v = getPath(values, f.path);
    if (isEmptyVal(v)){ if (f.required) out.push({ path: f.path, label: f.label, reason: "missing" }); continue; }
    const e = fieldValueError(f, v);
    if (e) out.push({ path: f.path, label: f.label, reason: e });
  }
  return out;
}
const describeErrors = list => list.map(e => `${e.label} (${e.path}) ${e.reason}`);
// Every secret field any tool declares: {ns, path}.
function secretPaths(){
  const out = [], seen = new Set();
  allTools().forEach(t => t.config_schema && t.config_schema.fields.filter(isSecretField).forEach(f => {
    const k = t.config_schema.namespace + "\u0000" + f.path;
    if (!seen.has(k)){ seen.add(k); out.push({ ns: t.config_schema.namespace, path: f.path }); }
  }));
  return out;
}
function maskSecrets(cfg){
  const c = clone(cfg || {});
  for (const s of secretPaths()) if (isObj(c[s.ns]) && !isEmptyVal(getPath(c[s.ns], s.path))) setPath(c[s.ns], s.path, MASK);
  return c;
}
function stripSecrets(cfg){
  const c = clone(cfg || {});
  for (const s of secretPaths()) if (isObj(c[s.ns])) delPath(c[s.ns], s.path);
  return c;
}
// After an edit of masked or secret-stripped JSON: a secret left masked or absent keeps the stored value.
function restoreSecrets(next, prev){
  for (const s of secretPaths()){
    const v = isObj(next[s.ns]) ? getPath(next[s.ns], s.path) : undefined;
    if (v !== undefined && v !== MASK) continue;
    const pv = isObj(prev && prev[s.ns]) ? getPath(prev[s.ns], s.path) : undefined;
    if (pv !== undefined){ if (!isObj(next[s.ns])) next[s.ns] = {}; setPath(next[s.ns], s.path, pv); }
    else if (v === MASK) delPath(next[s.ns], s.path);
  }
  return next;
}
// Values from a form or a tool, checked against the schema and merged over what's stored
// (keys the schema doesn't name are kept). requireAll: the result must satisfy required fields.
function applySettings(t, values, requireAll){
  const cs = t.config_schema, errors = [];
  const next = isObj(state.config[cs.namespace]) ? clone(state.config[cs.namespace]) : {};
  const known = new Set(cs.fields.map(f => f.path));
  for (const f of cs.fields){
    const v = own(values, f.path) ? values[f.path] : getPath(values, f.path);
    if (v === undefined) continue;
    if (isEmptyVal(v)){ delPath(next, f.path); continue; }
    const e = fieldValueError(f, v);
    if (e) errors.push(`${f.label} (${f.path}) ${e}`); else setPath(next, f.path, v);
  }
  const dropped = leafPaths(values).filter(p => !known.has(p));
  const missing = settingsErrors(cs, withDefaults(cs, next)).filter(e => e.reason === "missing");
  if (requireAll) errors.push(...describeErrors(missing));
  return { errors, next, dropped, missing };
}
function normaliseContract(raw){
  const c = Object.assign(blankContract(), raw || {});
  const list = v => Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : [];
  return { config_keys: list(c.config_keys), requires: list(c.requires) };
}

/* ========================= validation and shape ========================= */
function validateLocalTool(t, i){
  const where = `Tool ${i+1}${t && t.name ? " (" + t.name + ")" : ""}`;
  if (!t || typeof t !== "object") throw new Error(`${where} is not an object`);
  if (!t.name || typeof t.name !== "string") throw new Error(`${where} needs a name`);
  if (!t.source || typeof t.source !== "object") throw new Error(`${where} needs a source`);
  if (t.source.kind === "url" || t.source.kind === "fetch"){
    if (!/^https?:\/\//i.test(t.source.url || "")) throw new Error(`${where} has a link that isn't http(s)`);
  } else if (typeof t.source.html !== "string" || !t.source.html.trim()){
    throw new Error(`${where} has no HTML`);
  }
  if (t.version !== undefined && !isSemver(t.version)) throw new Error(`${where} has version ${t.version}, expected x.y.z`);
}
// v2 kept a save counter (v = 1, 2, 3...); schema 3 uses semver: save n becomes 1.0.(n-1)
const counterToSemver = n => `1.0.${Math.max(0, (+n || 1) - 1)}`;
function sanitiseLocalTool(t){
  const version = isSemver(t.version) ? t.version : counterToSemver(t.v);
  const hist = Array.isArray(t.history) ? t.history.slice(-HISTORY_MAX).map(h => Object.assign({}, h, {
    version: isSemver(h.version) ? h.version : counterToSemver(h.v) })) : [];
  hist.forEach(h => delete h.v);
  return {
    id: t.id, origin:"local", name: String(t.name), description: String(t.description||""),
    category: String(t.category||"General"), tags: Array.isArray(t.tags) ? t.tags.map(String) : [],
    source: (t.source.kind === "url" || t.source.kind === "fetch") ? { kind: t.source.kind, url: String(t.source.url) } : { kind:"inline", html: String(t.source.html) },
    sandbox: Object.assign({}, DEFAULT_SANDBOX, t.sandbox || {}),
    config: (t.config && typeof t.config === "object" && !Array.isArray(t.config)) ? t.config : {},
    contract: normaliseContract(t.contract),
    config_schema: normaliseConfigSchema(t.config_schema, normaliseContract(t.contract).config_keys),
    pinned: !!t.pinned, runs: +t.runs || 0, lastRun: t.lastRun || null,
    version, history: hist,
    createdAt: t.createdAt || Date.now(), updatedAt: t.updatedAt || Date.now(),
    forkedFrom: t.forkedFrom || undefined
  };
}
function reseq(){
  state.seq = Math.max(1, state.seq|0, ...state.tools.map(t => (parseInt(String(t.id).split(":")[1],10)||0)+1));
}

/* ========================= migration ========================= */
// v1 -> v3: tools become origin local with a contract, history and semver; the v1 seed
// "Config probe" is dropped because the repo ships it.
function migrateV1(v1){
  const tools = (v1.tools||[]).filter(t => !(t.name === "Config probe" && (t.category === "Bench") && (t.tags||[]).includes("diagnostic")));
  return { schema: 3, seq: v1.seq || 1, config: v1.config || {}, overlay: {}, tools: tools.map(sanitiseLocalTool) };
}
// v2 -> v3: save counters become semver; everything else carries over.
function migrateV2(v2){
  return { schema: 3, seq: v2.seq || 1, config: v2.config || {}, overlay: v2.overlay || {}, tools: (v2.tools||[]).map(sanitiseLocalTool) };
}
const MIGRATE = { "toolbench:v2": migrateV2, "toolbench:v1": migrateV1 };

/* ========================= render ========================= */
function categories(){
  const m = new Map();
  allTools().forEach(t => { const c = t.category || "General"; m.set(c, (m.get(c)||0)+1); });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}
function matches(t){
  const q = filter.q.trim().toLowerCase();
  if (filter.cat !== "*" && (t.category || "General") !== filter.cat) return false;
  if (!q) return true;
  const c = t.contract || {};
  return [t.name, t.description, t.id, t.category, t.origin, t.version, (t.tags||[]).join(" "),
          (c.requires||[]).join(" "), (c.config_keys||[]).join(" ")]
    .join(" ").toLowerCase().includes(q);
}

function renderGrid(){

  const list = tools.filter(matches)
    .sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || a.name.localeCompare(b.name));

  $("#benchTitle").textContent = filter.cat === "*" ? "All tools" : filter.cat;
  $("#benchSub").textContent = tools.length ? `${list.length} of ${tools.length} shown` : "";

  if (!tools.length){
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h2>No tools yet</h2>
      <p>Drop your .html files anywhere on this page, or add one by hand.</p>
      <button class="btn primary" data-act="add">Add your first tool</button></div>`;
    return;
  }
  if (!list.length){
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h2>Nothing matches</h2><p>Try a different search or channel.</p></div>`;
    return;
  }

  $("#grid").innerHTML = list.map(t => {
    const cat = t.category || "General";
    const runs = t.runs ? `${t.runs} run${t.runs===1?"":"s"}` : "never run";
    const chk = contractCheck(t);
    const blocked = chk.blocked;
    const needs = chk.missing.concat(chk.fields.map(f => f.label));
    const src = t.origin === "repo" ? "repo" : (t.source.kind === "url" ? "link" : t.source.kind === "fetch" ? "fetched" : "local");
    const deps = (t.contract && t.contract.requires) || [];
    const nErr = toolErrorCount(t.id);
    return `<article class="tool" data-id="${esc(t.id)}">
      <div class="tape" style="--tape:${tapeFor(cat)}">
        ${esc(t.id)}<span class="cat">${src} · v${esc(t.version || "?")}</span>
      </div>
      <div class="body">
        <h3>${esc(t.name)}</h3>
        <p>${esc(t.description || "No description yet.")}</p>
        ${(t.tags||[]).length || deps.length || nErr ? `<div class="tags">
          ${nErr ? `<span class="tag bad" title="Errors logged for this tool (Errors and fixes)">${nErr} error${nErr===1?"":"s"}</span>` : ""}
          ${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}
          ${deps.map(d=>`<span class="tag dep ${chk.badKeys.includes(d)?"bad":""}" title="Depends on">${esc(d)}</span>`).join("")}
        </div>` : ""}
      </div>
      <div class="acts">
        <button class="run ${blocked?"blocked":""}" data-act="run" ${blocked?`title="Needs settings: ${esc(needs.join(", "))}"`:""}>${blocked?"Needs settings":"Run"}</button>
        <button class="icobtn ${t.pinned?"on":""}" data-act="pin" title="${t.pinned?"Unpin":"Pin to top"}" aria-label="Pin">★</button>
        <button class="icobtn" data-act="menu" title="More" aria-label="More">⋯</button>
      </div>
      <div class="acts" style="border-top:none;padding-top:0;margin-top:0">
        <span class="meta">${esc(cat)} · ${runs}</span>
      </div>
    </article>`;
  }).join("");
}

function renderBrand(){
  const b = $("#verLabel");
  b.textContent = BUNDLE ? "v" + MANIFEST.version : "unbuilt source";
  b.classList.toggle("unbuilt", !BUNDLE);
}
function render(){ renderBrand(); renderRail(); renderGrid(); }

/* ========================= running a tool ========================= */
function sandboxAttr(sb){
  const out = [];
  if (sb.scripts) out.push("allow-scripts");
  if (sb.forms) out.push("allow-forms");
  if (sb.modals) out.push("allow-modals");
  if (sb.popups) out.push("allow-popups", "allow-popups-to-escape-sandbox");
  if (sb.downloads) out.push("allow-downloads");
  if (sb.sameOrigin) out.push("allow-same-origin");
  return out.join(" ");
}
function toolMeta(t){
  return { id: t.id, name: t.name, category: t.category || "General", origin: t.origin, version: t.version,
           host: "tool-bench", host_version: MANIFEST.version, contract: t.contract || blankContract() };
}
function injectConfig(html, t, opts){
  const reporter = (opts && opts.reporter === false) ? "" : REPORTER;
  const tag = "<scr" + "ipt>" + reporter + "window.TOOL_CONFIG=" + safeJson(mergedConfig(t)) +
              ";window.TOOL_META=" + safeJson(toolMeta(t)) + ";</scr" + "ipt>";
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + tag);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + "<head>" + tag + "</head>");
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\">" + tag + "</head><body>" + html + "</body></html>";
}

/* Fetched tools (registry run "fetch"): the url is read with fetch() (no credentials), its
   X-CA-SHA256 header, when sent, is checked against the body, and the html runs inline like a
   file tool (same sandbox, injection and reporter). The html is kept in memory for this page
   only, never in localStorage. */
const FETCHED = new Map();   // url -> { html, sha256, verified, version }
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
async function fetchTool(t, fresh){
  const url = t.source.url;
  if (!fresh && FETCHED.has(url)) return FETCHED.get(url);
  let res;
  try { res = await fetch(url, { credentials:"omit", cache:"no-store", redirect:"follow" }); }
  catch(e){ throw Object.assign(new Error("Could not fetch the tool (network error or CORS refused): " + (e.message || e)), { status: 0 }); }
  if (!res.ok) throw Object.assign(new Error(`The host answered HTTP ${res.status}${res.statusText ? " " + res.statusText : ""}`), { status: res.status });
  const buf = await res.arrayBuffer();
  const want = (res.headers.get("X-CA-SHA256") || "").trim().toLowerCase();
  let got = "";
  if (want){
    if (!(window.crypto && crypto.subtle)) throw Object.assign(new Error("The host sent X-CA-SHA256 but this page can't hash (no crypto.subtle; open the bench over https or file)"), { status: res.status });
    got = hex(await crypto.subtle.digest("SHA-256", buf));
    if (got !== want) throw Object.assign(new Error(`Hash mismatch: X-CA-SHA256 ${want}, body ${got}`), { status: res.status, mismatch: true });
  }
  const entry = { html: new TextDecoder("utf-8").decode(buf), sha256: got || want, verified: !!want,
                  version: res.headers.get("X-CA-Version") || "", bytes: buf.byteLength };
  FETCHED.set(url, entry);
  return entry;
}
let runToken = 0;
async function runFetched(t, frame, token, fresh){
  frame.srcdoc = `<!DOCTYPE html><meta charset="utf-8"><body style="font:13px ui-monospace,Menlo,monospace;padding:20px;color:#6b6a64">Fetching ${esc(t.source.url)}…</body>`;
  try {
    const f = await fetchTool(t, fresh);
    if (token !== runToken) return;   // another run started meanwhile
    $("#runSandbox").textContent = (t.sandbox && t.sandbox.sameOrigin ? "trusted · full access" : "sandboxed") +
      (f.verified ? " · sha256 ok" : " · unverified (no X-CA-SHA256)") + (f.version ? " · host v" + f.version : "");
    frame.dataset.sha256 = f.sha256 || "";
    frame.srcdoc = injectConfig(f.html, t);
  } catch(e){
    if (token !== runToken) return;
    logError({ scope:"bench", kind: e.mismatch ? "integrity" : "fetch",
               message: `${t.id} v${t.version}: ${e.message}`, source: t.source.url });
    closeRunner();
    fetchErrorSheet(t, e);
  }
}
function fetchErrorSheet(t, e){
  openSheet(`<div class="sheet">
    <div class="sheethead"><h2>${e.mismatch ? "Refused: hash mismatch" : "Couldn't fetch the tool"}</h2><span class="sub">${esc(t.id)}</span>
      <button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheetbody">
      <table class="t"><tbody>
        <tr><td>Tool</td><td>${esc(t.name)} · v${esc(t.version)}</td></tr>
        <tr><td>URL</td><td><code>${esc(t.source.url)}</code></td></tr>
        <tr><td>Status</td><td class="no">${e.status ? "HTTP " + esc(e.status) : "no response (network or CORS)"}</td></tr>
        <tr><td>Detail</td><td>${esc(e.message)}</td></tr>
      </tbody></table>
      <div class="note">${e.mismatch ? "The body doesn't match the hash the host sent, so the bench won't run it." : "The bench fetches this tool without credentials; the host must answer 200 with CORS allowing this page."} It's in Errors and fixes.</div>
    </div>
    <div class="sheetfoot"><div class="spacer"></div><button class="btn primary" data-act="close">Close</button></div></div>`);
}

function openRunner(id, fresh, opts){
  const t = findTool(id); if (!t) return;
  const chk = contractCheck(t);
  if (chk.blocked){ closeRunner(); blockedSheet(t, chk); return; }   // fail closed (I4)
  if (!(opts && opts.reload)){ touchRun(t); renderGrid(); }

  const frame = $("#runFrame");
  frame.setAttribute("sandbox", sandboxAttr(t.sandbox || DEFAULT_SANDBOX));
  frame.removeAttribute("src"); frame.removeAttribute("srcdoc");
  const token = ++runToken;

  if (t.source.kind === "fetch"){
    frame.onload = null;
    runFetched(t, frame, token, fresh);
  } else if (t.source.kind === "url"){
    let origin = "*";
    try { origin = new URL(t.source.url).origin; } catch(e){}
    frame.src = t.source.url;
    frame.onload = () => {
      try { frame.contentWindow.postMessage(
        { type:"toolbench:config", config: mergedConfig(t), meta: toolMeta(t) }, origin); } catch(e){}
    };
  } else {
    frame.srcdoc = injectConfig(t.source.html || "", t);
    frame.onload = null;
  }

  $("#runId").textContent = t.id;
  $("#runName").textContent = t.name + " · v" + (t.version || "?");
  const sb = t.sandbox || DEFAULT_SANDBOX;
  $("#runSandbox").textContent = sb.sameOrigin ? "trusted · full access" : "sandboxed";
  $("#runner").classList.add("open");
  $("#runner").dataset.id = id;
}
function closeRunner(){
  runToken++;
  const f = $("#runFrame");
  f.removeAttribute("src"); f.removeAttribute("srcdoc"); f.onload = null;
  $("#runner").classList.remove("open");
}
function standaloneUrl(t){
  if (t.source.kind === "url") return t.source.url;
  if (t.source.kind === "fetch"){
    const f = FETCHED.get(t.source.url);
    if (!f) return t.source.url;   // not fetched yet this session
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(new Blob([injectConfig(f.html, t)], { type:"text/html" }));
    return currentBlobUrl;
  }
  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  currentBlobUrl = URL.createObjectURL(new Blob([injectConfig(withBlock(t).html, t)], { type:"text/html" }));
  return currentBlobUrl;
}

/* ========================= sheets (modals) ========================= */
function openSheet(html){ $("#sheetSlot").innerHTML = html; $("#scrim").classList.add("open"); }
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheetSlot").innerHTML = ""; editingId = null; }

  openSheet(`<div class="sheet">

let sheetBase = null;   // the version the open sheet was opened at
