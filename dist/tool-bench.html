<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Bench</title>
<style>
:root{
  --chassis:#171C22;
  --chassis-2:#222B34;
  --chassis-3:#2E3A45;
  --bench:#DEDBD2;
  --bench-2:#D2CEC3;
  --card:#FBFAF7;
  --ink:#12161A;
  --ink-2:#414D57;
  --muted:#6E7A85;
  --line:#C3BFB3;
  --tape:#F0B429;
  --live:#2E7D6B;
  --alert:#B3402E;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--chassis);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chassis ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{
  display:flex;align-items:center;gap:14px;padding:0 14px;height:52px;
  background:var(--chassis);border-bottom:1px solid #000;
}
.brand{display:flex;align-items:baseline;gap:9px;color:#F4F2ED;flex:none}
.brand b{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.brand button{font-family:var(--mono);font-size:10px;color:#6C7B88;letter-spacing:.1em;padding:0}
.brand button:hover{color:#E7EBEE}
.brand button.unbuilt{color:var(--tape)}
.search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--chassis-2);border:1px solid #0C1014;border-radius:var(--r);padding:0 10px;height:32px;
}
.search input{flex:1;background:none;border:none;color:#E9E7E1;font-family:var(--mono);font-size:12.5px}
.search input::placeholder{color:#67757F}
.search input:focus{outline:none}
.search kbd{
  font-family:var(--mono);font-size:10px;color:#7C8B96;border:1px solid #3A4650;
  border-radius:2px;padding:1px 5px;
}
.top .spacer{flex:1}
.btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--chassis-3);color:#CBD3DA;background:var(--chassis-2);
  padding:7px 12px;border-radius:var(--r);white-space:nowrap;
}
.btn:hover{background:var(--chassis-3);color:#fff}
.btn.primary{background:var(--tape);border-color:#C8901A;color:#1A1305;font-weight:600}
.btn.primary:hover{background:#FFC544}
.btn.danger{color:#E9A093;border-color:#5A3128}
.btn.danger:hover{background:var(--alert);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- body ---------- */
.main{display:grid;grid-template-columns:198px 1fr;min-height:0}
.rail{
  background:var(--chassis);border-right:1px solid #000;padding:14px 0;
  overflow-y:auto;display:flex;flex-direction:column;gap:2px;
}
.rail h4{
  margin:0 0 6px;padding:0 16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#5D6B76;font-weight:500;
}
.chan{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 16px;text-align:left;
  color:#9BA8B2;font-family:var(--mono);font-size:12px;border-left:2px solid transparent;
}
.chan:hover{color:#E7EBEE;background:#1D242B}
.chan.on{color:#fff;background:#1D242B;border-left-color:var(--tape)}
.chan .led{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor;opacity:.75}
.chan .n{margin-left:auto;font-size:10.5px;color:#5D6B76}
.rail hr{border:none;border-top:1px solid #262F37;margin:12px 16px}
.rail .foot{margin-top:auto;padding:12px 16px 0}
.meter{height:3px;background:#262F37;border-radius:2px;overflow:hidden;margin:8px 0 5px}
.meter i{display:block;height:100%;background:var(--live)}
.meter i.warn{background:var(--tape)}
.meter i.full{background:var(--alert)}
.foot small{font-family:var(--mono);font-size:9.5px;color:#5D6B76;letter-spacing:.06em;display:block}

.bench{background:var(--bench);overflow-y:auto;padding:20px 22px 60px;position:relative}
.bench.drop::after{
  content:"Drop .html files to add them";position:absolute;inset:8px;z-index:5;
  border:2px dashed var(--ink-2);border-radius:6px;background:rgba(222,219,210,.94);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
}
.benchhead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.benchhead h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.benchhead p{margin:0;color:var(--muted);font-size:12.5px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}

/* ---------- tool card: a printed label ---------- */
.tool{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.06);transition:transform .12s ease,box-shadow .12s ease;
}
.tool:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(23,28,34,.14)}
.tape{
  position:relative;padding:6px 14px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:#1A1305;font-weight:600;
  background:
    radial-gradient(circle at 5px 50%, var(--card) 2.5px, transparent 2.6px),
    radial-gradient(circle at calc(100% - 5px) 50%, var(--card) 2.5px, transparent 2.6px),
    var(--tape);
  border-bottom:1px solid rgba(0,0,0,.14);
}
.tape .cat{margin-left:auto;font-weight:500;letter-spacing:.1em;opacity:.72;text-transform:none}
.tool .body{padding:12px 14px 0;flex:1}
.tool h3{margin:0 0 4px;font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.tool p{margin:0;color:var(--muted);font-size:12.5px;min-height:34px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line);border-radius:2px;padding:2px 5px;background:#F1EFE9;
}
.tag.dep{text-transform:none;letter-spacing:.02em;background:#E9EEF1;border-color:#C5D0D7}
.tag.bad{color:var(--alert);border-color:#E2B3A8;background:#F6E9E5}
.tool .acts{display:flex;align-items:center;gap:6px;padding:11px 14px;border-top:1px dotted var(--line);margin-top:12px}
.run{
  flex:1;background:var(--chassis);color:#F2F0EB;border-radius:var(--r);padding:7px 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
}
.run:hover{background:var(--chassis-3)}
.run.blocked{background:#5B3A33}
.icobtn{
  width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:14px;background:#F5F3EE;
}
.icobtn:hover{background:#E8E5DD;color:var(--ink)}
.icobtn.on{background:var(--tape);border-color:#C8901A;color:#1A1305}
.meta{font-family:var(--mono);font-size:9.5px;color:#98A0A8;letter-spacing:.05em}

.empty{
  border:1px dashed var(--line);border-radius:6px;padding:44px 24px;text-align:center;background:rgba(251,250,247,.5);
}
.empty h2{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--muted);font-size:13px}

/* ---------- run view ---------- */
.runner{position:fixed;inset:0;z-index:40;background:var(--chassis);display:none;grid-template-rows:44px 1fr}
.runner.open{display:grid}
.runbar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #000}
.runbar .id{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;background:var(--tape);color:#1A1305;
  padding:3px 8px;border-radius:2px;font-weight:600;
}
.runbar .nm{color:#EDEBE6;font-size:13.5px;font-weight:500}
.runbar .sb{font-family:var(--mono);font-size:10px;color:#6C7B88;letter-spacing:.08em}
.runner iframe{width:100%;height:100%;border:none;background:#fff}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,16,20,.62);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.scrim.open{display:flex}
.sheet{
  width:100%;max-width:620px;background:var(--bench);border-radius:5px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.sheet.wide{max-width:800px}
.sheethead{
  display:flex;align-items:center;gap:10px;background:var(--chassis);padding:12px 16px;color:#EDEBE6;
}
.sheethead h2{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.sheethead .sub{font-family:var(--mono);font-size:10px;color:#6C7B88}
.sheethead .x{margin-left:auto;color:#8B98A2;font-size:18px;line-height:1;padding:2px 6px}
.sheethead .x:hover{color:#fff}
.sheetbody{padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 190px);overflow-y:auto}
.sheetfoot{display:flex;gap:8px;padding:12px 16px;background:var(--bench-2);border-top:1px solid var(--line)}
.sheetfoot .spacer{flex:1}

label.f{display:flex;flex-direction:column;gap:5px}
label.f > span,.lbl{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
}
.in,textarea.in,select.in{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;
  font-size:13px;width:100%;
}
textarea.in{font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical;min-height:120px}
.in:focus,textarea.in:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 2px rgba(65,77,87,.14)}
.in[readonly]{background:#EFEDE7;color:var(--ink-2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content}
.tabs button{
  padding:6px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);background:var(--bench-2);border-right:1px solid var(--line);
}
.tabs button:last-child{border-right:none}
.tabs button.on{background:var(--chassis);color:#F2F0EB}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--chassis);width:15px;height:15px}
.warn{
  border-left:3px solid var(--alert);background:#F6E9E5;padding:9px 11px;border-radius:2px;
  font-size:12px;color:#6A2F22;
}
.note{
  border-left:3px solid var(--ink-2);background:#ECEAE3;padding:9px 11px;border-radius:2px;
  font-size:12px;color:var(--ink-2);
}
.err{color:var(--alert);font-size:12px;font-family:var(--mono);min-height:16px}
.cfgsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 4px;display:flex;flex-direction:column;gap:12px}
.cfghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cfghead h3{margin:0;font-size:14px;font-weight:600}
.cfgfoot{display:flex;align-items:center;gap:10px;border-top:1px dotted var(--line);padding-top:10px}

/* ---------- tables in sheets ---------- */
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;word-break:break-word}
table.t{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line)}
table.t th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);background:var(--bench-2);padding:6px 8px;border-bottom:1px solid var(--line)
}
table.t td{padding:6px 8px;border-bottom:1px dotted var(--line);vertical-align:top}
table.t code,.kv code{font-family:var(--mono);font-size:11px}
.ok{color:var(--live)} .no{color:var(--alert)}

/* ---------- menu ---------- */
.menu{
  position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 26px rgba(23,28,34,.22);padding:4px;min-width:190px;display:none;
}
.menu.open{display:block}
.menu button{
  display:block;width:100%;text-align:left;padding:7px 10px;font-size:12.5px;border-radius:2px;color:var(--ink-2);
}
.menu button:hover{background:var(--bench-2);color:var(--ink)}
.menu button.rm{color:var(--alert)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:70;
  background:var(--chassis);color:#F2F0EB;padding:9px 16px;border-radius:var(--r);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;box-shadow:0 8px 22px rgba(0,0,0,.3);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;border-right:none;border-bottom:1px solid #000;align-items:center}
  .rail h4,.rail hr,.rail .foot{display:none}
  .chan{width:auto;border-left:none;border-radius:var(--r);padding:6px 11px;white-space:nowrap}
  .chan.on{box-shadow:inset 0 -2px 0 var(--tape)}
  .row{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .search{max-width:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Tool Bench</b><button id="verLabel" title="Dependencies and build">v?</button></div>
    <div class="search">
      <span style="color:#67757F;font-family:var(--mono);font-size:12px">/</span>
      <input id="q" type="search" placeholder="Search tools, tags, IDs, deps" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnSettings">Settings</button>
    <button class="btn primary" id="btnAdd">Add tool</button>
  </header>

  <div class="main">
    <nav class="rail" id="rail"></nav>
    <section class="bench" id="bench">
      <div class="benchhead">
        <h1 id="benchTitle">All tools</h1>
        <p id="benchSub"></p>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<div class="runner" id="runner">
  <div class="runbar">
    <span class="id" id="runId"></span>
    <span class="nm" id="runName"></span>
    <span class="sb" id="runSandbox"></span>
    <div class="spacer" style="flex:1"></div>
    <button class="btn" id="runReload">Reload</button>
    <button class="btn" id="runPop">Open standalone</button>
    <button class="btn" id="runClose">Close</button>
  </div>
  <iframe id="runFrame" title="Tool"></iframe>
</div>

<div class="scrim" id="scrim"><div id="sheetSlot"></div></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   Bundle — what the repo ships: manifest and repo tools.
   ========================================================= */
const BUNDLE = (() => {
  try {
    const v = JSON.parse(document.getElementById("tb-bundle").textContent);
    return (v && typeof v === "object" && v.manifest) ? v : null;
  } catch (e) { return null; }
})();
const MANIFEST = BUNDLE ? BUNDLE.manifest : { name:"tool-bench", version:"0.0.0-unbuilt", storage:{ key:"toolbench:v3", schema:3 } };
const KNOWN_KINDS = (MANIFEST.ca && MANIFEST.ca.kinds_known) ||
  ["wf","tbl","cred","cap","std","doc","task","role","fmt","prj","inv","dia","run","log","lease","kind"];

/* =========================================================
   Storage — the browser's local storage only. Older keys are read
   once to migrate forward and never deleted (I6). Earlier builds may
   have saved into Claude artifact storage; that is read as a legacy
   source only and never written.
   ========================================================= */
const KEY = (MANIFEST.storage && MANIFEST.storage.key) || "toolbench:v3";
const LEGACY_KEYS = ["toolbench:v2", "toolbench:v1"];
const SCHEMA = (MANIFEST.storage && MANIFEST.storage.schema) || 3;

const Store = (() => {
  let ls = null;
  try { if (typeof localStorage !== "undefined") { localStorage.setItem("__tb", "1"); localStorage.removeItem("__tb"); ls = localStorage; } } catch (e) { ls = null; }
  const legacy = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") ? window.storage : null;
  const mem = {};
  return {
    mode: ls ? "local" : "memory",
    async load(key) {
      try { if (ls) { const v = ls.getItem(key); return v ? JSON.parse(v) : null; } } catch (e) { /* unreadable */ }
      return mem[key] || null;
    },
    async loadLegacy(key) {          // artifact storage from earlier builds, read only
      if (!legacy) return null;
      try { const r = await legacy.get(key, false); return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; }
    },
    async save(key, value) {
      mem[key] = value;
      if (!ls) return false;
      try { ls.setItem(key, JSON.stringify(value)); return true; }
      catch (e) { toast("Couldn't save: local storage is full or blocked"); return false; }
    }
  };
})();

/* ========================= versions ========================= */
const SEMVER = /^(\d+)\.(\d+)\.(\d+)$/;
const isSemver = v => SEMVER.test(String(v || ""));
const semverCmp = (a, b) => {
  const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
  for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
  return 0;
};
const bump = (v, part = "patch") => {
  const [a, b, c] = (isSemver(v) ? v : "1.0.0").split(".").map(Number);
  return part === "major" ? `${a+1}.0.0` : part === "minor" ? `${a}.${b+1}.0` : `${a}.${b}.${c+1}`;
};

/* =========================================================
   The tool file block (toolbench.tool/1): every tool HTML carries its
   own card fields, so a file is complete on its own. The bench reads it
   on import and rewrites it on every save with the new version.
   ========================================================= */
const TOOL_FORMAT = "toolbench.tool/1";
const BLOCK_RE = /<script\b[^>]*\bid=["']toolbench-tool["'][^>]*>([\s\S]*?)<\/script>/i;

function readToolBlock(html){
  const out = { found:false, fields:{}, error:"" };
  const m = BLOCK_RE.exec(html || "");
  if (m){
    out.found = true;
    try {
      const f = JSON.parse(m[1]);
      if (!f || typeof f !== "object") throw new Error("not an object");
      if (f.format && f.format !== TOOL_FORMAT) throw new Error("format " + f.format + " isn't " + TOOL_FORMAT);
      out.fields = f;
    } catch (e) { out.error = "The tool block in this file isn't valid: " + e.message; }
  }
  // fallbacks for plain HTML files
  if (!out.fields.name){
    const t = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html || "");
    if (t && t[1].trim()) out.fields.name = t[1].trim();
  }
  if (!out.fields.description){
    const d = /<meta\s+[^>]*name=["']description["'][^>]*content=["']([^"']*)["']/i.exec(html || "");
    if (d) out.fields.description = d[1];
  }
  return out;
}
function toolFields(t){
  return {
    format: TOOL_FORMAT, id: t.id, name: t.name, description: t.description || "",
    category: t.category || "General", tags: t.tags || [], version: t.version,
    contract: normaliseContract(t.contract), sandbox: Object.assign({}, DEFAULT_SANDBOX, t.sandbox || {}),
    config: stripSecrets(t.config || {}),          // secret values never leave the device in a file
    ...(t.config_schema ? { config_schema: clone(t.config_schema) } : {})
  };
}
function writeToolBlock(html, fields){
  const json = JSON.stringify(fields, null, 2).replace(/</g, "\\u003c");
  const tag = `<script type="application/json" id="toolbench-tool">\n${json}\n</` + `script>`;
  html = html || "";
  if (BLOCK_RE.test(html)) return html.replace(BLOCK_RE, () => tag);
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + "\n" + tag);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + "<head>\n" + tag + "\n</head>");
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\">\n" + tag + "\n</head><body>\n" + html + "\n</body></html>";
}
// the source with its block brought up to date (link tools have no file)
function withBlock(t){ return t.source.kind !== "inline" ? t.source : { kind:"inline", html: writeToolBlock(t.source.html, toolFields(t)) }; }

/* ========================= state ========================= */
const DEFAULT_SANDBOX = { scripts:true, forms:true, modals:true, popups:true, downloads:true, sameOrigin:false };
const HISTORY_MAX = 20;
const blankContract = () => ({ config_keys:[], requires:[] });

let state = {
  schema: SCHEMA,
  seq: 1,
  config: { note: "Shared settings. Every tool reads these as window.TOOL_CONFIG." },
  tools: [],      // local tools (origin local)
  overlay: {},    // per-viewer state for repo tools: pinned, runs, lastRun
  errors: [],     // error log: tool and bench errors, newest last, capped (ERRORS_MAX)
  errorsSeen: 0   // ts of the newest error the viewer has seen in the Errors sheet
};
let filter = { cat: "*", q: "" };

/* =========================================================
   Errors log — tool errors (reported from inside the frame) and the
   bench's own errors, kept locally. The source of truth for bugs is the
   CA_V3 bug series: an entry can be copied out as a dev.bug.report payload.
   ========================================================= */
const ERRORS_MAX = 200;
const BUG_KEY = MANIFEST.bugs && MANIFEST.bugs.object_key
  ? MANIFEST.bugs.object_key : "std:source_repo/" + (MANIFEST.repo || "komposing/tool-bench");
const FIXED = (BUNDLE && Array.isArray(BUNDLE.fixed)) ? BUNDLE.fixed : [];
const clip = (s, n) => { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
let lastErrTs = 0;
function logError(e){
  const ts = Math.max(Date.now(), lastErrTs + 1); lastErrTs = ts;   // unique, ordered
  const entry = {
    ts, scope: e.scope === "tool" ? "tool" : "bench",
    tool: e.tool ? { id: String(e.tool.id), name: clip(e.tool.name, 80), version: String(e.tool.version || ""), origin: String(e.tool.origin || "") } : null,
    kind: clip(e.kind || "error", 20), message: clip(e.message || "Unknown error", 500),
    source: clip(e.source || "", 200), line: +e.line || 0, col: +e.col || 0, stack: clip(e.stack || "", 2000),
    host_version: MANIFEST.version
  };
  // fold an identical repeat into a count rather than flooding the log
  const last = state.errors[state.errors.length - 1];
  if (last && last.message === entry.message && last.source === entry.source && last.line === entry.line &&
      ((last.tool && last.tool.id) || "") === ((entry.tool && entry.tool.id) || "")){
    last.count = (last.count || 1) + 1; last.ts = ts;
  } else {
    state.errors.push(entry);
    if (state.errors.length > ERRORS_MAX) state.errors = state.errors.slice(-ERRORS_MAX);
  }
  persist();
  try { renderRail(); renderGrid(); } catch (x) { /* rendering itself failed; the entry is kept */ }
}
function sanitiseErrors(list){
  return (Array.isArray(list) ? list : []).filter(x => x && typeof x === "object" && x.ts && x.message).slice(-ERRORS_MAX);
}
function unseenErrors(){ return state.errors.filter(e => e.ts > (state.errorsSeen || 0)).length; }
function toolErrorCount(id){ return state.errors.filter(e => e.tool && e.tool.id === id).reduce((n, e) => n + (e.count || 1), 0); }
function bugReport(e){
  const where = e.scope === "tool" && e.tool
    ? `tool ${e.tool.id} "${e.tool.name}" v${e.tool.version} (${e.tool.origin})`
    : "the bench itself";
  const loc = e.source ? ` at ${e.source}${e.line ? ":" + e.line + (e.col ? ":" + e.col : "") : ""}` : "";
  return {
    object_key: BUG_KEY,
    class: "defect",
    title: clip(`${e.scope === "tool" && e.tool ? e.tool.name : "Tool Bench"}: ${e.message}`, 120),
    text: clip(`Tool Bench v${e.host_version}, ${where}: ${e.kind} "${e.message}"${loc}` +
               `${e.count > 1 ? `, seen ${e.count} times` : ""}, last ${new Date(e.ts).toISOString()}.` +
               (e.stack ? `\n${e.stack}` : ""), 1500),
    reproducible: e.count > 1 ? "sometimes" : "unknown",
    signature: clip(`${BUG_KEY}:${e.scope}:${e.tool ? e.tool.id : "bench"}:${e.message}`, 120)
  };
}
window.addEventListener("error", ev => {
  if (ev.target && ev.target !== window) return;   // resource load errors are not code errors
  logError({ scope:"bench", kind:"error", message: ev.message, source: ev.filename, line: ev.lineno, col: ev.colno, stack: ev.error && ev.error.stack });
});
window.addEventListener("unhandledrejection", ev => {
  const r = ev.reason;
  logError({ scope:"bench", kind:"rejection", message: (r && r.message) || String(r), stack: r && r.stack });
});
// A tool reports through the reporter injected ahead of its own scripts. Only the frame the
// bench is running may report, and only for the tool it is running.
window.addEventListener("message", ev => {
  const d = ev.data;
  if (!d || d.type !== "toolbench:error") return;
  const frame = document.getElementById("runFrame");
  if (!frame || ev.source !== frame.contentWindow) return;
  const t = findTool(document.getElementById("runner").dataset.id);
  if (!t) return;
  logError({ scope:"tool", tool:{ id:t.id, name:t.name, version:t.version, origin:t.origin },
             kind: d.kind, message: d.message, source: d.source, line: d.line, col: d.col, stack: d.stack });
});
// A running tool may save its own settings: {type:"toolbench:config:set", namespace, values}. Only the
// frame the bench is running, only for the namespace that tool declares in config_schema, and only
// values its schema names (others are dropped) with the right types. The answer goes back to that
// frame as {type:"toolbench:config:result", ok, ...}; on success the tool is re-injected and reloaded.
window.addEventListener("message", ev => {
  const d = ev.data;
  if (!d || d.type !== "toolbench:config:set") return;
  const frame = document.getElementById("runFrame");
  if (!frame || ev.source !== frame.contentWindow || !document.getElementById("runner").classList.contains("open")) return;
  const t = findTool(document.getElementById("runner").dataset.id);
  if (!t) return;
  const ns = typeof d.namespace === "string" ? d.namespace : "";
  const reply = m => { try { ev.source.postMessage(Object.assign({ type:"toolbench:config:result", namespace: ns }, m),
                                                    ev.origin && ev.origin !== "null" ? ev.origin : "*"); } catch(e){} };
  const refuse = errors => { reply({ ok:false, errors }); toast(`Settings refused for ${t.name}: ${errors[0]}${errors.length > 1 ? ` (+${errors.length - 1} more)` : ""}`); };
  if (!t.config_schema) return refuse([`${t.name} declares no settings (config_schema)`]);
  if (ns !== t.config_schema.namespace) return refuse([`${t.name} may only set its own namespace ${t.config_schema.namespace}, not ${ns || "(none)"}`]);
  if (!isObj(d.values)) return refuse(["values must be an object"]);
  const r = applySettings(t, d.values, true);
  if (r.errors.length) return refuse(r.errors);
  state.config[ns] = r.next;
  clearTimeout(saveTimer);
  Store.save(KEY, state).then(persisted => {
    reply({ ok:true, persisted, dropped: r.dropped });
    toast(persisted ? `Settings saved for ${t.name}` : `Settings saved for ${t.name} for this session only: local storage isn't available`);
    render();
    setTimeout(() => {   // let the tool see the answer, then run it again with the new settings
      if ($("#runner").classList.contains("open") && $("#runner").dataset.id === t.id) openRunner(t.id, false, { reload:true });
    }, 300);
  });
});
const REPORTER = "(function(){function s(k,m,src,l,c,st){try{parent.postMessage({type:'toolbench:error',kind:k," +
  "message:String(m||'').slice(0,500),source:String(src||'').slice(0,200),line:l||0,col:c||0," +
  "stack:String(st||'').slice(0,2000)},'*')}catch(e){}}" +
  "window.addEventListener('error',function(e){if(e.target&&e.target!==window){s('resource','Failed to load '+(e.target.src||e.target.href||e.target.tagName),'',0,0,'');return}" +
  "s('error',e.message,e.filename,e.lineno,e.colno,e.error&&e.error.stack)},true);" +
  "window.addEventListener('unhandledrejection',function(e){var r=e.reason;s('rejection',(r&&r.message)||String(r),'',0,0,r&&r.stack)});" +
  "var ce=console.error;console.error=function(){try{s('console',Array.prototype.map.call(arguments,function(a){" +
  "return a&&a.message?a.message:typeof a==='object'?JSON.stringify(a):String(a)}).join(' '),'',0,0,'')}catch(e){}" +
  "return ce.apply(console,arguments)}})();";
let editingId = null;
let srcMode = "paste";
let currentBlobUrl = null;
let migratedFrom = null;

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeJson = v => JSON.stringify(v).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
const slug = s => String(s||"tool").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "tool";
const nextId = () => "TL:" + String(state.seq++).padStart(6, "0");
const TAPES = ["#F0B429","#7BC4A8","#8FB8E0","#E39FB4","#B7A6E0","#D9C79A"];
const tapeFor = cat => {
  let h = 0; const s = cat || "general";
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return TAPES[h % TAPES.length];
};

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 2600);
}
let saveTimer = null;
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>Store.save(KEY, state), 220); }

/* ========================= tools: repo + local ========================= */
function repoTools(){
  if (!BUNDLE || !Array.isArray(BUNDLE.tools)) return [];
  return BUNDLE.tools.map(rt => {
    const o = state.overlay[rt.id] || {};
    return {
      id: rt.id, origin:"repo", readonly:true, file: rt.file,
      name: rt.name, description: rt.description || "", category: rt.category || "General", tags: rt.tags || [],
      source: rt.url ? { kind: rt.run === "fetch" ? "fetch" : "url", url: rt.url } : { kind:"inline", html: rt.html || "" },
      sandbox: Object.assign({}, DEFAULT_SANDBOX, rt.sandbox || {}),
      config: rt.config || {}, contract: Object.assign(blankContract(), rt.contract || {}),
      config_schema: rt.config_schema || null,
      version: rt.version,
      pinned: !!o.pinned, runs: o.runs || 0, lastRun: o.lastRun || null
    };
  });
}
function allTools(){ return repoTools().concat(state.tools); }
function findTool(id){ return allTools().find(t => t.id === id); }
function touchRun(t){
  if (t.origin === "repo"){
    const o = state.overlay[t.id] = state.overlay[t.id] || {};
    o.runs = (o.runs||0) + 1; o.lastRun = Date.now();
  } else {
    const lt = state.tools.find(x => x.id === t.id);
    lt.runs = (lt.runs||0) + 1; lt.lastRun = Date.now();
  }
  persist();
}
function setPinned(t, on){
  if (t.origin === "repo"){ (state.overlay[t.id] = state.overlay[t.id] || {}).pinned = on; }
  else { state.tools.find(x => x.id === t.id).pinned = on; }
  persist();
}

/* ========================= contracts ========================= */
// A contract declares what a tool needs: config keys that must be set, and the CA_V3
// objects it depends on, in the object model key grammar (prefix:id).
function mergedConfig(t){
  const cfg = Object.assign({}, state.config, t.config || {});
  if (t.config_schema) cfg[t.config_schema.namespace] = effectiveSettings(t);
  return cfg;
}
function contractCheck(t){
  const c = Object.assign(blankContract(), t.contract || {});
  const cfg = mergedConfig(t);
  const missing = (c.config_keys||[]).filter(k => cfg[k] === undefined || cfg[k] === null || cfg[k] === "");
  const requires = (c.requires||[]).map(key => {
    const m = /^([a-z][a-z_]*):(.+)$/.exec(key);
    return { key, kind: m ? m[1] : "", ok: !!(m && KNOWN_KINDS.includes(m[1])) };
  });
  const fields = t.config_schema ? settingsErrors(t.config_schema, effectiveSettings(t)) : [];
  return { missing, requires, fields, blocked: missing.length > 0 || fields.length > 0,
           badKeys: requires.filter(r => !r.ok).map(r => r.key) };
}

/* =========================================================
   Tool settings (config_schema). A tool declares its settings in its block or
   registry entry; the bench owns them: a form in Settings, checks before a run,
   storage in state.config[namespace], injection as TOOL_CONFIG[namespace], and a
   save message from the running tool. The bench never knows a setting by name.
   Secret fields stay on this device: masked in the JSON editors, stripped from
   every export, block and registry output.
   ========================================================= */
const FIELD_TYPES = ["url","string","header","secret","number","boolean","enum"];
const MASK = "••••";
const PATH_RE = /^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$/;
const NS_RE = /^[A-Za-z_][A-Za-z0-9_.-]*$/;
const BAD_SEGMENTS = ["__proto__", "prototype", "constructor"];
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function getPath(o, p){ return p.split(".").reduce((a, k) => isObj(a) && own(a, k) ? a[k] : undefined, o); }
function setPath(o, p, v){
  const ks = p.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++){ if (!isObj(a[ks[i]])) a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}
function delPath(o, p){
  const ks = p.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++){ if (!isObj(a) || !isObj(a[ks[i]])) return; a = a[ks[i]]; }
  if (isObj(a)) delete a[ks[ks.length - 1]];
}
function leafPaths(o, pre = "", out = []){
  for (const [k, v] of Object.entries(o)){ const p = pre ? pre + "." + k : k; isObj(v) ? leafPaths(v, p, out) : out.push(p); }
  return out;
}
const isSecretField = f => f.type === "secret" || f.secret === true;
const isEmptyVal = v => v === undefined || v === null || (typeof v === "string" && v.trim() === "");
function fieldValueError(f, v){
  if (typeof v === "string" && /^\s*<[^>]*>\s*$/.test(v)) return "is a placeholder";
  switch (f.type){
    case "url": return typeof v === "string" && /^https?:\/\/\S+$/i.test(v) ? "" : "must be an http(s) URL";
    case "number": return typeof v === "number" && isFinite(v) ? "" : "must be a number";
    case "boolean": return typeof v === "boolean" ? "" : "must be true or false";
    case "enum": return (f.values || []).includes(v) ? "" : "must be one of " + (f.values || []).join(", ");
    default: return typeof v === "string" ? "" : "must be text";
  }
}
// A local tool's config_schema, checked like scripts/build.mjs checks repo tools. Invalid -> none.
function normaliseConfigSchema(raw, configKeys){
  if (!isObj(raw)) return null;
  const ns = raw.namespace;
  if (typeof ns !== "string" || !NS_RE.test(ns) || !(configKeys || []).includes(ns)) return null;
  if (!Array.isArray(raw.fields) || !raw.fields.length || raw.fields.length > 50) return null;
  const fields = [], paths = [];
  for (const f of raw.fields){
    if (!isObj(f) || typeof f.path !== "string" || !PATH_RE.test(f.path) || !FIELD_TYPES.includes(f.type)) return null;
    if (f.path.split(".").some(s => BAD_SEGMENTS.includes(s))) return null;
    if (paths.some(p => p === f.path || p.startsWith(f.path + ".") || f.path.startsWith(p + "."))) return null;
    paths.push(f.path);
    const out = { path: f.path, label: String(f.label || f.path).slice(0, 80), type: f.type, required: f.required === true };
    if (f.type === "enum"){
      if (!Array.isArray(f.values) || !f.values.length) return null;
      out.values = f.values.map(String);
    }
    if (f.secret === true || f.type === "secret") out.secret = true;
    if (f.default !== undefined){
      if (out.secret || fieldValueError(out, f.default)) return null;
      out.default = f.default;
    }
    if (typeof f.help === "string" && f.help) out.help = f.help.slice(0, 300);
    fields.push(out);
  }
  return { namespace: ns, fields };
}
// Stored values for the tool's namespace, with defaults where nothing is stored.
function withDefaults(cs, stored){
  const out = isObj(stored) ? clone(stored) : {};
  for (const f of cs.fields) if (f.default !== undefined && isEmptyVal(getPath(out, f.path))) setPath(out, f.path, clone(f.default));
  return out;
}
function effectiveSettings(t){ return withDefaults(t.config_schema, state.config[t.config_schema.namespace]); }
function settingsErrors(cs, values){
  const out = [];
  for (const f of cs.fields){
    const v = getPath(values, f.path);
    if (isEmptyVal(v)){ if (f.required) out.push({ path: f.path, label: f.label, reason: "missing" }); continue; }
    const e = fieldValueError(f, v);
    if (e) out.push({ path: f.path, label: f.label, reason: e });
  }
  return out;
}
const describeErrors = list => list.map(e => `${e.label} (${e.path}) ${e.reason}`);
// Every secret field any tool declares: {ns, path}.
function secretPaths(){
  const out = [], seen = new Set();
  allTools().forEach(t => t.config_schema && t.config_schema.fields.filter(isSecretField).forEach(f => {
    const k = t.config_schema.namespace + "\u0000" + f.path;
    if (!seen.has(k)){ seen.add(k); out.push({ ns: t.config_schema.namespace, path: f.path }); }
  }));
  return out;
}
function maskSecrets(cfg){
  const c = clone(cfg || {});
  for (const s of secretPaths()) if (isObj(c[s.ns]) && !isEmptyVal(getPath(c[s.ns], s.path))) setPath(c[s.ns], s.path, MASK);
  return c;
}
function stripSecrets(cfg){
  const c = clone(cfg || {});
  for (const s of secretPaths()) if (isObj(c[s.ns])) delPath(c[s.ns], s.path);
  return c;
}
// After an edit of masked or secret-stripped JSON: a secret left masked or absent keeps the stored value.
function restoreSecrets(next, prev){
  for (const s of secretPaths()){
    const v = isObj(next[s.ns]) ? getPath(next[s.ns], s.path) : undefined;
    if (v !== undefined && v !== MASK) continue;
    const pv = isObj(prev && prev[s.ns]) ? getPath(prev[s.ns], s.path) : undefined;
    if (pv !== undefined){ if (!isObj(next[s.ns])) next[s.ns] = {}; setPath(next[s.ns], s.path, pv); }
    else if (v === MASK) delPath(next[s.ns], s.path);
  }
  return next;
}
// Values from a form or a tool, checked against the schema and merged over what's stored
// (keys the schema doesn't name are kept). requireAll: the result must satisfy required fields.
function applySettings(t, values, requireAll){
  const cs = t.config_schema, errors = [];
  const next = isObj(state.config[cs.namespace]) ? clone(state.config[cs.namespace]) : {};
  const known = new Set(cs.fields.map(f => f.path));
  for (const f of cs.fields){
    const v = own(values, f.path) ? values[f.path] : getPath(values, f.path);
    if (v === undefined) continue;
    if (isEmptyVal(v)){ delPath(next, f.path); continue; }
    const e = fieldValueError(f, v);
    if (e) errors.push(`${f.label} (${f.path}) ${e}`); else setPath(next, f.path, v);
  }
  const dropped = leafPaths(values).filter(p => !known.has(p));
  const missing = settingsErrors(cs, withDefaults(cs, next)).filter(e => e.reason === "missing");
  if (requireAll) errors.push(...describeErrors(missing));
  return { errors, next, dropped, missing };
}
function normaliseContract(raw){
  const c = Object.assign(blankContract(), raw || {});
  const list = v => Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : [];
  return { config_keys: list(c.config_keys), requires: list(c.requires) };
}

/* ========================= validation and shape ========================= */
function validateLocalTool(t, i){
  const where = `Tool ${i+1}${t && t.name ? " (" + t.name + ")" : ""}`;
  if (!t || typeof t !== "object") throw new Error(`${where} is not an object`);
  if (!t.name || typeof t.name !== "string") throw new Error(`${where} needs a name`);
  if (!t.source || typeof t.source !== "object") throw new Error(`${where} needs a source`);
  if (t.source.kind === "url" || t.source.kind === "fetch"){
    if (!/^https?:\/\//i.test(t.source.url || "")) throw new Error(`${where} has a link that isn't http(s)`);
  } else if (typeof t.source.html !== "string" || !t.source.html.trim()){
    throw new Error(`${where} has no HTML`);
  }
  if (t.version !== undefined && !isSemver(t.version)) throw new Error(`${where} has version ${t.version}, expected x.y.z`);
}
// v2 kept a save counter (v = 1, 2, 3...); schema 3 uses semver: save n becomes 1.0.(n-1)
const counterToSemver = n => `1.0.${Math.max(0, (+n || 1) - 1)}`;
function sanitiseLocalTool(t){
  const version = isSemver(t.version) ? t.version : counterToSemver(t.v);
  const hist = Array.isArray(t.history) ? t.history.slice(-HISTORY_MAX).map(h => Object.assign({}, h, {
    version: isSemver(h.version) ? h.version : counterToSemver(h.v) })) : [];
  hist.forEach(h => delete h.v);
  return {
    id: t.id, origin:"local", name: String(t.name), description: String(t.description||""),
    category: String(t.category||"General"), tags: Array.isArray(t.tags) ? t.tags.map(String) : [],
    source: (t.source.kind === "url" || t.source.kind === "fetch") ? { kind: t.source.kind, url: String(t.source.url) } : { kind:"inline", html: String(t.source.html) },
    sandbox: Object.assign({}, DEFAULT_SANDBOX, t.sandbox || {}),
    config: (t.config && typeof t.config === "object" && !Array.isArray(t.config)) ? t.config : {},
    contract: normaliseContract(t.contract),
    config_schema: normaliseConfigSchema(t.config_schema, normaliseContract(t.contract).config_keys),
    pinned: !!t.pinned, runs: +t.runs || 0, lastRun: t.lastRun || null,
    version, history: hist,
    createdAt: t.createdAt || Date.now(), updatedAt: t.updatedAt || Date.now(),
    forkedFrom: t.forkedFrom || undefined
  };
}
function reseq(){
  state.seq = Math.max(1, state.seq|0, ...state.tools.map(t => (parseInt(String(t.id).split(":")[1],10)||0)+1));
}

/* ========================= migration ========================= */
// v1 -> v3: tools become origin local with a contract, history and semver; the v1 seed
// "Config probe" is dropped because the repo ships it.
function migrateV1(v1){
  const tools = (v1.tools||[]).filter(t => !(t.name === "Config probe" && (t.category === "Bench") && (t.tags||[]).includes("diagnostic")));
  return { schema: 3, seq: v1.seq || 1, config: v1.config || {}, overlay: {}, tools: tools.map(sanitiseLocalTool) };
}
// v2 -> v3: save counters become semver; everything else carries over.
function migrateV2(v2){
  return { schema: 3, seq: v2.seq || 1, config: v2.config || {}, overlay: v2.overlay || {}, tools: (v2.tools||[]).map(sanitiseLocalTool) };
}
const MIGRATE = { "toolbench:v2": migrateV2, "toolbench:v1": migrateV1 };

/* ========================= render ========================= */
function categories(){
  const m = new Map();
  allTools().forEach(t => { const c = t.category || "General"; m.set(c, (m.get(c)||0)+1); });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}
function matches(t){
  const q = filter.q.trim().toLowerCase();
  if (filter.cat !== "*" && (t.category || "General") !== filter.cat) return false;
  if (!q) return true;
  const c = t.contract || {};
  return [t.name, t.description, t.id, t.category, t.origin, t.version, (t.tags||[]).join(" "),
          (c.requires||[]).join(" "), (c.config_keys||[]).join(" ")]
    .join(" ").toLowerCase().includes(q);
}

function renderRail(){

function renderBrand(){
  const b = $("#verLabel");
  b.textContent = BUNDLE ? "v" + MANIFEST.version : "unbuilt source";
  b.classList.toggle("unbuilt", !BUNDLE);
}
function render(){ renderBrand(); renderRail(); renderGrid(); }

/* ========================= running a tool ========================= */
function sandboxAttr(sb){
  const out = [];
  if (sb.scripts) out.push("allow-scripts");
  if (sb.forms) out.push("allow-forms");
  if (sb.modals) out.push("allow-modals");
  if (sb.popups) out.push("allow-popups", "allow-popups-to-escape-sandbox");
  if (sb.downloads) out.push("allow-downloads");
  if (sb.sameOrigin) out.push("allow-same-origin");
  return out.join(" ");
}
function toolMeta(t){
  return { id: t.id, name: t.name, category: t.category || "General", origin: t.origin, version: t.version,
           host: "tool-bench", host_version: MANIFEST.version, contract: t.contract || blankContract() };
}
function injectConfig(html, t, opts){
  const reporter = (opts && opts.reporter === false) ? "" : REPORTER;
  const tag = "<scr" + "ipt>" + reporter + "window.TOOL_CONFIG=" + safeJson(mergedConfig(t)) +
              ";window.TOOL_META=" + safeJson(toolMeta(t)) + ";</scr" + "ipt>";
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + tag);
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + "<head>" + tag + "</head>");
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\">" + tag + "</head><body>" + html + "</body></html>";
}

/* Fetched tools (registry run "fetch"): the url is read with fetch() (no credentials), its
   X-CA-SHA256 header, when sent, is checked against the body, and the html runs inline like a
   file tool (same sandbox, injection and reporter). The html is kept in memory for this page
   only, never in localStorage. */
const FETCHED = new Map();   // url -> { html, sha256, verified, version }
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
async function fetchTool(t, fresh){
  const url = t.source.url;
  if (!fresh && FETCHED.has(url)) return FETCHED.get(url);
  let res;
  try { res = await fetch(url, { credentials:"omit", cache:"no-store", redirect:"follow" }); }
  catch(e){ throw Object.assign(new Error("Could not fetch the tool (network error or CORS refused): " + (e.message || e)), { status: 0 }); }
  if (!res.ok) throw Object.assign(new Error(`The host answered HTTP ${res.status}${res.statusText ? " " + res.statusText : ""}`), { status: res.status });
  const buf = await res.arrayBuffer();
  const want = (res.headers.get("X-CA-SHA256") || "").trim().toLowerCase();
  let got = "";
  if (want){
    if (!(window.crypto && crypto.subtle)) throw Object.assign(new Error("The host sent X-CA-SHA256 but this page can't hash (no crypto.subtle; open the bench over https or file)"), { status: res.status });
    got = hex(await crypto.subtle.digest("SHA-256", buf));
    if (got !== want) throw Object.assign(new Error(`Hash mismatch: X-CA-SHA256 ${want}, body ${got}`), { status: res.status, mismatch: true });
  }
  const entry = { html: new TextDecoder("utf-8").decode(buf), sha256: got || want, verified: !!want,
                  version: res.headers.get("X-CA-Version") || "", bytes: buf.byteLength };
  FETCHED.set(url, entry);
  return entry;
}
let runToken = 0;
async function runFetched(t, frame, token, fresh){
  frame.srcdoc = `<!DOCTYPE html><meta charset="utf-8"><body style="font:13px ui-monospace,Menlo,monospace;padding:20px;color:#6b6a64">Fetching ${esc(t.source.url)}…</body>`;
  try {
    const f = await fetchTool(t, fresh);
    if (token !== runToken) return;   // another run started meanwhile
    $("#runSandbox").textContent = (t.sandbox && t.sandbox.sameOrigin ? "trusted · full access" : "sandboxed") +
      (f.verified ? " · sha256 ok" : " · unverified (no X-CA-SHA256)") + (f.version ? " · host v" + f.version : "");
    frame.dataset.sha256 = f.sha256 || "";
    frame.srcdoc = injectConfig(f.html, t);
  } catch(e){
    if (token !== runToken) return;
    logError({ scope:"bench", kind: e.mismatch ? "integrity" : "fetch",
               message: `${t.id} v${t.version}: ${e.message}`, source: t.source.url });
    closeRunner();
    fetchErrorSheet(t, e);
  }
}
function fetchErrorSheet(t, e){
  openSheet(`<div class="sheet">
    <div class="sheethead"><h2>${e.mismatch ? "Refused: hash mismatch" : "Couldn't fetch the tool"}</h2><span class="sub">${esc(t.id)}</span>
      <button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheetbody">
      <table class="t"><tbody>
        <tr><td>Tool</td><td>${esc(t.name)} · v${esc(t.version)}</td></tr>
        <tr><td>URL</td><td><code>${esc(t.source.url)}</code></td></tr>
        <tr><td>Status</td><td class="no">${e.status ? "HTTP " + esc(e.status) : "no response (network or CORS)"}</td></tr>
        <tr><td>Detail</td><td>${esc(e.message)}</td></tr>
      </tbody></table>
      <div class="note">${e.mismatch ? "The body doesn't match the hash the host sent, so the bench won't run it." : "The bench fetches this tool without credentials; the host must answer 200 with CORS allowing this page."} It's in Errors and fixes.</div>
    </div>
    <div class="sheetfoot"><div class="spacer"></div><button class="btn primary" data-act="close">Close</button></div></div>`);
}

function openRunner(id, fresh, opts){
  const t = findTool(id); if (!t) return;
  const chk = contractCheck(t);
  if (chk.blocked){ closeRunner(); blockedSheet(t, chk); return; }   // fail closed (I4)
  if (!(opts && opts.reload)){ touchRun(t); renderGrid(); }

  const frame = $("#runFrame");
  frame.setAttribute("sandbox", sandboxAttr(t.sandbox || DEFAULT_SANDBOX));
  frame.removeAttribute("src"); frame.removeAttribute("srcdoc");
  const token = ++runToken;

  if (t.source.kind === "fetch"){
    frame.onload = null;
    runFetched(t, frame, token, fresh);
  } else if (t.source.kind === "url"){
    let origin = "*";
    try { origin = new URL(t.source.url).origin; } catch(e){}
    frame.src = t.source.url;
    frame.onload = () => {
      try { frame.contentWindow.postMessage(
        { type:"toolbench:config", config: mergedConfig(t), meta: toolMeta(t) }, origin); } catch(e){}
    };
  } else {
    frame.srcdoc = injectConfig(t.source.html || "", t);
    frame.onload = null;
  }

  $("#runId").textContent = t.id;

function standaloneUrl(t){
  if (t.source.kind === "url") return t.source.url;
  if (t.source.kind === "fetch"){
    const f = FETCHED.get(t.source.url);
    if (!f) return t.source.url;   // not fetched yet this session
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(new Blob([injectConfig(f.html, t)], { type:"text/html" }));
    return currentBlobUrl;
  }
  if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  currentBlobUrl = URL.createObjectURL(new Blob([injectConfig(withBlock(t).html, t)], { type:"text/html" }));
  return currentBlobUrl;
}

// Fill the open sheet from the block in a pasted or uploaded file.
function fillSheetFromHtml(html){
  const r = readToolBlock(html);
  const note = $("#fRead");
  if (r.error){ note.hidden = false; note.textContent = r.error + " Fields left as they were."; return; }
  if (!r.found && !r.fields.name){ note.hidden = true; return; }
  const f = r.fields;
  if (f.name) $("#fName").value = f.name;
  if (f.description !== undefined) $("#fDesc").value = f.description;
  if (f.category) $("#fCat").value = f.category;
  if (Array.isArray(f.tags)) $("#fTags").value = f.tags.join(", ");
  if (f.contract){
    const c = normaliseContract(f.contract);
    $("#fNeeds").value = c.config_keys.join(", "); $("#fReq").value = c.requires.join(", ");
  }
  if (f.config && typeof f.config === "object") $("#fConfig").value = JSON.stringify(f.config, null, 2);
  if (f.sandbox) document.querySelectorAll("[data-sb]").forEach(el => { if (el.dataset.sb in f.sandbox) el.checked = !!f.sandbox[el.dataset.sb]; });
  let msg = r.found ? "Read the fields from the file's tool block" : "No tool block in this file; took the name from its title";
  if (isSemver(f.version)){
    if (!sheetBase || semverCmp(f.version, sheetBase) > 0){ $("#fVer").value = f.version; msg += `, version ${f.version}`; }
    else msg += `. The file says v${f.version}, which isn't above the current v${sheetBase}, so saving makes v${$("#fVer").value}`;
  }
  note.hidden = false; note.textContent = msg + ".";
  syncSaveLabel();
}

function settingsField(t, f){
  const stored = getPath(isObj(state.config[t.config_schema.namespace]) ? state.config[t.config_schema.namespace] : {}, f.path);
  const v = !isEmptyVal(stored) ? stored : f.default !== undefined ? f.default : "";
  const attrs = `data-path="${esc(f.path)}" data-type="${esc(f.type)}"`;
  const label = `${esc(f.label)}${f.required ? " · required" : ""}`;
  let input;
  if (f.type === "boolean"){
    return `<label class="chk"><input type="checkbox" ${attrs} ${v === true ? "checked" : ""}><span>${label}</span></label>
      ${f.help ? `<p class="hint">${esc(f.help)}</p>` : ""}`;
  } else if (f.type === "enum"){
    input = `<select class="in" ${attrs}>${f.required ? "" : `<option value=""${v === "" ? " selected" : ""}>(not set)</option>`}
      ${f.values.map(x => `<option value="${esc(x)}"${x === v ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>`;
  } else if (isSecretField(f)){
    input = `<span style="display:flex;gap:6px;text-transform:none;letter-spacing:0">
      <input class="in" type="password" autocomplete="off" spellcheck="false" ${attrs} value="${esc(v)}" style="font-family:var(--mono)">
      <button class="btn" type="button" data-act="toggleSecret">Show</button></span>`;
  } else {
    input = `<input class="in" type="${f.type === "number" ? "number" : "text"}" spellcheck="false" ${attrs} value="${esc(v)}"
      placeholder="${esc(f.type === "url" ? "https://…" : "")}" ${f.type === "url" || f.type === "header" ? 'style="font-family:var(--mono);font-size:12px"' : ""}>`;
  }
  return `<label class="f"><span>${label}</span>${input}</label>${f.help ? `<p class="hint" style="margin-top:-8px">${esc(f.help)}</p>` : ""}`;
}

// Read one tool's form, check it against its schema and store it under its namespace.
function saveToolSettings(id){
  const t = findTool(id); if (!t || !t.config_schema) return;
  const sec = document.querySelector(`.cfgsec[data-tool="${CSS.escape(id)}"]`); if (!sec) return;
  const values = {};
  sec.querySelectorAll("[data-path]").forEach(el => {
    const ty = el.dataset.type;
    let v = ty === "boolean" ? el.checked : el.value.trim();
    if (ty === "number" && v !== "") v = Number(v);
    values[el.dataset.path] = v;
  });
  const r = applySettings(t, values, false);
  if (r.errors.length){ sec.querySelector("[data-err]").textContent = "Not saved: " + r.errors.join("; "); return; }
  state.config[t.config_schema.namespace] = r.next;
  persist(); render(); settingsSheet(id);
  toast(`Settings saved for ${t.name}` + (r.missing.length ? ` · still needs ${r.missing.map(m => m.label).join(", ")}` : ""));
}

    <td><button class="btn" data-act="restore" data-ver="${esc(h.version)}">Restore</button></td></tr>`).join("");
  openSheet(`<div class="sheet wide">
    <div class="sheethead"><h2>History</h2><span class="sub">${esc(t.id)} · now v${esc(t.version)}</span>
      <button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheetbody">
      <p class="hint">Every save keeps the version before it (last ${HISTORY_MAX}). Restoring makes a new version (v${esc(bump(t.version))}) from the old one, so nothing is lost.</p>
      <table class="t"><thead><tr><th>Version</th><th>Saved</th><th>Name</th><th>Source</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5">No earlier versions yet.</td></tr>`}</tbody></table>
    </div>
    <div class="sheetfoot"><div class="spacer"></div><button class="btn primary" data-act="close">Done</button></div></div>`);
  editingId = t.id;
}

/* ========================= tool CRUD ========================= */
function snapshot(t){
  return { version: t.version, savedAt: t.updatedAt || Date.now(), name: t.name, description: t.description,
           category: t.category, tags: (t.tags||[]).slice(), source: JSON.parse(JSON.stringify(t.source)),
           sandbox: Object.assign({}, t.sandbox), config: JSON.parse(JSON.stringify(t.config||{})),
           contract: normaliseContract(t.contract), config_schema: clone(t.config_schema || null) };
}
// Every change to a local tool is a new version: the old one goes to history and the
// file's block is rewritten with the new fields and version.
function newVersion(t, data, version){
  t.history = (t.history||[]).concat([snapshot(t)]).slice(-HISTORY_MAX);
  Object.assign(t, data, { version, updatedAt: Date.now() });
  t.source = withBlock(t);
}

function readSheetIntoTool(){
  const err = $("#fErr");
  const name = $("#fName").value.trim();
  if (!name){ err.textContent = "Give the tool a name."; return null; }

  const version = $("#fVer").value.trim();
  if (!isSemver(version)){ err.textContent = "Version must look like 1.2.3."; return null; }
  if (sheetBase && semverCmp(version, sheetBase) <= 0){ err.textContent = `Version must be above the current v${sheetBase}.`; return null; }

  let cfg = {};
  try { const raw = $("#fConfig").value.trim(); cfg = raw ? JSON.parse(raw) : {}; }
  catch(e){ err.textContent = "Tool settings aren't valid JSON: " + e.message; return null; }
  if (!cfg || typeof cfg !== "object" || Array.isArray(cfg)){ err.textContent = "Tool settings must be a JSON object."; return null; }

  const was = editingId && state.tools.find(x => x.id === editingId);
  const source = { kind: srcMode === "url" ? (was && was.source.kind === "fetch" ? "fetch" : "url") : "inline" };
  if (source.kind === "url"){
    source.url = $("#fUrl").value.trim();
    if (!/^https?:\/\//i.test(source.url)){ err.textContent = "Enter a full URL starting with http:// or https://"; return null; }
  } else {
    source.html = $("#fHtml").value;
    if (!source.html.trim()){ err.textContent = "Paste the tool's HTML, or upload the file."; return null; }
  }

  const split = s => s.split(",").map(x=>x.trim()).filter(Boolean);
  const contract = { config_keys: split($("#fNeeds").value), requires: split($("#fReq").value) };
  const bad = contract.requires.filter(k => !/^[a-z][a-z_]*:.+$/.test(k));
  if (bad.length){ err.textContent = "Dependencies must look like prefix:id (for example cap:ebay.market.search): " + bad.join(", "); return null; }

  const sandbox = {};
  document.querySelectorAll("[data-sb]").forEach(el => sandbox[el.dataset.sb] = el.checked);

  // settings declared in a pasted file's block win; otherwise the tool keeps what it declared
  const blk = source.kind === "inline" ? readToolBlock(source.html).fields : {};
  const csRaw = blk.config_schema || (was && was.config_schema) || null;
  const config_schema = normaliseConfigSchema(csRaw, contract.config_keys);
  if (csRaw && !config_schema){ err.textContent = "The tool's config_schema isn't valid (its namespace must be in Needs settings; paths unique; enum values; defaults match the type; no secret defaults)."; return null; }

  return {
    version,
    data: { name, description: $("#fDesc").value.trim(), category: $("#fCat").value.trim() || "General",
            tags: split($("#fTags").value), source, sandbox, config: cfg, contract, config_schema }
  };
}

function saveTool(){
  const r = readSheetIntoTool(); if (!r) return;
  if (editingId){
    const t = state.tools.find(x => x.id === editingId);
    newVersion(t, r.data, r.version);
    toast(`Saved ${t.id} as v${t.version}`);
  } else {
    const t = sanitiseLocalTool(Object.assign({ id: nextId(), version: r.version, history:[] }, r.data));
    t.source = withBlock(t);
    state.tools.push(t);
    toast(`Added ${t.id} v${t.version}`);
  }
  persist(); render(); closeSheet();
}

function forkTool(t){
  const c = sanitiseLocalTool({
    id: nextId(), name: t.name + " (local)", description: t.description, category: t.category, tags: t.tags,
    source: JSON.parse(JSON.stringify(t.source)), sandbox: t.sandbox, config: t.config, contract: t.contract,
    config_schema: t.config_schema, version: "1.0.0", history:[], forkedFrom: t.id + "@" + t.version
  });
  c.source = withBlock(c);
  state.tools.push(c); persist(); render(); toast(`Forked ${t.id} v${t.version} as ${c.id}`);
  return c;
}

// A dropped file is complete on its own: its block names the tool. A block whose id is one
// of your local tools updates that tool when its version is higher; otherwise it's a new tool.
function addFromFile(file, text){
  const r = readToolBlock(text);
  if (r.error) return { skipped: `${file.name}: ${r.error}` };
  const f = r.fields;
  const name = f.name || file.name.replace(/\.html?$/i, "").replace(/[-_]+/g," ");
  const data = {
    name, description: f.description || "", category: f.category || (filter.cat === "*" ? "General" : filter.cat),
    tags: Array.isArray(f.tags) ? f.tags.map(String) : [],
    sandbox: Object.assign({}, DEFAULT_SANDBOX, f.sandbox || {}),
    config: (f.config && typeof f.config === "object" && !Array.isArray(f.config)) ? f.config : {},
    contract: normaliseContract(f.contract), source: { kind:"inline", html: text },
    config_schema: normaliseConfigSchema(f.config_schema, normaliseContract(f.contract).config_keys)
  };
  const version = isSemver(f.version) ? f.version : "1.0.0";
  const existing = f.id && state.tools.find(t => t.id === f.id);
  if (existing){
    if (semverCmp(version, existing.version) <= 0)
      return { skipped: `${existing.name}: the file is v${version}, not above v${existing.version}` };
    newVersion(existing, data, version);
    return { updated: `${existing.id} to v${version}` };
  }
  const keepId = /^TL:\d+$/.test(f.id || "") && !findTool(f.id);
  const t = sanitiseLocalTool(Object.assign({ id: keepId ? f.id : nextId(), version, history:[] }, data));
  t.source = withBlock(t);
  state.tools.push(t);
  if (keepId) reseq();
  return { added: `${t.id} v${version}` };
}

function downloadFile(name, content, type){
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// The local bundle export: secret values stripped from the settings, every tool and its history.
function exportBundle(){
  return { schema: state.schema, host_version: MANIFEST.version, config: stripSecrets(state.config),
           tools: state.tools.map(t => Object.assign({}, t, { config: stripSecrets(t.config), source: withBlock(t),
             history: (t.history || []).map(h => Object.assign({}, h, { config: stripSecrets(h.config) })) })) };
}

// Promote a local tool: the file (block rewritten with a repo id) goes to tools/<slug>.html
// and the registry gets one line {"file": ...}; then a change lands it (see CLAUDE.md).
function exportForRepo(t){
  const s = slug(t.name);
  if (t.source.kind === "url" || t.source.kind === "fetch"){
    const entry = Object.assign(toolFields(Object.assign({}, t, { id: "TB:" + s })), { url: t.source.url },
                                t.source.kind === "fetch" ? { run: "fetch" } : {});
    downloadFile(`${s}.registry-entry.json`, JSON.stringify(entry, null, 2), "application/json");
  } else {
    const html = writeToolBlock(t.source.html, toolFields(Object.assign({}, t, { id: "TB:" + s })));
    downloadFile(`${s}.html`, html, "text/html");
    downloadFile(`${s}.registry-entry.json`, JSON.stringify({ file: `tools/${s}.html` }, null, 2), "application/json");
  }
  toast("Downloaded the file and its registry line for the repo");
}

/* ========================= events ========================= */
$("#rail").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.cat){ filter.cat = b.dataset.cat; render(); return; }
  const act = b.dataset.act;
  if (act === "deps") depsSheet();
  if (act === "errors") errorsSheet();
  if (act === "registry") registrySheet();
  if (act === "export") downloadFile(`tool-bench-local-${new Date().toISOString().slice(0,10)}.json`,
      JSON.stringify(exportBundle(), null, 2), "application/json");
  if (act === "import") $("#importer").click();
});

$("#grid").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "add"){ toolSheet(null); return; }
  const card = b.closest(".tool"); if (!card) return;
  const t = findTool(card.dataset.id); if (!t) return;
  const act = b.dataset.act;
  if (act === "run") openRunner(t.id);
  if (act === "pin"){ setPinned(t, !t.pinned); renderGrid(); }
  if (act === "menu") openMenu(b, t);
});

function openMenu(anchor, t){
  const m = $("#menu");
  const local = t.origin === "local";
  m.innerHTML = local ? `
    <button data-m="edit">Edit</button>
    <button data-m="hist">History (v${esc(t.version)})</button>
    <button data-m="pop">Open standalone</button>
    <button data-m="dl">Download .html (v${esc(t.version)})</button>
    <button data-m="dup">Duplicate</button>
    <button data-m="promote">Export for repo</button>
    <hr><button data-m="rm" class="rm">Delete</button>` : `
    <button data-m="fork">Fork to local copy</button>
    <button data-m="pop">Open standalone</button>
    <button data-m="dl">Download .html (v${esc(t.version)})</button>
    <hr><button data-m="info" disabled style="opacity:.6;cursor:default">Repo tool · ${esc(t.file || "")}</button>`;
  const r = anchor.getBoundingClientRect();
  m.classList.add("open");
  m.style.left = Math.min(r.left, window.innerWidth - 216) + "px";
  m.style.top = Math.min(r.bottom + 6, window.innerHeight - m.offsetHeight - 10) + "px";
  m.onclick = ev => {
    const b = ev.target.closest("button"); if (!b || b.disabled) return;
    const k = b.dataset.m; m.classList.remove("open");
    if (k === "edit") toolSheet(state.tools.find(x => x.id === t.id));
    if (k === "hist") historySheet(state.tools.find(x => x.id === t.id));
    if (k === "fork") toolSheet(forkTool(t));
    if (k === "promote") exportForRepo(t);
    if (k === "pop") window.open(standaloneUrl(t), "_blank", "noopener");
    if (k === "dl") downloadFile(`${slug(t.name)}-${t.version}.html`,
        t.source.kind === "fetch" && FETCHED.has(t.source.url) ? FETCHED.get(t.source.url).html
        : t.source.kind !== "inline"
          ? `<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=${esc(t.source.url)}"><a href="${esc(t.source.url)}">${esc(t.source.url)}</a>`
          : withBlock(t).html, "text/html");
    if (k === "dup"){
      const c = sanitiseLocalTool(Object.assign(JSON.parse(JSON.stringify(t)), {
        id: nextId(), name: t.name + " copy", runs: 0, pinned: false, version: "1.0.0", history: [],
        createdAt: Date.now(), updatedAt: Date.now() }));
      c.source = withBlock(c);
      state.tools.push(c); persist(); render(); toast("Duplicated as " + c.id);
    }
    if (k === "rm"){
      if (confirm(`Delete ${t.name}? Its stored copy and history go with it.`)){
        state.tools = state.tools.filter(x => x.id !== t.id); persist(); render(); toast("Deleted " + t.id);
      }
    }
  };
}
document.addEventListener("click", e => {
  if (!e.target.closest("#menu") && !e.target.closest('[data-act="menu"]')) $("#menu").classList.remove("open");
});

$("#scrim").addEventListener("click", e => {
  if (e.target === $("#scrim")) return closeSheet();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.bump){ $("#fVer").value = bump(sheetBase, b.dataset.bump); syncSaveLabel(); return; }
  const act = b.dataset.act;
  if (act === "close") return closeSheet();
  if (act === "save") return saveTool();
  if (act === "openSettings"){ const id = b.dataset.id; closeSheet(); return settingsSheet(id); }
  if (act === "copyBug"){
    const e = state.errors.find(x => String(x.ts) === b.dataset.ts);
    if (e) copyText(JSON.stringify(bugReport(e), null, 2), "Bug report copied", "tool-bench-bug.json");
    return;
  }
  if (act === "exportErrors"){
    downloadFile(`tool-bench-errors-${new Date().toISOString().slice(0,10)}.json`,
      JSON.stringify({ host: MANIFEST.repo, host_version: MANIFEST.version, object_key: BUG_KEY, errors: state.errors }, null, 2), "application/json");
    return;
  }
  if (act === "clearErrors"){
    if (confirm(`Clear ${state.errors.length} logged error${state.errors.length===1?"":"s"}? Copy or export anything you want to report first.`)){
      state.errors = []; state.errorsSeen = 0; persist(); render(); closeSheet(); toast("Error log cleared");
    }
    return;
  }
  if (act === "editTool"){ const t = state.tools.find(x => x.id === b.dataset.id); closeSheet(); return toolSheet(t); }
  if (act === "copyDeps"){
    const txt = JSON.stringify(depsMap(), null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(()=>toast("Dependency map copied"), ()=>downloadFile("tool-bench-deps.json", txt, "application/json"));
    return;
  }
  if (act === "restore"){
    const t = state.tools.find(x => x.id === editingId);
    const h = t && (t.history||[]).find(x => x.version === b.dataset.ver);
    if (!h) return;
    newVersion(t, { name:h.name, description:h.description, category:h.category, tags:h.tags,
                    source:h.source, sandbox:h.sandbox, config:h.config, contract:h.contract,
                    config_schema: normaliseConfigSchema(h.config_schema, normaliseContract(h.contract).config_keys) }, bump(t.version));
    persist(); render(); closeSheet(); toast(`Restored v${h.version} as v${t.version}`);
    return;
  }
  if (act === "delete"){
    const t = state.tools.find(x => x.id === editingId);
    if (t && confirm(`Delete ${t.name}? Its history goes with it.`)){
      state.tools = state.tools.filter(x => x.id !== t.id); persist(); render(); closeSheet(); toast("Deleted " + t.id);
    }
    return;
  }
  if (act === "toggleSecret"){
    const inp = b.parentElement.querySelector("input");
    const show = inp.type === "password"; inp.type = show ? "text" : "password"; b.textContent = show ? "Hide" : "Show";
    return;
  }
  if (act === "saveToolConfig") return saveToolSettings(b.dataset.id);
  if (act === "saveConfig"){
    try {
      const next = JSON.parse($("#gConfig").value || "{}");
      if (!next || typeof next !== "object" || Array.isArray(next)) throw new Error("settings must be a JSON object");
      state.config = restoreSecrets(next, state.config); persist(); render(); closeSheet(); toast("Settings saved");
    } catch(err){ $("#gErr").textContent = "Not valid: " + err.message; }
    return;
  }
  if (act === "applyRegistry"){
    try {
      const next = JSON.parse($("#rJson").value);
      if (!Array.isArray(next.tools)) throw new Error("Registry needs a tools array");
      const ids = new Set();
      next.tools.forEach((t,i) => {
        validateLocalTool(t, i);
        if (!t.id || !/^TL:\d+$/.test(t.id)) throw new Error(`Tool ${i+1} needs an id like TL:000001`);
        if (ids.has(t.id)) throw new Error(`Duplicate id ${t.id}`);
        ids.add(t.id);
      });
      next.tools.forEach(t => {
        const prev = state.tools.find(x => x.id === t.id);
        if (isObj(t.config) || prev) t.config = restoreSecrets(isObj(t.config) ? t.config : {}, prev ? prev.config : {});
      });
      state = {
        schema: SCHEMA, seq: next.seq|0, config: restoreSecrets(isObj(next.config) ? next.config : {}, state.config),
        overlay: (next.overlay && typeof next.overlay === "object") ? next.overlay : {},
        errors: state.errors, errorsSeen: state.errorsSeen,   // the error log is not part of the editable registry
        tools: next.tools.map(sanitiseLocalTool)
      };
      reseq(); persist(); render(); closeSheet(); toast("Registry applied");
    } catch(err){ $("#rErr").textContent = err.message; }
    return;
  }
  if (b.dataset.src){
    srcMode = b.dataset.src;
    document.querySelectorAll("#srcTabs button").forEach(x => x.classList.toggle("on", x.dataset.src === srcMode));
    $("#srcPaste").hidden = srcMode !== "paste";
    $("#srcFile").hidden = srcMode !== "file";
    $("#srcUrl").hidden = srcMode !== "url";
  }
});

$("#scrim").addEventListener("input", e => { if (e.target.id === "fVer") syncSaveLabel(); });
$("#scrim").addEventListener("change", e => {
  if (e.target.id === "fHtml"){ fillSheetFromHtml(e.target.value); return; }
  if (e.target.id !== "fFile") return;
  const f = e.target.files[0]; if (!f) return;

    $("#srcPaste").hidden = false; $("#srcFile").hidden = true;
    fillSheetFromHtml(String(r.result));
    if (!$("#fName").value.trim()) $("#fName").value = f.name.replace(/\.html?$/i,"");
    toast("Loaded " + f.name);
  };
  r.readAsText(f);
});

$("#btnAdd").onclick = () => toolSheet(null);

$("#verLabel").onclick = depsSheet;
$("#q").addEventListener("input", e => { filter.q = e.target.value; renderGrid(); });

$("#runClose").onclick = closeRunner;

$("#runPop").onclick = () => {

document.addEventListener("keydown", e => {
  if (e.key === "/" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){
    e.preventDefault(); $("#q").focus(); return;
  }
  if (e.key === "Escape"){

  }
});

/* drag and drop .html anywhere */
const bench = $("#bench");
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => {
  if (![...(e.dataTransfer?.types||[])].includes("Files")) return;
  e.preventDefault(); bench.classList.add("drop");
}));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
  if (ev === "dragleave" && e.relatedTarget) return;
  bench.classList.remove("drop");
}));
async function addFiles(files){
  const out = { added:[], updated:[], skipped:[] };
  for (const f of files){
    if (!/\.html?$/i.test(f.name) && f.type !== "text/html"){ out.skipped.push(`${f.name}: not an .html file`); continue; }
    const r = addFromFile(f, await f.text());
    for (const k of Object.keys(out)) if (r[k]) out[k].push(r[k]);
  }
  if (out.added.length || out.updated.length){ persist(); render(); }
  const parts = [];
  if (out.added.length) parts.push(`added ${out.added.join(", ")}`);
  if (out.updated.length) parts.push(`updated ${out.updated.join(", ")}`);
  if (out.skipped.length) parts.push(`skipped ${out.skipped.join("; ")}`);
  toast(parts.join(" · ") || "Nothing to add");
  return out;
}
document.addEventListener("drop", e => {
  const files = [...(e.dataTransfer?.files||[])]; if (!files.length) return;
  e.preventDefault(); addFiles(files);
});

/* importer for exported bundles: every imported tool is validated first, then
   gets a fresh local id, so an import can never overwrite or collide. */
const importer = document.createElement("input");
importer.type = "file"; importer.accept = "application/json,.json"; importer.id = "importer"; importer.hidden = true;
importer.onchange = async () => {
  const f = importer.files[0]; if (!f) return;
  try {
    let next = JSON.parse(await f.text());
    if (next && next.version === 1 && !next.schema) next = migrateV1(next);   // a v1 export
    if (!next || !Array.isArray(next.tools)) throw new Error("no tools array");
    next.tools.forEach(validateLocalTool);
    next.tools.forEach(t => {
      const c = sanitiseLocalTool(Object.assign({}, t, { id: nextId() }));
      c.source = withBlock(c);
      state.tools.push(c);
    });
    reseq(); persist(); render(); toast(`Imported ${next.tools.length} tool${next.tools.length===1?"":"s"}`);
  } catch(err){ toast("Not a Tool Bench bundle: " + err.message); }
  importer.value = "";
};
document.body.appendChild(importer);

/* ========================= boot ========================= */
(async function boot(){
  let saved = await Store.load(KEY);
  if (!saved){
    // newest legacy first; local storage, then the artifact storage earlier builds used
    outer: for (const k of LEGACY_KEYS){
      for (const [where, load] of [["local", k => Store.load(k)], ["artifact", k => Store.loadLegacy(k)]]){
        const old = await load(k);
        if (old && Array.isArray(old.tools)){ saved = MIGRATE[k](old); migratedFrom = `${k} (${where})`; break outer; }
      }
    }
  }
  if (saved && Array.isArray(saved.tools)){
    state = {
      schema: SCHEMA, seq: saved.seq|0 || 1,
      config: (saved.config && typeof saved.config === "object") ? saved.config : state.config,
      overlay: (saved.overlay && typeof saved.overlay === "object") ? saved.overlay : {},
      errors: sanitiseErrors(saved.errors), errorsSeen: +saved.errorsSeen || 0,
      tools: saved.tools.map(sanitiseLocalTool)
    };
    reseq();
  }
  if (migratedFrom){ persist(); toast(`Moved ${state.tools.length} tool${state.tools.length===1?"":"s"} from ${migratedFrom}`); }
  if (Store.mode !== "local") toast("Local storage is blocked here, so nothing will be saved");
  render();
})();
