    <div class="sheethead"><h2>${tool ? "Edit tool" : "Add tool"}</h2>

      <button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheetbody">
      <div class="row">
        <label class="f"><span>Name</span><input class="in" id="fName" value="${esc(t.name)}" placeholder="AppSheet row lookup"></label>
        <label class="f"><span>Channel</span><input class="in" id="fCat" value="${esc(t.category||"")}" placeholder="Labels" list="catlist">
          <datalist id="catlist">${categories().map(([c])=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      </div>
      <label class="f"><span>What it does</span><input class="in" id="fDesc" value="${esc(t.description||"")}" placeholder="Looks up a row by key and prints a DYMO label"></label>
      <div class="row">
        <label class="f"><span>Tags · comma separated</span><input class="in" id="fTags" value="${esc((t.tags||[]).join(", "))}" placeholder="dymo, appsheet, print"></label>
        <label class="f"><span>Version on save</span>

            <input class="in" id="fVer" value="${esc(nextVer)}" style="font-family:var(--mono)">
            ${tool ? `<button class="btn" data-bump="minor" type="button">Minor</button><button class="btn" data-bump="major" type="button">Major</button>` : ""}
          </span></label>
      </div>

      <div>
        <div class="tabs" id="srcTabs" style="margin-bottom:8px">
          <button data-src="paste" class="${srcMode==="paste"?"on":""}">Paste HTML</button>
          <button data-src="file" class="${srcMode==="file"?"on":""}">Upload file</button>
          <button data-src="url" class="${srcMode==="url"?"on":""}">Link to URL</button>
        </div>
        <div id="srcPaste" ${srcMode!=="paste"?'hidden':''}>
          <textarea class="in" id="fHtml" placeholder="&lt;!DOCTYPE html&gt;…">${esc(t.source.html||"")}</textarea>

function syncSaveLabel(){
  const b = $("#fSave"); if (!b || !editingId) return;
  b.textContent = "Save as v" + ($("#fVer").value.trim() || "?");
}

// Fill the open sheet from the block in a pasted or uploaded file.
function fillSheetFromHtml(html){
  const r = readToolBlock(html);
  const note = $("#fRead");
  if (r.error){ note.hidden = false; note.textContent = r.error + " Fields left as they were."; return; }
  if (!r.found && !r.fields.name){ note.hidden = true; return; }
  const f = r.fields;
  if (f.name) $("#fName").value = f.name;
  if (f.description !== undefined) $("#fDesc").value = f.description;
  if (f.category) $("#fCat").value = f.category;
  if (Array.isArray(f.tags)) $("#fTags").value = f.tags.join(", ");
  if (f.contract){
    const c = normaliseContract(f.contract);
    $("#fNeeds").value = c.config_keys.join(", "); $("#fReq").value = c.requires.join(", ");
  }
  if (f.config && typeof f.config === "object") $("#fConfig").value = JSON.stringify(f.config, null, 2);
  if (f.sandbox) document.querySelectorAll("[data-sb]").forEach(el => { if (el.dataset.sb in f.sandbox) el.checked = !!f.sandbox[el.dataset.sb]; });
  let msg = r.found ? "Read the fields from the file's tool block" : "No tool block in this file; took the name from its title";
  if (isSemver(f.version)){
    if (!sheetBase || semverCmp(f.version, sheetBase) > 0){ $("#fVer").value = f.version; msg += `, version ${f.version}`; }
    else msg += `. The file says v${f.version}, which isn't above the current v${sheetBase}, so saving makes v${$("#fVer").value}`;
  }
  note.hidden = false; note.textContent = msg + ".";
  syncSaveLabel();
}

function settingsField(t, f){
  const stored = getPath(isObj(state.config[t.config_schema.namespace]) ? state.config[t.config_schema.namespace] : {}, f.path);
  const v = !isEmptyVal(stored) ? stored : f.default !== undefined ? f.default : "";
  const attrs = `data-path="${esc(f.path)}" data-type="${esc(f.type)}"`;
  const label = `${esc(f.label)}${f.required ? " · required" : ""}`;
  let input;
  if (f.type === "boolean"){
    return `<label class="chk"><input type="checkbox" ${attrs} ${v === true ? "checked" : ""}><span>${label}</span></label>
      ${f.help ? `<p class="hint">${esc(f.help)}</p>` : ""}`;
  } else if (f.type === "enum"){
    input = `<select class="in" ${attrs}>${f.required ? "" : `<option value=""${v === "" ? " selected" : ""}>(not set)</option>`}
      ${f.values.map(x => `<option value="${esc(x)}"${x === v ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>`;
  } else if (isSecretField(f)){
    input = `<span style="display:flex;gap:6px;text-transform:none;letter-spacing:0">
      <input class="in" type="password" autocomplete="off" spellcheck="false" ${attrs} value="${esc(v)}" style="font-family:var(--mono)">
      <button class="btn" type="button" data-act="toggleSecret">Show</button></span>`;
  } else {
    input = `<input class="in" type="${f.type === "number" ? "number" : "text"}" spellcheck="false" ${attrs} value="${esc(v)}"
      placeholder="${esc(f.type === "url" ? "https://…" : "")}" ${f.type === "url" || f.type === "header" ? 'style="font-family:var(--mono);font-size:12px"' : ""}>`;
  }
  return `<label class="f"><span>${label}</span>${input}</label>${f.help ? `<p class="hint" style="margin-top:-8px">${esc(f.help)}</p>` : ""}`;
}
function settingsSection(t){
  const chk = contractCheck(t);
  return `<section class="cfgsec" data-tool="${esc(t.id)}">
    <div class="cfghead"><h3>${esc(t.name)}</h3><span class="meta">${esc(t.id)} · ${esc(t.origin)} · <code>${esc(t.config_schema.namespace)}</code></span></div>
    ${t.config_schema.fields.map(f => settingsField(t, f)).join("")}
    <div class="cfgfoot">
      <span class="${chk.fields.length ? "no" : "ok"}" style="font-family:var(--mono);font-size:11px">${chk.fields.length
        ? "Can't run: " + esc(describeErrors(chk.fields).join("; ")) : "Ready to run"}</span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn primary" data-act="saveToolConfig" data-id="${esc(t.id)}">Save</button>
    </div>
    <p class="err" data-err></p>
  </section>`;
}
function settingsSheet(focusId){
  const needed = new Map();
  allTools().forEach(t => ((t.contract||{}).config_keys||[]).forEach(k => {
    if (!needed.has(k)) needed.set(k, []); needed.get(k).push(t.name);
  }));
  const rows = [...needed.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,who]) => {
    const set = state.config[k] !== undefined && state.config[k] !== null && state.config[k] !== "";
    return `<tr><td><code>${esc(k)}</code></td><td class="${set?"ok":"no"}">${set?"set":"not set"}</td><td>${esc(who.join(", "))}</td></tr>`;
  }).join("");
  const forms = allTools().filter(t => t.config_schema).sort((a,b) => a.name.localeCompare(b.name));
  openSheet(`<div class="sheet wide">
    <div class="sheethead"><h2>Settings</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="sheetbody">
      <p class="hint">Every tool gets the shared settings as <code>window.TOOL_CONFIG</code> when it runs, with its own settings merged on top. Change a value here and it reaches every tool on the next run.</p>
      ${rows ? `<table class="t"><thead><tr><th>Needed setting</th><th>Shared</th><th>Needed by</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
      ${forms.length ? `<span class="lbl">Tool settings · declared by each tool</span>${forms.map(settingsSection).join("")}` : ""}
      <label class="f"><span>Global settings JSON · everything else</span>
        <textarea class="in" id="gConfig" style="min-height:200px">${esc(JSON.stringify(maskSecrets(state.config), null, 2))}</textarea></label>
      <div class="note">Secrets stay on this device's local store, are never exported or put in the registry. In the JSON they show as <code>${MASK}</code>; leave them masked to keep them.</div>
      <p class="err" id="gErr"></p>
    </div>
    <div class="sheetfoot"><div class="spacer"></div>
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn primary" data-act="saveConfig">Save JSON</button></div></div>`);
  if (focusId){
    const sec = document.querySelector(`.cfgsec[data-tool="${CSS.escape(focusId)}"]`);
    if (sec){ sec.scrollIntoView({ block:"start" }); const first = sec.querySelector("[data-path]"); if (first) first.focus(); }
  }
}
// Read one tool's form, check it against its schema and store it under its namespace.
function saveToolSettings(id){
  const t = findTool(id); if (!t || !t.config_schema) return;
  const sec = document.querySelector(`.cfgsec[data-tool="${CSS.escape(id)}"]`); if (!sec) return;
  const values = {};
  sec.querySelectorAll("[data-path]").forEach(el => {
    const ty = el.dataset.type;
    let v = ty === "boolean" ? el.checked : el.value.trim();
    if (ty === "number" && v !== "") v = Number(v);
    values[el.dataset.path] = v;
  });
  const r = applySettings(t, values, false);
  if (r.errors.length){ sec.querySelector("[data-err]").textContent = "Not saved: " + r.errors.join("; "); return; }
  state.config[t.config_schema.namespace] = r.next;
  persist(); render(); settingsSheet(id);
  toast(`Settings saved for ${t.name}` + (r.missing.length ? ` · still needs ${r.missing.map(m => m.label).join(", ")}` : ""));
}

function copyText(txt, okMsg, fileName){
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => toast(okMsg), () => downloadFile(fileName, txt, "application/json"));
}

/* ========================= tool CRUD ========================= */
function snapshot(t){
  return { version: t.version, savedAt: t.updatedAt || Date.now(), name: t.name, description: t.description,
           category: t.category, tags: (t.tags||[]).slice(), source: JSON.parse(JSON.stringify(t.source)),
           sandbox: Object.assign({}, t.sandbox), config: JSON.parse(JSON.stringify(t.config||{})),
           contract: normaliseContract(t.contract), config_schema: clone(t.config_schema || null) };
}
// Every change to a local tool is a new version: the old one goes to history and the
// file's block is rewritten with the new fields and version.
function newVersion(t, data, version){
  t.history = (t.history||[]).concat([snapshot(t)]).slice(-HISTORY_MAX);
  Object.assign(t, data, { version, updatedAt: Date.now() });
  t.source = withBlock(t);
}

function readSheetIntoTool(){
  const err = $("#fErr");
  const name = $("#fName").value.trim();
  if (!name){ err.textContent = "Give the tool a name."; return null; }

  const version = $("#fVer").value.trim();
  if (!isSemver(version)){ err.textContent = "Version must look like 1.2.3."; return null; }
  if (sheetBase && semverCmp(version, sheetBase) <= 0){ err.textContent = `Version must be above the current v${sheetBase}.`; return null; }

  let cfg = {};
  try { const raw = $("#fConfig").value.trim(); cfg = raw ? JSON.parse(raw) : {}; }
  catch(e){ err.textContent = "Tool settings aren't valid JSON: " + e.message; return null; }
  if (!cfg || typeof cfg !== "object" || Array.isArray(cfg)){ err.textContent = "Tool settings must be a JSON object."; return null; }

  const was = editingId && state.tools.find(x => x.id === editingId);
  const source = { kind: srcMode === "url" ? (was && was.source.kind === "fetch" ? "fetch" : "url") : "inline" };
  if (source.kind === "url"){
    source.url = $("#fUrl").value.trim();
    if (!/^https?:\/\//i.test(source.url)){ err.textContent = "Enter a full URL starting with http:// or https://"; return null; }
  } else {
    source.html = $("#fHtml").value;
    if (!source.html.trim()){ err.textContent = "Paste the tool's HTML, or upload the file."; return null; }
  }

  const split = s => s.split(",").map(x=>x.trim()).filter(Boolean);
  const contract = { config_keys: split($("#fNeeds").value), requires: split($("#fReq").value) };
  const bad = contract.requires.filter(k => !/^[a-z][a-z_]*:.+$/.test(k));
  if (bad.length){ err.textContent = "Dependencies must look like prefix:id (for example cap:ebay.market.search): " + bad.join(", "); return null; }

  const sandbox = {};
  document.querySelectorAll("[data-sb]").forEach(el => sandbox[el.dataset.sb] = el.checked);

  // settings declared in a pasted file's block win; otherwise the tool keeps what it declared
  const blk = source.kind === "inline" ? readToolBlock(source.html).fields : {};
  const csRaw = blk.config_schema || (was && was.config_schema) || null;
  const config_schema = normaliseConfigSchema(csRaw, contract.config_keys);
  if (csRaw && !config_schema){ err.textContent = "The tool's config_schema isn't valid (its namespace must be in Needs settings; paths unique; enum values; defaults match the type; no secret defaults)."; return null; }

  return {
    version,
    data: { name, description: $("#fDesc").value.trim(), category: $("#fCat").value.trim() || "General",
            tags: split($("#fTags").value), source, sandbox, config: cfg, contract, config_schema }
  };
}

function saveTool(){
  const r = readSheetIntoTool(); if (!r) return;
  if (editingId){
    const t = state.tools.find(x => x.id === editingId);
    newVersion(t, r.data, r.version);
    toast(`Saved ${t.id} as v${t.version}`);
  } else {
    const t = sanitiseLocalTool(Object.assign({ id: nextId(), version: r.version, history:[] }, r.data));
    t.source = withBlock(t);
    state.tools.push(t);
    toast(`Added ${t.id} v${t.version}`);
  }
  persist(); render(); closeSheet();
}

function forkTool(t){
  const c = sanitiseLocalTool({
    id: nextId(), name: t.name + " (local)", description: t.description, category: t.category, tags: t.tags,
    source: JSON.parse(JSON.stringify(t.source)), sandbox: t.sandbox, config: t.config, contract: t.contract,
    config_schema: t.config_schema, version: "1.0.0", history:[], forkedFrom: t.id + "@" + t.version
  });
  c.source = withBlock(c);
  state.tools.push(c); persist(); render(); toast(`Forked ${t.id} v${t.version} as ${c.id}`);
  return c;
}

// A dropped file is complete on its own: its block names the tool. A block whose id is one
// of your local tools updates that tool when its version is higher; otherwise it's a new tool.
function addFromFile(file, text){
  const r = readToolBlock(text);
  if (r.error) return { skipped: `${file.name}: ${r.error}` };
  const f = r.fields;
  const name = f.name || file.name.replace(/\.html?$/i, "").replace(/[-_]+/g," ");
  const data = {
    name, description: f.description || "", category: f.category || (filter.cat === "*" ? "General" : filter.cat),
    tags: Array.isArray(f.tags) ? f.tags.map(String) : [],
    sandbox: Object.assign({}, DEFAULT_SANDBOX, f.sandbox || {}),
    config: (f.config && typeof f.config === "object" && !Array.isArray(f.config)) ? f.config : {},
    contract: normaliseContract(f.contract), source: { kind:"inline", html: text },
    config_schema: normaliseConfigSchema(f.config_schema, normaliseContract(f.contract).config_keys)
  };
  const version = isSemver(f.version) ? f.version : "1.0.0";
  const existing = f.id && state.tools.find(t => t.id === f.id);
  if (existing){
    if (semverCmp(version, existing.version) <= 0)
      return { skipped: `${existing.name}: the file is v${version}, not above v${existing.version}` };
    newVersion(existing, data, version);
    return { updated: `${existing.id} to v${version}` };
  }
  const keepId = /^TL:\d+$/.test(f.id || "") && !findTool(f.id);
  const t = sanitiseLocalTool(Object.assign({ id: keepId ? f.id : nextId(), version, history:[] }, data));
  t.source = withBlock(t);
  state.tools.push(t);
  if (keepId) reseq();
  return { added: `${t.id} v${version}` };
}

function downloadFile(name, content, type){
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// The local bundle export: secret values stripped from the settings, every tool and its history.
function exportBundle(){
  return { schema: state.schema, host_version: MANIFEST.version, config: stripSecrets(state.config),
           tools: state.tools.map(t => Object.assign({}, t, { config: stripSecrets(t.config), source: withBlock(t),
             history: (t.history || []).map(h => Object.assign({}, h, { config: stripSecrets(h.config) })) })) };
}

// Promote a local tool: the file (block rewritten with a repo id) goes to tools/<slug>.html
// and the registry gets one line {"file": ...}; then a change lands it (see CLAUDE.md).
function exportForRepo(t){
  const s = slug(t.name);
  if (t.source.kind === "url" || t.source.kind === "fetch"){
    const entry = Object.assign(toolFields(Object.assign({}, t, { id: "TB:" + s })), { url: t.source.url },
                                t.source.kind === "fetch" ? { run: "fetch" } : {});
    downloadFile(`${s}.registry-entry.json`, JSON.stringify(entry, null, 2), "application/json");
  } else {
    const html = writeToolBlock(t.source.html, toolFields(Object.assign({}, t, { id: "TB:" + s })));
    downloadFile(`${s}.html`, html, "text/html");
    downloadFile(`${s}.registry-entry.json`, JSON.stringify({ file: `tools/${s}.html` }, null, 2), "application/json");
  }
  toast("Downloaded the file and its registry line for the repo");
}

/* ========================= events ========================= */
$("#rail").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.cat){ filter.cat = b.dataset.cat; render(); return; }
  const act = b.dataset.act;
  if (act === "deps") depsSheet();
  if (act === "errors") errorsSheet();
  if (act === "registry") registrySheet();
  if (act === "export") downloadFile(`tool-bench-local-${new Date().toISOString().slice(0,10)}.json`,
      JSON.stringify(exportBundle(), null, 2), "application/json");
  if (act === "import") $("#importer").click();
});

$("#grid").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "add"){ toolSheet(null); return; }
  const card = b.closest(".tool"); if (!card) return;
  const t = findTool(card.dataset.id); if (!t) return;
  const act = b.dataset.act;
  if (act === "run") openRunner(t.id);
  if (act === "pin"){ setPinned(t, !t.pinned); renderGrid(); }
  if (act === "menu") openMenu(b, t);
});

function openMenu(anchor, t){
  const m = $("#menu");
  const local = t.origin === "local";
  m.innerHTML = local ? `
    <button data-m="edit">Edit</button>
    <button data-m="hist">History (v${esc(t.version)})</button>
    <button data-m="pop">Open standalone</button>
    <button data-m="dl">Download .html (v${esc(t.version)})</button>
    <button data-m="dup">Duplicate</button>
    <button data-m="promote">Export for repo</button>
    <hr><button data-m="rm" class="rm">Delete</button>` : `
    <button data-m="fork">Fork to local copy</button>
    <button data-m="pop">Open standalone</button>
    <button data-m="dl">Download .html (v${esc(t.version)})</button>
    <hr><button data-m="info" disabled style="opacity:.6;cursor:default">Repo tool · ${esc(t.file || "")}</button>`;
  const r = anchor.getBoundingClientRect();
  m.classList.add("open");
  m.style.left = Math.min(r.left, window.innerWidth - 216) + "px";
  m.style.top = Math.min(r.bottom + 6, window.innerHeight - m.offsetHeight - 10) + "px";
  m.onclick = ev => {
    const b = ev.target.closest("button"); if (!b || b.disabled) return;
    const k = b.dataset.m; m.classList.remove("open");
    if (k === "edit") toolSheet(state.tools.find(x => x.id === t.id));
    if (k === "hist") historySheet(state.tools.find(x => x.id === t.id));
    if (k === "fork") toolSheet(forkTool(t));
    if (k === "promote") exportForRepo(t);
    if (k === "pop") window.open(standaloneUrl(t), "_blank", "noopener");
    if (k === "dl") downloadFile(`${slug(t.name)}-${t.version}.html`,
        t.source.kind === "fetch" && FETCHED.has(t.source.url) ? FETCHED.get(t.source.url).html
        : t.source.kind !== "inline"
          ? `<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=${esc(t.source.url)}"><a href="${esc(t.source.url)}">${esc(t.source.url)}</a>`
          : withBlock(t).html, "text/html");
    if (k === "dup"){
      const c = sanitiseLocalTool(Object.assign(JSON.parse(JSON.stringify(t)), {
        id: nextId(), name: t.name + " copy", runs: 0, pinned: false, version: "1.0.0", history: [],
        createdAt: Date.now(), updatedAt: Date.now() }));
      c.source = withBlock(c);
      state.tools.push(c); persist(); render(); toast("Duplicated as " + c.id);
    }
    if (k === "rm"){
      if (confirm(`Delete ${t.name}? Its stored copy and history go with it.`)){
        state.tools = state.tools.filter(x => x.id !== t.id); persist(); render(); toast("Deleted " + t.id);
      }
    }
  };
}
document.addEventListener("click", e => {
  if (!e.target.closest("#menu") && !e.target.closest('[data-act="menu"]')) $("#menu").classList.remove("open");
});

$("#scrim").addEventListener("click", e => {
  if (e.target === $("#scrim")) return closeSheet();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.bump){ $("#fVer").value = bump(sheetBase, b.dataset.bump); syncSaveLabel(); return; }
  const act = b.dataset.act;
  if (act === "close") return closeSheet();
  if (act === "save") return saveTool();
  if (act === "openSettings"){ const id = b.dataset.id; closeSheet(); return settingsSheet(id); }
  if (act === "copyBug"){
    const e = state.errors.find(x => String(x.ts) === b.dataset.ts);
    if (e) copyText(JSON.stringify(bugReport(e), null, 2), "Bug report copied", "tool-bench-bug.json");
    return;
  }
  if (act === "exportErrors"){
    downloadFile(`tool-bench-errors-${new Date().toISOString().slice(0,10)}.json`,
      JSON.stringify({ host: MANIFEST.repo, host_version: MANIFEST.version, object_key: BUG_KEY, errors: state.errors }, null, 2), "application/json");
    return;
  }
  if (act === "clearErrors"){
    if (confirm(`Clear ${state.errors.length} logged error${state.errors.length===1?"":"s"}? Copy or export anything you want to report first.`)){
      state.errors = []; state.errorsSeen = 0; persist(); render(); closeSheet(); toast("Error log cleared");
    }
    return;
  }
  if (act === "editTool"){ const t = state.tools.find(x => x.id === b.dataset.id); closeSheet(); return toolSheet(t); }
  if (act === "copyDeps"){
    const txt = JSON.stringify(depsMap(), null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(()=>toast("Dependency map copied"), ()=>downloadFile("tool-bench-deps.json", txt, "application/json"));
    return;
  }
  if (act === "restore"){
    const t = state.tools.find(x => x.id === editingId);
    const h = t && (t.history||[]).find(x => x.version === b.dataset.ver);
    if (!h) return;
    newVersion(t, { name:h.name, description:h.description, category:h.category, tags:h.tags,
                    source:h.source, sandbox:h.sandbox, config:h.config, contract:h.contract,
                    config_schema: normaliseConfigSchema(h.config_schema, normaliseContract(h.contract).config_keys) }, bump(t.version));
    persist(); render(); closeSheet(); toast(`Restored v${h.version} as v${t.version}`);
    return;
  }
  if (act === "delete"){
    const t = state.tools.find(x => x.id === editingId);
    if (t && confirm(`Delete ${t.name}? Its history goes with it.`)){
      state.tools = state.tools.filter(x => x.id !== t.id); persist(); render(); closeSheet(); toast("Deleted " + t.id);
    }
    return;
  }
  if (act === "toggleSecret"){
    const inp = b.parentElement.querySelector("input");
    const show = inp.type === "password"; inp.type = show ? "text" : "password"; b.textContent = show ? "Hide" : "Show";
    return;
  }
  if (act === "saveToolConfig") return saveToolSettings(b.dataset.id);
  if (act === "saveConfig"){
    try {
      const next = JSON.parse($("#gConfig").value || "{}");
      if (!next || typeof next !== "object" || Array.isArray(next)) throw new Error("settings must be a JSON object");
      state.config = restoreSecrets(next, state.config); persist(); render(); closeSheet(); toast("Settings saved");
    } catch(err){ $("#gErr").textContent = "Not valid: " + err.message; }
    return;
  }
  if (act === "applyRegistry"){
    try {
      const next = JSON.parse($("#rJson").value);
      if (!Array.isArray(next.tools)) throw new Error("Registry needs a tools array");
      const ids = new Set();
      next.tools.forEach((t,i) => {
        validateLocalTool(t, i);
        if (!t.id || !/^TL:\d+$/.test(t.id)) throw new Error(`Tool ${i+1} needs an id like TL:000001`);
        if (ids.has(t.id)) throw new Error(`Duplicate id ${t.id}`);
        ids.add(t.id);
      });
      next.tools.forEach(t => {
        const prev = state.tools.find(x => x.id === t.id);
        if (isObj(t.config) || prev) t.config = restoreSecrets(isObj(t.config) ? t.config : {}, prev ? prev.config : {});
      });
      state = {
        schema: SCHEMA, seq: next.seq|0, config: restoreSecrets(isObj(next.config) ? next.config : {}, state.config),
        overlay: (next.overlay && typeof next.overlay === "object") ? next.overlay : {},
        errors: state.errors, errorsSeen: state.errorsSeen,   // the error log is not part of the editable registry
        tools: next.tools.map(sanitiseLocalTool)
      };
      reseq(); persist(); render(); closeSheet(); toast("Registry applied");
    } catch(err){ $("#rErr").textContent = err.message; }
    return;
  }
  if (b.dataset.src){
    srcMode = b.dataset.src;
    document.querySelectorAll("#srcTabs button").forEach(x => x.classList.toggle("on", x.dataset.src === srcMode));
    $("#srcPaste").hidden = srcMode !== "paste";
    $("#srcFile").hidden = srcMode !== "file";
    $("#srcUrl").hidden = srcMode !== "url";
  }
});

$("#scrim").addEventListener("input", e => { if (e.target.id === "fVer") syncSaveLabel(); });
$("#scrim").addEventListener("change", e => {
  if (e.target.id === "fHtml"){ fillSheetFromHtml(e.target.value); return; }
  if (e.target.id !== "fFile") return;
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    $("#fHtml").value = r.result;
    srcMode = "paste";
    document.querySelectorAll("#srcTabs button").forEach(x => x.classList.toggle("on", x.dataset.src === "paste"));
    $("#srcPaste").hidden = false; $("#srcFile").hidden = true;
    fillSheetFromHtml(String(r.result));
    if (!$("#fName").value.trim()) $("#fName").value = f.name.replace(/\.html?$/i,"");
    toast("Loaded " + f.name);
  };
  r.readAsText(f);
});

document.addEventListener("keydown", e => {
  if (e.key === "/" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){
    e.preventDefault(); $("#q").focus(); return;
  }
  if (e.key === "Escape"){
    if ($("#scrim").classList.contains("open")) closeSheet();
    else if ($("#runner").classList.contains("open")) closeRunner();
  }
});

/* drag and drop .html anywhere */
const bench = $("#bench");
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => {
  if (![...(e.dataTransfer?.types||[])].includes("Files")) return;
  e.preventDefault(); bench.classList.add("drop");
}));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
  if (ev === "dragleave" && e.relatedTarget) return;
  bench.classList.remove("drop");
}));
async function addFiles(files){
  const out = { added:[], updated:[], skipped:[] };
  for (const f of files){
    if (!/\.html?$/i.test(f.name) && f.type !== "text/html"){ out.skipped.push(`${f.name}: not an .html file`); continue; }
    const r = addFromFile(f, await f.text());
    for (const k of Object.keys(out)) if (r[k]) out[k].push(r[k]);
  }
  if (out.added.length || out.updated.length){ persist(); render(); }
  const parts = [];
  if (out.added.length) parts.push(`added ${out.added.join(", ")}`);
  if (out.updated.length) parts.push(`updated ${out.updated.join(", ")}`);
  if (out.skipped.length) parts.push(`skipped ${out.skipped.join("; ")}`);
  toast(parts.join(" · ") || "Nothing to add");
  return out;
}
document.addEventListener("drop", e => {
  const files = [...(e.dataTransfer?.files||[])]; if (!files.length) return;
  e.preventDefault(); addFiles(files);
});

/* importer for exported bundles: every imported tool is validated first, then
   gets a fresh local id, so an import can never overwrite or collide. */
const importer = document.createElement("input");
importer.type = "file"; importer.accept = "application/json,.json"; importer.id = "importer"; importer.hidden = true;
importer.onchange = async () => {
  const f = importer.files[0]; if (!f) return;
  try {
    let next = JSON.parse(await f.text());
    if (next && next.version === 1 && !next.schema) next = migrateV1(next);   // a v1 export
    if (!next || !Array.isArray(next.tools)) throw new Error("no tools array");
    next.tools.forEach(validateLocalTool);
    next.tools.forEach(t => {
      const c = sanitiseLocalTool(Object.assign({}, t, { id: nextId() }));
      c.source = withBlock(c);
      state.tools.push(c);
    });
    reseq(); persist(); render(); toast(`Imported ${next.tools.length} tool${next.tools.length===1?"":"s"}`);
  } catch(err){ toast("Not a Tool Bench bundle: " + err.message); }
  importer.value = "";
};
document.body.appendChild(importer);

/* ========================= boot ========================= */
(async function boot(){
  let saved = await Store.load(KEY);
  if (!saved){
    // newest legacy first; local storage, then the artifact storage earlier builds used
    outer: for (const k of LEGACY_KEYS){
      for (const [where, load] of [["local", k => Store.load(k)], ["artifact", k => Store.loadLegacy(k)]]){
        const old = await load(k);
        if (old && Array.isArray(old.tools)){ saved = MIGRATE[k](old); migratedFrom = `${k} (${where})`; break outer; }
      }
    }
  }
  if (saved && Array.isArray(saved.tools)){
    state = {
      schema: SCHEMA, seq: saved.seq|0 || 1,
      config: (saved.config && typeof saved.config === "object") ? saved.config : state.config,
      overlay: (saved.overlay && typeof saved.overlay === "object") ? saved.overlay : {},
      errors: sanitiseErrors(saved.errors), errorsSeen: +saved.errorsSeen || 0,
      tools: saved.tools.map(sanitiseLocalTool)
    };
    reseq();
  }
  if (migratedFrom){ persist(); toast(`Moved ${state.tools.length} tool${state.tools.length===1?"":"s"} from ${migratedFrom}`); }
  if (Store.mode !== "local") toast("Local storage is blocked here, so nothing will be saved");
  render();
})();
