<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pack & Ship</title>
<script type="application/json" id="toolbench-tool">
{
  "format": "toolbench.tool/1",
  "id": "TB:pack-ship",
  "name": "Pack & Ship",
  "description": "Pack and ship paid Discogs orders (ca.pack_ship/1): stage table from pack.orders.stages, orders shaded apart with a Discogs link, a row filter over every stage, status and context value (chips or typed query with autocomplete) with one action run on all shown orders, every label page printed (tap a preview page to skip it), compact buttons with tooltips and two-tap confirm. Rows in memory only.",
  "category": "CA_V3",
  "tags": ["discogs", "parcel2go", "shipping", "print", "ca.pack_ship/1", "ca.pack_page/1", "ca.pack_row_context/2"],
  "version": "2.4.0",
  "contract": { "config_keys": ["packship"], "requires": ["wf:Pqjdoot0EPzoQxj0", "std:pack_stages", "cap:pack.orders.stages", "cap:pack.refresh", "cap:runs.status", "cap:print.queue.add", "cap:label.bytes"] },
  "sandbox": { "scripts": true, "forms": false, "modals": true, "popups": true, "downloads": true, "sameOrigin": false },
  "config_schema": {
    "namespace": "packship",
    "fields": [
      { "path": "url", "label": "Pack & Ship endpoint", "type": "url", "required": true, "default": "https://komposing.app.n8n.cloud/webhook/ca-v3-pack-ship" },
      { "path": "headers.X-Api-Key", "label": "Viewer key (X-Api-Key)", "type": "secret", "required": false, "secret": true, "help": "CA_V3 viewer key. Leave empty to use the key saved for the CA_V3 Viewer (cav3)." },
      { "path": "window_days", "label": "Days shown", "type": "number", "default": 14, "help": "1 to 60 (pack.orders.stages window_days)" },
      { "path": "copies", "label": "Label copies", "type": "number", "default": 1, "help": "1 to 3" },
      { "path": "auto_print", "label": "Open the print dialog after Print", "type": "boolean", "default": true }
    ]
  }
}
</script>
<style>
:root{--bg:#FBFAF7;--panel:#F3F1EC;--line:#DEDAD1;--ink:#12161A;--ink2:#5B6670;--ink3:#8A939B;--acc:#1E66D0;--warn:#C77700;--bad:#C0392B;--ok:#2E7D32;
  --s-orange:#E07B00;--s-yellow:#E8C21C;--s-green:#2E9D48;--s-grey:#A3A9AE;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;padding:4px 10px}
button:hover{border-color:var(--ink3)} button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;border:1px solid var(--line);border-radius:4px;padding:3px 6px;background:#fff;color:var(--ink)}
code,.mono{font-family:var(--mono);font-size:11.5px}
h3{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
#app{display:grid;height:100%;grid-template-rows:auto 1fr;grid-template-columns:1fr 400px;grid-template-areas:"top top" "list prev"}

#sync.ok i{background:var(--ok)} #sync.busy i{background:var(--warn)} #sync.err i{background:var(--bad)}

table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

tbody.o:nth-of-type(even) td{background:#F6F4EF} tbody.o+tbody.o tr:first-child td{border-top:2px solid var(--line)}
tr.sel td,tbody.o tr.sel td{background:#EEF4FD} td.mono{white-space:nowrap}
a.oref{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc)} a.oref:hover{border-bottom-style:solid}
.ab button.arm{background:var(--warn);border-color:var(--warn);color:#fff}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:74px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.st .t{font-size:11px;color:var(--ink2);line-height:1.25;max-width:120px}

.ab:focus-visible,.ab:focus-within{box-shadow:0 0 0 2px var(--acc)}
.ab[data-tip]:focus::after,.ab[data-tip]:focus-within::after{content:attr(data-tip);position:absolute;right:0;top:calc(100% + 4px);z-index:3;background:var(--ink);color:#fff;font-size:11px;line-height:1.3;padding:5px 7px;border-radius:4px;width:max-content;max-width:240px;white-space:normal;pointer-events:none}
.inp,.links{flex-basis:100%} .inp{display:flex;gap:4px} .inp input{flex:1;min-width:0;padding:2px 5px;font-size:12px}
tr.hasctx td{border-bottom:0;padding-bottom:2px} tr.cx td{padding:0 8px 6px} tr.cx.sel td{background:#EEF4FD}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:11.5px;color:var(--ink2);position:sticky;left:8px;max-width:calc(100vw - 48px)}
.ctx .u{font-weight:600;color:var(--ink)} .ctx .pc{font-family:var(--mono);font-size:11px;color:var(--ink)} .ctx .sp{color:var(--ink3)}
.chip{display:inline-block;padding:0 5px;border-radius:3px;font:600 10px/16px var(--mono);border:1px solid var(--line);background:#fff;color:var(--ink2)}
.chip.c-NI,.chip.c-JE,.chip.c-GG{background:#FFF4E0;border-color:var(--warn);color:#8A5200}
.chip.c-international{background:#EEF4FD;border-color:var(--acc);color:var(--acc)} .chip.c-q{background:#FDECEA;border-color:var(--bad);color:var(--bad)}
#fbar{margin:0 0 8px;position:relative} .qrow{display:flex;gap:4px} #q{flex:1;min-width:0;font-family:var(--mono);font-size:12px;padding:4px 7px}
#sugg{position:absolute;z-index:5;left:0;top:30px;margin:0;padding:3px 0;list-style:none;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-height:240px;overflow:auto;min-width:260px}
#sugg li{padding:3px 10px;font:12px var(--mono);cursor:pointer;display:flex;justify-content:space-between;gap:12px} #sugg li.on,#sugg li:hover{background:#EEF4FD} #sugg li .h{color:var(--ink3);font-family:var(--sans)}
#chips{display:flex;flex-wrap:wrap;gap:3px 10px;margin:6px 0 0} .dim{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px} .dim>b{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-right:2px}
#chips button,#filters button{padding:1px 8px;font-size:11.5px;border-radius:12px} #chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)} #chips button.neg{background:#FDECEA;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
#chips .n{color:var(--ink3);margin-left:3px} #chips button.on .n{color:#cfd5da} #chips .dot{width:9px;height:9px;margin-right:4px;vertical-align:-1px}
#bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 0;font-size:12px} #bulk select{font-size:12px} #bulk .res{flex-basis:100%;font:11.5px var(--mono);color:var(--ink2);max-height:120px;overflow:auto} #bulk .res .bad{color:var(--bad)} #bulk .res .ok{color:var(--ok)}
#bulk button.arm{background:var(--warn);border-color:var(--warn);color:#fff}

#filters .n{color:var(--ink3);margin-left:3px} #filters button.on .n{color:#cfd5da}
.cnt{font:10px var(--mono);color:var(--ink3)}
.small{font-size:11.5px;color:var(--ink2)}
.links a{display:block;font:11px var(--mono);word-break:break-all;color:var(--acc)}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 12px;border-radius:6px;display:none;max-width:80%;z-index:9}
#toast.bad{background:var(--bad)}
#cfg{display:none;position:absolute;top:44px;right:12px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;width:360px;max-width:calc(100% - 24px);box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:5}
#cfg .row{display:flex;gap:6px;align-items:center;margin:4px 0} #cfg .lbl{width:70px;color:var(--ink2)} #cfg input{flex:1}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr 40%;grid-template-areas:"top" "list" "prev"} #prev{border-left:0;border-top:1px solid var(--line)}}
</style></head>
<body><div id="app">
<div id="top">
  <span class="brand">Pack &amp; Ship</span>
  <label class="small">days <input id="days" type="number" min="1" max="60" value="14" style="width:52px"></label>
  <button id="reload" title="read the stages again (no sync)">Reload</button>
  <button id="refresh" class="pri" title="run pack.refresh: orders, items, messages, health, then parcels">Refresh</button>
  <label class="small">copies <input id="copies" type="number" min="1" max="3" value="1" style="width:44px"></label>
  <span class="sep"></span>
  <span id="count" class="small"></span>
  <span id="last"></span>
  <span id="sync"><i></i><span id="syncT">idle</span></span>
  <button id="gear" title="settings">⚙</button>
</div>
<div id="cfg">
  <h3>Connect</h3>
  <div class="row"><span class="lbl">endpoint</span><input id="cUrl" type="url"></div>
  <div class="row"><span class="lbl">key</span><input id="cKey" type="password" placeholder="X-Api-Key (kept in memory only)"></div>
  <div class="row"><span class="lbl"></span><button id="cSave" class="pri">Save</button><button id="cClose">Close</button></div>
  <p id="cNote" class="small"></p>
</div>
<div id="list">
  <div id="fbar" hidden>
    <div class="qrow"><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="filter: packed:none label:done status:&quot;In Progress&quot; follow_up!:none (Tab completes)" aria-label="filter query" aria-autocomplete="list" aria-controls="sugg"><button id="qClear" title="clear the filter">Clear</button></div>
    <ul id="sugg" role="listbox" hidden></ul>
    <div id="chips" role="group" aria-label="filter by value"></div>
    <div id="bulk"></div>
  </div>
  <div id="rows"><p class="small">Loading orders…</p></div>
</div>
<div id="prev">
  <div class="bar"><h3 style="margin:0">Print preview</h3><span class="small" id="docHint" style="margin-left:8px;color:var(--ink3)">tap a page to leave it out</span><span style="flex:1"></span><button id="printBtn" disabled>Print</button><button id="labelBtn" disabled title="open the label on its own (PDF labels)">Label</button></div>
  <iframe id="doc" title="print document"></iframe>
</div>
</div>
<div id="toast"></div>
<script>
/* Pack & Ship v2 (ca.pack_ship/1, ca.pack_page/1) — Tool Bench page for C841-s7.
   The page renders only what the engine returns: stage columns, states and icons from pack.orders.stages (stage_defs, states,
   orders[].stages), row buttons from orders[].actions (key, enabled, reason, inputs). It holds no action logic: a button posts
   {op: action, params: {order_ref, action, inputs}} and the engine front door re-reads the order and runs what std pack_stages
   page allows. Refresh posts op refresh; the reply names the poll op and its budget.
   2.1.0 (C841-s10, C1141): each order's context (std pack_stages row_context, ca.pack_row_context/2) is drawn as a line under
   the row: buyer username and full post code (joined by the engine page front door only), country, total with its currency,
   item count and the customs badge; any other context field is shown as name: value. A quick filter (All, each country in
   the loaded rows, each badge) narrows the rendered list in memory. Action buttons are compact, one wrapped row per order,
   and their reason is a tooltip (hover title; keyboard focus or a tap shows it), not a line on the page. Rows live in
   module variables only: nothing is written to localStorage, sessionStorage, IndexedDB or the Cache API. */
const TC = window.TOOL_CONFIG || {}, TM = window.TOOL_META || null;
const getPath = (o, p) => p.split(".").reduce((a, k) => (a && typeof a === "object") ? a[k] : undefined, o);
const PC = TC.packship || {};
const clampInt = (v, lo, hi, d) => { const n = Math.round(+v); return Number.isFinite(n) && n >= lo && n <= hi ? n : d; };
const bound = (v, lo, hi, d) => { const n = Math.round(+v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
const CONF = {
  url: PC.url || "https://komposing.app.n8n.cloud/webhook/ca-v3-pack-ship",
  key: getPath(PC, "headers.X-Api-Key") || getPath(TC, "cav3.dashboard.headers.X-Api-Key") || "",
  keyFrom: getPath(PC, "headers.X-Api-Key") ? "packship" : (getPath(TC, "cav3.dashboard.headers.X-Api-Key") ? "cav3" : ""),
  days: clampInt(PC.window_days, 1, 60, 14),
  copies: clampInt(PC.copies, 1, 3, 1),
  autoPrint: PC.auto_print == null ? true : !!PC.auto_print
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
const trunc = (s, n) => { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const cap1 = s => String(s || "").replace(/[_.]/g, " ").replace(/^./, c => c.toUpperCase());
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", bad ? 7000 : 3200); }
function setSync(cls, text){ const s = $("#sync"); s.className = cls; $("#syncT").textContent = text; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================== transport ============================== */
// Every reply is {status, outcome, message, ...}. A refusal is returned (never thrown) when soft is set, so callers can show it.
async function call(op, params, soft){
  if (!CONF.key) throw new Error("No viewer key: set it in Tool Bench Settings (Pack & Ship or CA_V3 Viewer) or in ⚙");
  let res;
  try {
    res = await fetch(CONF.url, { method: "POST", headers: { "Content-Type": "application/json", "X-Api-Key": CONF.key },
      body: JSON.stringify({ op, params: params || {} }), cache: "no-store" });
  } catch (e) { throw new Error("Pack & Ship endpoint unreachable (network or CORS): " + (e.message || e)); }
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(`HTTP ${res.status}: ${trunc(txt, 140) || "empty response"}`); }
  if (Array.isArray(j)) j = j[0] || {};
  if (soft) return j;
  const d = isObj(j.data) ? j.data : j;
  if (!res.ok || j.status === "error" || (j.outcome && j.outcome !== "ok")) {
    const why = (d.errors || []).map(e => `${e.param}: ${e.reason}`).join("; ") || d.message || j.message || `HTTP ${res.status}`;
    const err = new Error(`${op} ${j.outcome || d.outcome || "refused"}: ${why}`); err.body = j; throw err;
  }
  return d;
}

/* ============================== stages table ============================== */
let VIEW = { stage_defs: [], states: {}, orders: [], last_sync: {} }, SEL = "", JOB = null, BUSY_ACT = "";
const ICON = { orange: "var(--s-orange)", yellow: "var(--s-yellow)", green: "var(--s-green)", grey: "var(--s-grey)", gray: "var(--s-grey)" };
const iconColor = state => { const n = String(((VIEW.states || {})[state] || {}).icon || ""); return ICON[n] || (/^[a-z]+$|^#[0-9a-f]{3,8}$/i.test(n) ? n : "var(--s-grey)"); };
async function loadStages(){
  setSync("busy", "loading");
  try {
    const d = await call("orders_stages", { window_days: clampInt($("#days").value, 1, 60, CONF.days) });
    VIEW = { stage_defs: Array.isArray(d.stage_defs) ? d.stage_defs : [], states: isObj(d.states) ? d.states : {}, orders: Array.isArray(d.orders) ? d.orders : [], last_sync: isObj(d.last_sync) ? d.last_sync : {} };
    const rc = isObj(d.row_context) ? d.row_context : {};
    NOTES = [].concat(Array.isArray(d.notes) ? d.notes : [], Array.isArray(rc.notes) ? rc.notes : [], Array.isArray(rc.overlay_notes) ? rc.overlay_notes : []);
    TRUNC = !!d.truncated;
    const ls = Object.entries(VIEW.last_sync).filter(([, v]) => v).map(([k, v]) => `${k} ${new Date(v).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`);
    $("#last").textContent = ls.length ? "synced " + ls.join(" · ") : "";
    renderOrders(); if (!REFRESH.running) setSync("ok", "ok " + new Date().toLocaleTimeString("en-GB"));
  } catch (e) { setSync("err", "error"); $("#rows").innerHTML = `<p class="small">${esc(e.message)}</p>`; toast(e.message, true); }
}
// An action's inputs come from a page control of the same name (copies) or from an input drawn on the row (custom_text).
const PAGE_INPUT = { copies: () => clampInt($("#copies").value, 1, 3, 1) };
// Compact button: icon + short label; the reason is the wrapper's title (hover, also over a disabled button) and its data-tip
// (shown on keyboard focus or a tap: the wrapper takes focus because a disabled button lets the pointer through).
// C1146: the button text is the std label when given (Print / Reprint); confirm: true needs a second tap within 4 s.
let ARM = "", ARM_T = 0;
const ACT_ICON = { label: "🏷", message: "✉️", craft: "🤖", manual: "✍️", status: "🔄", shipped: "📦", follow_up: "🚩" };
function actionHtml(o, a){
  const id = `${o.order_ref}|${a.key}`;
  const busy = BUSY_ACT === id;
  const rowInputs = (Array.isArray(a.inputs) ? a.inputs : []).filter(n => !PAGE_INPUT[n]);
  const name = String(a.label || "").trim() || cap1(a.key), why = String(a.reason || ""), armed = ARM === id, tip = `${name}${a.enabled ? "" : " (not available)"}: ${why}`;
  const btn = `<span class="ab" tabindex="0" title="${esc(tip)}" data-tip="${esc(tip)}"><button class="${armed ? "arm" : a.enabled ? "pri" : ""}" data-act="${esc(a.key)}" data-ref="${esc(o.order_ref)}" ${a.enabled && !busy ? "" : "disabled"} aria-label="${esc(tip)}">${busy ? "…" : armed ? esc(`Tap again to ${name.toLowerCase()}`) : esc((ACT_ICON[a.key] ? ACT_ICON[a.key] + " " : "") + name)}</button></span>`;
  const inp = a.enabled ? rowInputs.map(n => `<div class="inp"><input data-inp="${esc(n)}" data-for="${esc(id)}" maxlength="160" placeholder="${esc(name)}: ${esc(cap1(n))} (optional)" aria-label="${esc(name)}: ${esc(cap1(n))}"><span class="cnt" data-cnt="${esc(id)}|${esc(n)}">0/160</span></div>`).join("") : "";
  return { btn, extra: `${inp}<div class="links" data-links="${esc(id)}"></div>` };
}

/* ============================== row context and quick filter ============================== */
// The context object is whatever the engine returns for the order (std pack_stages row_context fields plus, on this page
// only, the overlay buyer fields). Known fields get their own format; any other field is shown as name: value, so a field
// added in the standard appears without a page change.
let NOTES = [], TRUNC = false;
const ctxOf = o => isObj(o.context) ? o.context : {};
const KNOWN = ["buyer_username", "buyer_postcode", "country", "order_total", "currency", "item_count", "customs_badge"];
const BADGES = ["NI", "JE", "GG", "international", "?"];
const badgeCls = b => "c-" + (b === "?" ? "q" : String(b).replace(/[^A-Za-z0-9_-]/g, ""));
const filled = v => v !== undefined && v !== null && String(v) !== "";
function money(v, cur){
  if (!filled(v) || !Number.isFinite(+v)) return "";
  if (cur) { try { return new Intl.NumberFormat("en-GB", { style: "currency", currency: String(cur) }).format(+v); } catch (e) { return (+v).toFixed(2) + " " + cur; } }
  return (+v).toFixed(2);
}
function ctxHtml(o){
  const c = ctxOf(o), parts = [];
  if (filled(c.buyer_username)) parts.push(`<span class="u" title="buyer">${esc(c.buyer_username)}</span>`);
  if (filled(c.buyer_postcode)) parts.push(`<span class="pc" title="post code">${esc(c.buyer_postcode)}</span>`);
  if (filled(c.country)) parts.push(`<span title="country">${esc(c.country)}</span>`);
  const m = money(c.order_total, c.currency); if (m) parts.push(`<span title="order total">${esc(m)}</span>`);
  if (filled(c.item_count)) parts.push(`<span title="items">${esc(c.item_count)} item${+c.item_count === 1 ? "" : "s"}</span>`);
  if (filled(c.customs_badge)) parts.push(`<span class="chip ${badgeCls(c.customs_badge)}" title="${c.customs_badge === "?" ? "destination not resolved" : "customs paperwork expected"}">${esc(c.customs_badge)}</span>`);

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs", PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
let pdfjsP = null;
function pdfjs(){ if (!pdfjsP) pdfjsP = import(PDFJS).then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; }); return pdfjsP; }
function b64bytes(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
// C1220 (T689): render EVERY page of the label PDF at 300 dpi (a 4x6 page is 1200x1800) to PNG data URLs, in order; carriers add
// pages (customs forms, a second parcel, instructions). An image label is one page. The operator leaves pages out in the preview.
async function renderLabel(b64, type){
  if (!b64) return [];
  if (/^image\//.test(type)) return [`data:${type};base64,${b64}`];
  const lib = await pdfjs();
  const pdf = await lib.getDocument({ data: b64bytes(b64) }).promise;
  const out = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const v1 = page.getViewport({ scale: 1 }); const scale = Math.min(4, 1200 / Math.min(v1.width, v1.height));
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas"); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    out.push(c.toDataURL("image/png"));
  }
  return out;
}
function probeImage(url){ return new Promise(res => { if (!url) return res(false); const im = new Image(); const t = setTimeout(() => res(false), 4000); im.onload = () => { clearTimeout(t); res(true); }; im.onerror = () => { clearTimeout(t); res(false); }; im.src = url; }); }
// The preview frame is a distinct opaque origin inside the sandboxed bench, so the page never calls into it (U865): it posts and the document prints itself.
function doPrint(){ const w = $("#doc").contentWindow; if (!w) return; try { w.postMessage({ type: "packship:print" }, "*"); } catch (e) { toast("print blocked: " + e.message, true); } }

$("#labelBtn").onclick = () => { if (JOB && JOB.label) window.open(JOB.label, "_blank", "noopener"); };

    function lastv(){ const all = document.querySelectorAll(".pg"); all.forEach(p => p.classList.remove("lastv")); const on = [...all].filter(p => !p.classList.contains("off")); if (on.length) on[on.length - 1].classList.add("lastv"); }
    document.addEventListener("click", e => { const p = e.target.closest && e.target.closest(".pg"); if (p) { p.classList.toggle("off"); lastv(); } }); lastv();<\/script></body></html>`;

/* ============================== refresh (pack.refresh, polled) ============================== */
// The engine refuses a start while a sync chain sharing steps runs (outcome busy) and answers started with run_id and poll
// {op, every_ms, max_ms}. The page polls that op until the run is done, the budget runs out or the tab is closed.
const REFRESH = { running: false, run: "", poll: null };
function setRefresh(running, label){ REFRESH.running = running; const b = $("#refresh"); b.disabled = running; b.textContent = running ? (label || "Running…") : "Refresh"; }
async function checkBusy(){
  try { const r = await call("run_status", {}, true); if (r.status === "ok" && isObj(r.data) && r.data.busy === true) { setRefresh(true, "Sync running"); setSync("busy", "sync chain running"); return true; } }
  catch (e) { /* the button stays usable; the start itself is guarded */ }
  if (!REFRESH.run) setRefresh(false); return false;
}
async function waitNotBusy(every, max){ const t0 = Date.now(); while (Date.now() - t0 < max) { await sleep(every); if (!(await checkBusy())) return true; } return false; }
$("#refresh").onclick = async () => {
  setRefresh(true, "Starting…"); setSync("busy", "starting refresh");
  let r;
  try { r = await call("refresh", {}, true); } catch (e) { setRefresh(false); setSync("err", "error"); toast(e.message, true); return; }
  const poll = isObj(r.poll) ? r.poll : {}; const every = bound(poll.every_ms, 1000, 60000, 5000), max = bound(poll.max_ms, 10000, 3600000, 600000);
  if (r.outcome === "busy") { toast("Another sync chain is running; Refresh waits for it", true); setRefresh(true, "Sync running"); setSync("busy", "sync chain running"); if (await waitNotBusy(every, max)) loadStages(); return; }
  if (r.status !== "ok" || r.outcome !== "started" || !r.run_id) { setRefresh(false); setSync("err", r.outcome || "refused"); toast(`refresh ${r.outcome || "refused"}: ${r.message || ""}`, true); return; }
  REFRESH.run = r.run_id; REFRESH.poll = poll;
  const t0 = Date.now(); let last = null;
  while (Date.now() - t0 < max) {
    await sleep(every);
    let s; try { s = await call(String(poll.op || "run_status"), { run_ref: REFRESH.run }, true); } catch (e) { setSync("err", "poll error"); continue; }
    const run = isObj(s.data) ? s.data.run : null; if (!run) continue; last = run;
    const step = run.steps && run.steps.length ? run.steps[run.steps.length - 1].key : "";
    setRefresh(true, `Running ${Math.round((Date.now() - t0) / 1000)} s`); setSync("busy", `refresh ${run.state}${run.steps_done ? ` · step ${run.steps_done}${step ? " " + step : ""}` : ""}`);
    if (run.state === "done") break;
  }
  REFRESH.run = ""; setRefresh(false);
  if (last && last.state === "done") { toast(`Refresh ${last.outcome}: ${last.steps_done} steps in ${Math.round(last.duration_ms / 1000)} s`, last.outcome !== "ok"); await loadStages(); }
  else { setSync("err", "refresh unconfirmed"); toast("Refresh not confirmed within the poll budget; Reload when it lands", true); }
};
